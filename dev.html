<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#241529">
<title>CraveMood · Developer Console</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#241529">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== CraveMood — design tokens from the mockup ===== */
:root{
  --bg:#fff7fa; --ink:#3a2142; --mu:#7d6683; --sf:#fff; --ln:rgba(90,50,100,.14);
  --cr:#fff8ef; --pk:#ffb6d0; --pkb:#ff8fb8; --pk2:#ff5f98; --plum:#4a2a5e;
  --le:#f4f87f; --sk:#9fd6ff; --pe:#ffb98a; --mi:#a8ecd6; --li:#dccbff; --gd:#ffc800;
  --sh:0 10px 30px rgba(122,42,85,.10); --sh2:0 4px 0 rgba(122,42,85,.10);
  --r:24px; --r2:18px; --nav:264px;
}
[data-theme=dark]{
  --bg:#241529; --ink:#fff0f7; --mu:#d3b9cd; --sf:#35223b; --ln:rgba(255,255,255,.14);
  --cr:#2f1e35; --sh:0 10px 30px rgba(0,0,0,.35); --sh2:0 4px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(rgba(255,182,208,.42) 2px,transparent 2.6px);
  background-size:30px 30px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3,h4,b,button,.f{font-family:Fredoka,Nunito,sans-serif}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--pk);color:#3a2142}
.hide{display:none!important}
/* inline icon primitive — every icon() call gets a sane size */
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn .ic{width:17px;height:17px}
.link .ic{width:15px;height:15px}

/* ===== shell ===== */
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:var(--nav); background:var(--sf);
  border-right:1px solid var(--ln); padding:22px 16px; display:flex; flex-direction:column; gap:6px; z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 18px}
.lg{font:700 1.55rem/1 Fredoka;display:inline-flex;align-items:center;gap:4px;letter-spacing:-.4px}
.lg mark{background:#ff9ec5;color:#3a2142;padding:1px 9px 4px;border-radius:11px;transform:rotate(-3deg);
  box-shadow:0 4px 0 #f27aa8,0 8px 14px rgba(242,122,168,.32)}
.lg small{font:700 .58rem/1 Fredoka;letter-spacing:.18em;opacity:.5;text-transform:uppercase;margin-left:2px}
.navbtn{
  display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--mu);
  padding:11px 13px;border-radius:15px;cursor:pointer;font:600 .95rem Fredoka;text-align:left;
  transition:.22s cubic-bezier(.34,1.56,.64,1);position:relative;
}
.navbtn svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:color-mix(in srgb,var(--pk) 22%,transparent);color:var(--ink);transform:translateX(2px)}
.navbtn.on{background:var(--ink);color:var(--bg);box-shadow:0 6px 14px rgba(58,33,66,.22)}
.navbtn .bdg{margin-left:auto;background:var(--pk2);color:#fff;font:700 .7rem Fredoka;min-width:20px;height:20px;
  border-radius:99px;display:grid;place-items:center;padding:0 6px}
.navbtn.on .bdg{background:var(--pk);color:#3a2142}
.sidefoot{margin-top:auto;border-top:1px solid var(--ln);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.minicard{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ffe7f0,#fff3e8);border-radius:18px;padding:10px 12px}
[data-theme=dark] .minicard{background:linear-gradient(135deg,#4a2a5e,#3a2142)}
.minicard b{font-size:.86rem;display:block;line-height:1.2}
.minicard small{font-size:.7rem;color:var(--mu);font-weight:700}

main{margin-left:var(--nav);min-height:100vh;padding:26px 32px 60px}
.shell{max-width:1120px;margin:0 auto}
.topbar{display:none}

/* ===== generic ===== */
.view{display:none}
.view.on{display:block;animation:vin .34s cubic-bezier(.22,1,.36,1)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}}
.pagetitle{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagetitle h1{font-size:clamp(1.5rem,3vw,2.05rem);letter-spacing:-.5px}
.pagetitle p{color:var(--mu);font-size:.92rem;margin-top:3px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;box-shadow:var(--sh2)}
.card.tight{padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--mu)}
.sm{font-size:.8rem}
.xs{font-size:.72rem}

.btn{
  border:0;background:var(--pk2);color:#fff;font:700 .95rem Fredoka;padding:12px 24px;border-radius:99px;cursor:pointer;
  box-shadow:0 5px 0 #d63f74;transition:.16s cubic-bezier(.34,1.56,.64,1);display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 #d63f74}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d63f74}
.btn.ghost{background:transparent;color:var(--ink);border:1.6px solid var(--ln);box-shadow:none}
.btn.ghost:hover{border-color:var(--pkb);background:color-mix(in srgb,var(--pk) 16%,transparent);transform:none}
.btn.plum{background:var(--plum);box-shadow:0 5px 0 #2a1634}
.btn.plum:hover{box-shadow:0 6px 0 #2a1634}
.btn.plum:active{box-shadow:0 1px 0 #2a1634}
.btn.sm{padding:8px 16px;font-size:.82rem;box-shadow:0 4px 0 #d63f74}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 #d63f74}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn.block{width:100%}
.iconbtn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;transition:.2s}
.iconbtn:hover{background:color-mix(in srgb,var(--pk) 26%,transparent)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tag{display:inline-flex;align-items:center;gap:4px;font:700 .66rem Fredoka;padding:3px 10px;border-radius:99px;background:var(--cr);color:var(--ink)}
.bdg{background:var(--pk2);color:#fff;font:700 .62rem Fredoka;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;line-height:1}
.tag.pink{background:#f08fb4;color:#fff}
.tag.dark{background:var(--ink);color:var(--bg)}
.tag.mint{background:#b7e3d0}
.tag.gold{background:#ffe6a8}

/* ===== onboarding ===== */
.onboard{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse 90% 40% at 50% 18%,rgba(255,255,255,.92),rgba(255,255,255,0) 70%),linear-gradient(180deg,#ffe3ec,#ffd9e6 55%,#ffe8d8)}
[data-theme=dark] .onboard{background:radial-gradient(ellipse 90% 40% at 50% 18%,rgba(255,158,197,.18),transparent 70%),linear-gradient(180deg,#2b1830,#241529)}
.onboard .box{width:min(430px,100%);text-align:center}
.onboard .cimo{width:180px;margin:0 auto -20px;cursor:pointer;position:relative;z-index:2;filter:drop-shadow(0 10px 16px rgba(122,42,85,.16))}
.onboard .cimo svg{width:100%;height:auto}
.onboard h2{font-size:1.7rem;letter-spacing:-.4px}
.onboard p.sub{color:var(--mu);font-size:.88rem;margin:6px 0 18px}
.onboard .sheetbox{background:var(--sf);border-radius:30px;padding:20px 20px 24px;box-shadow:0 24px 60px rgba(122,42,85,.22);text-align:left}
.field{margin-bottom:12px}
.field label{display:block;font:700 .76rem Fredoka;color:var(--mu);margin:0 0 5px 4px;letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;border:1.8px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:14px;
  padding:11px 14px;font:600 .9rem Nunito;outline:none;transition:.18s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pk2);background:var(--sf);box-shadow:0 0 0 4px color-mix(in srgb,var(--pk) 32%,transparent)}
.field textarea{resize:vertical;min-height:70px}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.langopt{display:flex;align-items:center;gap:8px;border:1.8px solid var(--ln);background:var(--bg);border-radius:14px;padding:9px 11px;cursor:pointer;font:700 .84rem Fredoka;transition:.18s}
.langopt:hover{border-color:var(--pkb)}
.langopt.on{border-color:var(--pk2);background:color-mix(in srgb,var(--pk) 22%,var(--sf));box-shadow:0 3px 0 color-mix(in srgb,var(--pk2) 40%,transparent)}
.langopt i{font-style:normal;font-size:1.05rem}
.hint{font-size:.72rem;color:var(--mu);line-height:1.45}
.err{color:#d63f74;font-size:.75rem;font-weight:700;margin-top:4px;min-height:1em}

/* ===== beranda ===== */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:24px 26px;display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:center;
  background:linear-gradient(135deg,#ffe3ec,#ffd9e6 55%,#ffe8d8);border:1px solid var(--ln)}
[data-theme=dark] .hero{background:linear-gradient(135deg,#3d2347,#33203a 55%,#3a2434)}
.hero .say{display:inline-block;background:var(--sf);border-radius:16px 16px 16px 5px;padding:8px 15px;font:700 .84rem Fredoka;
  box-shadow:0 4px 0 rgba(122,42,85,.12);animation:say .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes say{from{transform:scale(.85);opacity:0}}
.hero h1{font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.1;margin:12px 0 6px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--pk2)}
.hero p{color:var(--mu);font-size:.9rem;max-width:330px}
.hero .cimobox{display:grid;place-items:center;position:relative}
.hero .cimobox .halo{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);animation:pulseHalo 4s ease-in-out infinite}
@keyframes pulseHalo{50%{transform:scale(1.08);opacity:.7}}
.hero .cimobox svg{position:relative;cursor:pointer;filter:drop-shadow(0 14px 18px rgba(122,42,85,.18))}
.hero .cimobox svg.hop{animation:hop .62s cubic-bezier(.3,1.7,.5,1)}
@keyframes hop{30%{transform:translateY(-26px) scaleY(1.07)}60%{transform:translateY(0) scaleY(.92)}}
.float{animation:flt 3.4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}

.sectitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sectitle h2{font-size:1.12rem;display:flex;align-items:center;gap:8px}
.sectitle h2 span.n{width:24px;height:24px;border-radius:50%;background:var(--pk);color:#3a2142;font:700 .74rem Fredoka;display:grid;place-items:center}
.sectitle .link{background:none;border:0;color:var(--pk2);font:700 .82rem Fredoka;cursor:pointer;display:inline-flex;align-items:center;gap:4px}

.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mood{background:color-mix(in srgb,var(--c) 26%,var(--sf));border:2px solid var(--ln);border-radius:20px;padding:10px 4px 8px;cursor:pointer;text-align:center;
  transition:.26s cubic-bezier(.34,1.56,.64,1);color:var(--ink);position:relative;overflow:hidden}
.mood:hover{transform:translateY(-5px) rotate(-1deg);border-color:var(--c)}
.mood.on{border-color:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-4px)}
.mood .face{display:grid;place-items:center;height:56px}
.mood b{font-size:.78rem;display:block;line-height:1.2}
.mood.on::after{content:"";position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--c) 16%,transparent);pointer-events:none}

.locbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:7px 8px 7px 16px;margin:16px 0 4px}
.locbar svg{width:17px;height:17px;stroke:var(--pk2);fill:none;stroke-width:2.2;flex:none}
.locbar select{border:0;background:transparent;color:var(--ink);font:700 .84rem Nunito;outline:none;flex:1;min-width:140px;cursor:pointer}
.locbar .dist{font:700 .72rem Fredoka;background:var(--cr);padding:5px 12px;border-radius:99px;color:var(--mu)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.6px solid var(--ln);background:var(--sf);color:var(--mu);font:700 .78rem Fredoka;
  padding:7px 15px;border-radius:99px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--pkb);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}

.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rec{background:var(--sf);border:1px solid var(--ln);border-radius:26px;overflow:hidden;position:relative;
  transition:.28s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column}
.rec:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(122,42,85,.16)}
.rec .pic{height:150px;display:grid;place-items:center;position:relative;overflow:hidden}
.rec .pic > svg{height:104px;width:auto;transition:.4s cubic-bezier(.34,1.56,.64,1)}
.rec:hover .pic > svg{transform:scale(1.08) rotate(-3deg)}
.rec .pic .cimomini{position:absolute;left:7px;bottom:3px;opacity:.95;line-height:0}
.rec .pic .cimomini svg{width:28px;height:auto}
.rec .pic .badge{position:absolute;top:9px;left:9px}
.rec .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.rec h4{font-size:1rem;line-height:1.2}
.rec .stall{font-size:.74rem;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:3px}
.rec .meta{font-size:.7rem;color:var(--mu);display:flex;gap:6px;flex-wrap:wrap}
.rec .meta b{color:#e8a300;font-weight:700}
.rec .price{margin-top:auto;padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.rec .price b{font:700 .84rem Fredoka;color:var(--pk2)}
.addbtn{border:1.8px solid var(--pk2);background:var(--sf);color:var(--pk2);font:700 .74rem Fredoka;padding:6px 13px;
  border-radius:99px;cursor:pointer;transition:.18s;white-space:nowrap}
.addbtn:hover{background:var(--pk2);color:#fff}
.addbtn:active{transform:scale(.9)}
.step{display:inline-flex;align-items:center;background:var(--pk2);border-radius:99px;color:#fff;overflow:hidden}
.step button{border:0;background:none;color:#fff;font:700 1rem Fredoka;width:27px;height:27px;cursor:pointer;line-height:1}
.step button:hover{background:rgba(0,0,0,.12)}
.step i{font-style:normal;font-weight:800;min-width:16px;text-align:center;font-size:.76rem}

.empty{text-align:center;padding:34px 16px;color:var(--mu)}
.empty .big{width:110px;margin:0 auto 8px;opacity:.85}

/* ===== spinner ===== */
.spinwrap{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:center}
.wheelbox{position:relative;display:grid;place-items:center;padding:8px}
.wheel{width:min(370px,80vw);aspect-ratio:1;border-radius:50%;position:relative;
  box-shadow:0 18px 40px rgba(122,42,85,.22),inset 0 0 0 10px var(--sf),inset 0 0 0 13px rgba(90,50,100,.10);
  transition:transform 4.6s cubic-bezier(.12,.72,.06,1);will-change:transform}
.wheel .seg{position:absolute;inset:0;pointer-events:none;font:700 .82rem/1.14 Fredoka;color:#3a2142;letter-spacing:-.1px}
.wheel .seg span{position:absolute;width:102px;margin:0;text-align:center;white-space:normal;word-break:break-word;
  transform:translate(-50%,-50%);text-shadow:0 1px 0 rgba(255,255,255,.75),0 0 6px rgba(255,255,255,.55)}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.hub{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--sf);display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(122,42,85,.25);z-index:2;border:3px solid var(--pk)}
.spininfo h2{font-size:1.5rem;letter-spacing:-.4px;margin-bottom:6px}
.spininfo p{color:var(--mu);font-size:.9rem;margin-bottom:14px}
.spinres{display:flex;gap:12px;align-items:center;background:var(--cr);border-radius:20px;padding:12px;margin-top:14px;animation:say .45s cubic-bezier(.34,1.56,.64,1)}
.spinres .pic{width:74px;height:74px;border-radius:16px;display:grid;place-items:center;flex:none}
.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.history span{font:700 .68rem Fredoka;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 10px;color:var(--mu)}

/* ===== chat ===== */
.chatwrap{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 200px);min-height:460px;
  background:var(--sf);border:1px solid var(--ln);border-radius:30px;overflow:hidden;box-shadow:var(--sh)}
.chathead{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--ln);
  background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 26%,var(--sf)),var(--sf))}
.chathead .av{width:44px;height:44px;border-radius:50%;background:#fff3f8;display:grid;place-items:center;flex:none;position:relative;border:1px solid var(--ln)}
[data-theme=dark] .chathead .av{background:#4a2a5e}
.chathead .av .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3ec98a;border:2px solid var(--sf)}
.chathead b{font-size:.98rem;display:block;line-height:1.2}
.chathead small{font-size:.72rem;color:var(--mu);font-weight:700}
.chatbody{overflow-y:auto;padding:16px 16px 6px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chatbody::-webkit-scrollbar{width:7px}
.chatbody::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px}
.day{text-align:center;font:700 .68rem Fredoka;color:var(--mu);margin:4px 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:msgIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(9px) scale(.97)}}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;border-radius:50%;background:#fff3f8;display:grid;place-items:center;flex:none;overflow:hidden}
[data-theme=dark] .msg .av{background:#4a2a5e}
.bub{background:var(--cr);border-radius:18px 18px 18px 5px;padding:9px 14px;font-size:.875rem;line-height:1.55;
  box-shadow:0 2px 0 rgba(122,42,85,.06);white-space:pre-wrap;word-break:break-word}
[data-theme=dark] .bub{background:#42294b}
.msg.me .bub{background:var(--plum);color:#fff;border-radius:18px 18px 5px 18px}
.bub .em{font-size:1.05rem;vertical-align:-.1em}
.typing{display:flex;gap:4px;padding:12px 15px;background:var(--cr);border-radius:18px 18px 18px 5px;width:max-content}
[data-theme=dark] .typing{background:#42294b}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1.5px solid var(--ln);background:var(--sf);color:var(--mu);font:700 .74rem Fredoka;
  padding:6px 13px;border-radius:99px;cursor:pointer;transition:.18s}
.quick button:hover{border-color:var(--pk2);color:var(--pk2)}
.composer{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--ln);align-items:flex-end;background:var(--sf)}

.devmain{margin-left:236px;flex:1;padding:24px 28px 60px;max-width:1180px}
.devhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.devhead h1{font-size:1.5rem;letter-spacing:-.4px}
.devhead p{color:var(--mu);font-size:.84rem}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font:700 .7rem Fredoka;
  background:var(--cr);border:1px solid var(--ln);color:var(--ink)}
.pill i{width:7px;height:7px;border-radius:50%;background:#3ec98a;display:block}
.pill.off i{background:#d63f74}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:13px 15px}
.kpi b{display:block;font-size:1.55rem;line-height:1.1;color:var(--ink)}
.kpi small{font-size:.68rem;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.kpi.acc b{color:var(--pk2)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dcard{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px}
.dcard h3{font-size:.9rem;margin-bottom:10px;display:flex;align-items:center;gap:6px}

<script>
/* ===== Cimo mascot (SVG) — ported 1:1 from the design mockup ===== */
const MOODC = {
  def:    ['#ffa9c9', '#f27aa8'],
  senang: ['#eef26b', '#c9d445'],
  sedih:  ['#8fd3ff', '#5eb0ee'],
  marah:  ['#ffac78', '#f2864c'],
  capek:  ['#f3f6fc', '#cfd5e6'],
  kecewa: ['#ecd7ab', '#cdb27e'],
  bingung:['#9fead0', '#68cdaa'],
};
const MOODLBL = {def:'Cimo', senang:'Senang', sedih:'Sedih', marah:'Marah', capek:'Capek', kecewa:'Kecewa', bingung:'Bingung'};
let _cu = 0;

function cimo(mood, size, peek, costume) {
  mood = MOODC[mood] ? mood : 'def';
  size = size || 120;
  const [a, b] = MOODC[mood], g = 'c' + (_cu++), k = '#2f2a6b';
  const eye = (x, ry, py) => {
    ry = ry === undefined ? 14 : ry; py = py || 0;
    return `<ellipse cx="${x}" cy="${88 + py}" rx="12" ry="${ry}" fill="${k}"/><circle cx="${x + 4}" cy="${82 + py}" r="4.6" fill="#fff"/><circle cx="${x - 3}" cy="${95 + py}" r="2.2" fill="#fff"/>`;
  };
  const st = (d, w) => `<path d="${d}" fill="none" stroke="${k}" stroke-width="${w || 4}" stroke-linecap="round" stroke-linejoin="round"/>`;
  let e = eye(76) + eye(124), x = '', mo = st('M90 110Q100 119 110 110');
  const TY = {def:0, senang:0, sedih:4, marah:2, capek:0, kecewa:6, bingung:0};
  x += `<g transform="translate(0 ${TY[mood]})">` + st('M60 74l-6-4M64 69l-3-6M140 74l6-4M136 69l3-6', 3) + '</g>';

  if (mood === 'senang') {
    mo = '<path d="M84 106Q100 134 116 106Z" fill="#7a2a55"/><ellipse cx="100" cy="122" rx="8" ry="4.5" fill="#ff8fa8"/>';
    x += '<path d="M24 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM168 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#ffc800"/>';
  }
  if (mood === 'sedih') {
    e = eye(76, 15, 4) + eye(124, 15, 4);
    x += '<path d="M64 108q-6 10 0 13q6-3 0-13z" fill="#fff" opacity=".9"/>';
    mo = st('M88 122Q100 110 112 122');
  }
  if (mood === 'marah') {
    e = eye(76, 11, 2) + eye(124, 11, 2);
    x += '<path d="M150 34l12 12M162 34l-12 12" stroke="#ff4d4d" stroke-width="4.5" stroke-linecap="round"/>';
    mo = st('M88 121Q100 112 112 121');
  }
  if (mood === 'capek') {
    e += `<rect x="62" y="68" width="28" height="20" fill="${a}"/><rect x="110" y="68" width="28" height="20" fill="${a}"/>` + st('M62 88h28M110 88h28');
    mo = st('M91 119h18');
    x += '<path d="M72 12v16M86 6v22M100 4v24M114 6v22M128 12v16" stroke="#8a8fa8" stroke-width="2.5" stroke-linecap="round"/>';
  }
  if (mood === 'kecewa') {
    e = eye(76, 12, 6) + eye(124, 12, 6);
    x += '<path d="M154 50q-6 10 0 13q6-3 0-13z" fill="#bfe6ff" stroke="#6db6f3" stroke-width="2"/>';
    mo = st('M89 121Q100 113 111 121');
  }
  if (mood === 'bingung') {
    e = eye(76, 14) + eye(124, 10, -2);
    x += '<g fill="none" stroke="#2fae8a" stroke-width="3" stroke-linecap="round"><path d="M36 38a8 8 0 1 1 8 8a4 4 0 1 1-4-4"/><path d="M160 36a8 8 0 1 1 8 8a4 4 0 1 1-4-4"/></g><text x="92" y="28" font-size="28" font-weight="700" fill="#2fae8a" font-family="Fredoka,sans-serif">?</text>';
    mo = st('M86 117q7-8 14 0t14 0');
  }
  const core = `<ellipse cx="100" cy="96" rx="70" ry="62" fill="${b}"/><g clip-path="url(#${g})"><ellipse cx="93" cy="89" rx="68" ry="60" fill="${a}"/></g><ellipse cx="62" cy="56" rx="15" ry="8" transform="rotate(-28 62 56)" fill="#fff" opacity=".55"/><circle cx="82" cy="45" r="3.4" fill="#fff" opacity=".55"/><ellipse cx="52" cy="108" rx="11" ry="7" fill="#ff6f9c" opacity=".42"/><ellipse cx="148" cy="108" rx="11" ry="7" fill="#ff6f9c" opacity=".42"/><g fill="#fff" opacity=".6"><circle cx="146" cy="130" r="2"/><circle cx="156" cy="124" r="1.6"/><circle cx="52" cy="132" r="1.8"/><circle cx="62" cy="138" r="1.5"/></g>${e}${x}${mo}`;
  const defs = `<defs><clipPath id="${g}"><ellipse cx="100" cy="96" rx="70" ry="62"/></clipPath><clipPath id="${g}c"><rect x="-10" y="0" width="220" height="138"/></clipPath></defs>`;

  let body;
  if (peek) {
    const hd = cx => `<circle cx="${cx}" cy="139" r="15" fill="${a}" stroke="${b}" stroke-width="1.6"/><circle cx="${cx - 5}" cy="133" r="3.2" fill="#fff" opacity=".5"/>`;
    body = `<svg viewBox="0 18 200 142" width="${size}" style="overflow:visible" role="img" aria-label="Cimo mengintip ${mood}">${defs}<g clip-path="url(#${g}c)">${core}</g>${hd(38)}${hd(162)}</svg>`;
  } else {
    body = `<svg viewBox="0 0 200 185" width="${size}" role="img" aria-label="Cimo ${mood}">${defs}<ellipse cx="100" cy="173" rx="56" ry="7" fill="#3a2142" opacity=".1"/><ellipse cx="78" cy="159" rx="17" ry="9" fill="${b}"/><ellipse cx="122" cy="159" rx="17" ry="9" fill="${b}"/><ellipse cx="32" cy="106" rx="12" ry="14" transform="rotate(-20 32 106)" fill="${a}"/><ellipse cx="168" cy="100" rx="12" ry="14" transform="rotate(20 168 100)" fill="${a}"/>${core}</svg>`;
  }
  if (!costume) return body;
  // costume overlay
  const dk = MOODC[mood][1], g2 = 'k' + (_cu++);
  let o = '';
  if (costume === 'crown') o += `<path d="M68 46L72 20L88 34L100 12L112 34L128 20L132 46Z" fill="#ffd25e" stroke="#e0a82e" stroke-width="3" stroke-linejoin="round"/><circle cx="72" cy="20" r="4" fill="#ff8fb8"/><circle cx="100" cy="12" r="4.5" fill="#8fd3ff"/><circle cx="128" cy="20" r="4" fill="#ff8fb8"/>`;
  if (costume === 'koki') o += `<g stroke="${dk}" stroke-width="2.5"><circle cx="72" cy="26" r="16" fill="#fff"/><circle cx="100" cy="16" r="20" fill="#fff"/><circle cx="128" cy="26" r="16" fill="#fff"/></g><rect x="64" y="30" width="72" height="19" rx="5" fill="#fff" stroke="${dk}" stroke-width="2.5"/><path d="M78 126H122L100 150Z" fill="#ff8fb8"/>`;
  if (costume === 'batik') o += `<g clip-path="url(#${g2})"><path d="M24 132Q100 152 176 132V176H24Z" fill="#7a4a2a"/><path d="M24 132Q100 152 176 132" fill="none" stroke="#e0b25a" stroke-width="3.5"/></g>`;
  return `<div style="position:relative;display:inline-block;line-height:0">${body}<svg viewBox="0 0 200 185" width="${size}" style="position:absolute;left:0;top:0"><defs><clipPath id="${g2}"><ellipse cx="100" cy="96" rx="70" ry="62"/></clipPath></defs>${o}</svg></div>`;
}

/* standalone SVG for canvas export */
function cimoSVG(mood, size) {
  const s = cimo(mood, size || 300).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  return s;
}

/* ===== database layer =====
   Works in two modes:
   1. remote  — if a CraveMood API is reachable (server/server.js), all writes go there
   2. local   — otherwise a JSON store in localStorage (default on GitHub Pages)
   Schema is identical in both modes, see db/schema.sql
*/
const DB = (() => {
  const KEY = 'cravemood.db.v1';
  const SCHEMA = { v: 1, users: [], moods: [], orders: [], chats: [], spins: [], umkms: [], settings: {} };
  let state = null, remote = false, base = '', ready = false;

  const uid = () => 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(clone(SCHEMA), JSON.parse(raw)) : clone(SCHEMA);
    } catch (e) { state = clone(SCHEMA); }
    if (!Array.isArray(state.users)) state.users = [];
    return state;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn('DB: quota', e); }
  }

  /* password hashing — SHA-256 when available, deterministic fallback otherwise */
  async function hash(pw, salt) {
    const txt = salt + '::' + pw + '::cravemood';
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* insecure context */ }
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < txt.length; i++) {
      h1 ^= txt.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ txt.charCodeAt(i), 2654435761) >>> 0;
    }
    return 'fnv' + h1.toString(16) + h2.toString(16);
  }

  async function probe() {
    base = (window.CRAVEMOOD_API || '').replace(/\/$/, '');
    if (!base && location.protocol === 'file:') return false;
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 1200);
      const r = await fetch((base || '') + '/api/health', { signal: c.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j && j.ok);
    } catch (e) { return false; }
  }

  async function api(path, body, key) {
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers['X-Admin-Key'] = key;
    const r = await fetch(base + path, {
      method: body ? 'POST' : 'GET',
      headers: headers,
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store',
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  /* ---- public API ---- */
  return {
    get isRemote() { return remote; },
    get ready() { return ready; },

    async init() {
      remote = await probe();
      ready = true;
      return remote;
    },

    /* account */
    async register({ name, contact, password, lang, guest }) {
      if (remote) {
        const j = await api('/api/register', { name, contact, password, lang, guest });
        return j;
      }
      const s = load();
      const c = String(contact || '').trim().toLowerCase();
      if (!guest && s.users.some(u => (u.contact || '').toLowerCase() === c)) {
        return { ok: false, error: 'exists' };
      }
      const salt = Math.random().toString(36).slice(2, 10);
      const u = {
        id: uid(), name: String(name || '').trim().slice(0, 40),
        contact: c, lang: lang || 'id', salt,
        pw: guest ? '' : await hash(password || '', salt),
        guest: !!guest,
        created: new Date().toISOString(),
        last_seen: new Date().toISOString(),
        moods: 0, orders: 0, chats: 0, spins: 0,
        vip: false, vip_expiry: null, umkm: null,
      };
      s.users.push(u); persist();
      return { ok: true, user: pub(u) };
    },

    async login({ contact, password }) {
      if (remote) return api('/api/login', { contact, password });
      const s = load();
      const c = String(contact || '').trim().toLowerCase();
      const u = s.users.find(x => (x.contact || '').toLowerCase() === c && !x.guest);
      if (!u) return { ok: false, error: 'bad' };
      const h = await hash(password || '', u.salt);
      if (h !== u.pw) return { ok: false, error: 'bad' };
      u.last_seen = new Date().toISOString(); persist();
      return { ok: true, user: pub(u) };
    },

    async me(id) {
      if (!id) return null;
      if (remote) {
        try { const j = await api('/api/me?id=' + encodeURIComponent(id)); return j.ok ? j.user : null; }
        catch (e) { return null; }
      }
      const u = load().users.find(x => x.id === id);
      return u ? pub(u) : null;
    },

    async users(adminKey) {
      if (remote) { const j = await api('/api/users', null, adminKey); return j.users || []; }
      return load().users.map(pub);
    },

    async touch(id) {
      if (remote) return;
      const u = load().users.find(x => x.id === id);
      if (u) { u.last_seen = new Date().toISOString(); persist(); }
    },

    /* activity */
    async addMood(userId, mood, date) {
      const d = date || new Date().toISOString().slice(0, 10);
      if (remote) { try { await api('/api/mood', { userId, mood, date: d }); } catch (e) {} }
      const s = load();
      s.moods = s.moods.filter(m => !(m.user_id === userId && m.date === d));
      s.moods.push({ user_id: userId, mood, date: d, at: new Date().toISOString() });
      const u = s.users.find(x => x.id === userId); if (u) u.moods = (u.moods || 0) + 1;
      persist();
    },

    async addOrder(userId, payload) {
      if (remote) { try { await api('/api/order', Object.assign({ userId }, payload)); } catch (e) {} }
      const s = load();
      s.orders.push(Object.assign({ id: 'o_' + Date.now().toString(36), user_id: userId, at: new Date().toISOString() }, payload));
      const u = s.users.find(x => x.id === userId); if (u) u.orders = (u.orders || 0) + 1;
      persist();
    },

    async logChat(userId, role, text) {
      const s = load();
      s.chats.push({ user_id: userId, role, text: String(text).slice(0, 500), at: new Date().toISOString() });
      if (s.chats.length > 800) s.chats = s.chats.slice(-800);
      const u = s.users.find(x => x.id === userId); if (u) u.chats = (u.chats || 0) + 1;
      persist();
    },

    async logSpin(userId, item) {
      const s = load();
      s.spins.push({ user_id: userId, item, at: new Date().toISOString() });
      if (s.spins.length > 500) s.spins = s.spins.slice(-500);
      const u = s.users.find(x => x.id === userId); if (u) u.spins = (u.spins || 0) + 1;
      persist();
    },

    moodsOf(userId) {
      return load().moods.filter(m => m.user_id === userId).map(m => ({ d: m.date, m: m.mood }));
    },

    /* VIP */
    async setVip(userId, active, expiry) {
      if (remote) { try { await api('/api/vip', { userId, active, expiry }); } catch (e) {} }
      const s = load();
      const u = s.users.find(x => x.id === userId);
      if (u) { u.vip = !!active; u.vip_expiry = expiry || null; persist(); }
    },

    isVip(userId) {
      const u = load().users.find(x => x.id === userId);
      if (!u || !u.vip) return false;
      if (u.vip_expiry && new Date(u.vip_expiry) < new Date()) { u.vip = false; persist(); return false; }
      return true;
    },

    /* UMKM */
    async registerUmkm(userId, data) {
      if (remote) { const j = await api('/api/umkm', Object.assign({ userId }, data)); return j; }
      const s = load();
      const entry = Object.assign({
        id: 'umkm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        user_id: userId, status: 'pending', created: new Date().toISOString(),
        views: 0, clicks: 0, rating: 0, menus: [],
      }, data);
      s.umkms.push(entry);
      const u = s.users.find(x => x.id === userId); if (u) u.umkm = entry.id;
      persist();
      return { ok: true, umkm: entry };
    },

    getUmkm(userId) {
      const s = load();
      const u = s.users.find(x => x.id === userId);
      if (!u || !u.umkm) return null;
      return s.umkms.find(x => x.id === u.umkm) || null;
    },

    /* settings blob (per device) */
    getSetting(k, dflt) {
      const s = load();
      return (s.settings && s.settings[k] !== undefined) ? s.settings[k] : dflt;
    },
    setSetting(k, v) {
      const s = load();
      s.settings[k] = v; persist();
    },

    /* export */
    dump() { return clone(load()); },
    async exportJSON(adminKey) {
      let data = null;
      if (remote && adminKey) { try { data = await api('/api/export', null, adminKey); } catch (e) { data = null; } }
      if (!data) data = load();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      dl(blob, 'cravemood-database-' + new Date().toISOString().slice(0, 10) + '.json');
    },
    async exportCSV(adminKey) {
      const rows = await this.users(adminKey);
      const head = ['id', 'name', 'contact', 'lang', 'guest', 'created', 'last_seen', 'moods', 'orders', 'chats', 'spins'];
      const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const csv = [head.join(',')].concat(rows.map(r => head.map(h => esc(r[h])).join(','))).join('\r\n');
      dl(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), 'cravemood-registrants.csv');
    },
  };

  function pub(u) {
    return {
      id: u.id, name: u.name, contact: u.contact, lang: u.lang, guest: !!u.guest,
      created: u.created, last_seen: u.last_seen,
      moods: u.moods || 0, orders: u.orders || 0, chats: u.chats || 0, spins: u.spins || 0,
      vip: !!u.vip, vip_expiry: u.vip_expiry || null, umkm: u.umkm || null,
    };
  }
  function dl(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  }
})();

async function tryLogin(k, silent) {
  if (DB.isRemote) {
    try {
      const r = await fetch('api/users', { headers: { 'X-Admin-Key': k }, cache: 'no-store' });
      if (!r.ok) return false;
    } catch (e) { return false; }
  } else if (k !== 'cimo2026' && k !== 'cravemood') return false;
  DC.key = k;
  sessionStorage.setItem('cm_dev_key', k);
  try { await load(); } catch (e) { if (!silent) toast('Gagal memuat: ' + e.message); return false; }
  return true;
}

async function load() {
  if (DB.isRemote) {
    const r = await fetch('api/export?key=' + encodeURIComponent(DC.key), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DC.data = await r.json();
    try {
      const s = await fetch('api/ai/status', { cache: 'no-store' });
      const j = await s.json(); DC.ai = { enabled: !!j.enabled, model: j.model || '' };
    } catch (e) { DC.ai = { enabled: false, model: '' }; }
  } else {
    DC.data = DB.dump();
    DC.ai = { enabled: false, model: '' };
  }
  ['users', 'moods', 'orders', 'chats', 'spins', 'umkms'].forEach(k => { if (!Array.isArray(DC.data[k])) DC.data[k] = []; });
  $('#gate').innerHTML = '';
  $('#console').classList.remove('hide');
  render();
}

  const members = U.filter(u => !u.guest).length;
  const days = {};
  (d.moods || []).forEach(m => days[m.date] = (days[m.date] || 0) + 1);
  const moodCount = {};
  (d.moods || []).forEach(m => moodCount[m.mood] = (moodCount[m.mood] || 0) + 1);
  const mxMood = Math.max(1, ...Object.values(moodCount));

  // signups last 14 days
  const today = new Date(); const series = [];
  for (let i = 13; i >= 0; i--) {
    const dt2 = new Date(today); dt2.setDate(today.getDate() - i);
    const key = dt2.toISOString().slice(0, 10);
    series.push({ key, n: U.filter(u => (u.created || '').slice(0, 10) === key).length });
  }
  const mxS = Math.max(1, ...series.map(s => s.n));

  const spinCount = {};
  (d.spins || []).forEach(s => spinCount[s.item] = (spinCount[s.item] || 0) + 1);
  const topDish = Object.entries(spinCount).sort((a, b) => b[1] - a[1]).slice(0, 5);

  return `
  <div class="kpis">
    <div class="kpi acc"><small>Pengguna</small><b>${nf(U.length)}</b></div>
    <div class="kpi"><small>Member</small><b>${nf(members)}</b></div>
    <div class="kpi"><small>Mood dicatat</small><b>${nf((d.moods || []).length)}</b></div>
    <div class="kpi"><small>Chat</small><b>${nf((d.chats || []).length)}</b></div>
    <div class="kpi"><small>Pesanan</small><b>${nf((d.orders || []).length)}</b></div>
    <div class="kpi"><small>Putaran</small><b>${nf((d.spins || []).length)}</b></div>
  </div>
  <div class="dgrid">
    <div class="dcard">
      <h3>Pendaftar 14 hari terakhir</h3>
      <div class="spark">${series.map(s => `<i style="height:${Math.max(4, (s.n / mxS) * 100)}%" title="${s.key}: ${s.n}"></i>`).join('')}</div>
      <div class="mini" style="display:flex;justify-content:space-between;margin-top:6px">
        <span>${series[0].key.slice(5)}</span><span>${series[series.length - 1].key.slice(5)}</span></div>
    </div>
    <div class="dcard">
      <h3>Distribusi mood</h3>
      ${MOODS.map(m => {
        const v = moodCount[m.k] || 0;
        return `<div class="dbar"><span class="lbl"><span style="width:18px;height:18px">${cimo(m.face, 16)}</span>${m.label}</span>
          <div class="tr"><i style="width:${(v / mxMood) * 100}%;background:${m.c}"></i></div><span class="v">${v}</span></div>`;
      }).join('')}
    </div>
    <div class="dcard">
      <h3>Menu paling sering diputar</h3>
      ${topDish.length ? topDish.map(([id, v]) => `<div class="dbar"><span class="lbl" style="width:120px">${esc(dishOf(id).name)}</span>
        <div class="tr"><i style="width:${(v / topDish[0][1]) * 100}%;background:var(--pk2)"></i></div><span class="v">${v}</span></div>`).join('')
        : '<p class="mini">Belum ada data putaran.</p>'}
    </div>
    <div class="dcard">
      <h3>Status sistem</h3>
      <div class="dbar"><span class="lbl" style="width:100px">Database</span><b style="font-size:.74rem">${DB.isRemote ? 'API server' : 'localStorage'}</b></div>
      <div class="dbar"><span class="lbl" style="width:100px">Otak Cimo</span><b style="font-size:.74rem">${DC.ai.enabled ? 'AI aktif (' + esc(DC.ai.model) + ')' : 'Mesin lokal'}</b></div>
      <div class="dbar"><span class="lbl" style="width:100px">Hari tercatat</span><b style="font-size:.74rem">${Object.keys(days).length}</b></div>
      <button class="btn sm block" data-go="export" style="margin-top:10px">Unduh database</button>
    </div>
  </div>`;
}

function searchBar(ph) {
  return `<div class="searchrow"><input id="dq" placeholder="${ph}" value="${esc(DC.q)}">
    <button class="btn sm ghost" id="dqClear">Reset</button></div>`;
}

function vUsers() {
  const q = DC.q.toLowerCase();
  const rows = (DC.data.users || []).filter(u => !q || JSON.stringify(u).toLowerCase().includes(q))
    .sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  return `<div class="dcard">
    <h3>Pengguna terdaftar <span class="tag">${rows.length}</span></h3>
    ${searchBar('Cari nama, kontak, bahasa…')}
    <div class="row" style="margin-bottom:10px">
      <button class="btn sm ghost" id="csvUsers">Unduh CSV</button>
      <span class="mini">Termasuk tamu (guest).</span>
    </div>
    <div class="dtable"><table><thead><tr>
      <th>Nama</th><th>Kontak</th><th>Bahasa</th><th>Status</th><th>Daftar</th><th>Terakhir</th><th>Mood</th><th>Chat</th><th>Order</th><th>Spin</th>
    </tr></thead><tbody>
      ${rows.length ? rows.map(u => `<tr>
        <td><b>${esc(u.name)}</b></td>
        <td>${esc(u.contact || '—')}</td>
        <td>${esc(u.lang || 'id')}</td>
        <td>${u.guest ? '<span class="tag">guest</span>' : '<span class="tag mint">member</span>'}</td>
        <td>${dOnly(u.created)}</td><td>${dt(u.last_seen)}</td>
        <td>${u.moods || 0}</td><td>${u.chats || 0}</td><td>${u.orders || 0}</td><td>${u.spins || 0}</td>
      </tr>`).join('') : '<tr><td colspan="10" style="text-align:center;padding:22px">Belum ada pengguna.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vMoods() {
  const q = DC.q.toLowerCase();
  const rows = (DC.data.moods || []).filter(m => !q || (uName(m.user_id) + m.mood + m.date).toLowerCase().includes(q))
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `<div class="dcard">
    <h3>Catatan mood <span class="tag">${rows.length}</span></h3>
    ${searchBar('Cari nama, mood, tanggal…')}
    <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" id="csvMoods">Unduh CSV</button></div>
    <div class="dtable"><table><thead><tr><th>Tanggal</th><th>Pengguna</th><th>Mood</th><th>Dicatat</th></tr></thead><tbody>
      ${rows.length ? rows.slice(0, 500).map(m => `<tr>
        <td>${esc(m.date)}</td><td>${esc(uName(m.user_id))}</td>
        <td><span style="display:inline-flex;align-items:center;gap:5px"><span style="width:18px;height:18px">${cimo(moodOf(m.mood).face, 16)}</span>${esc(moodOf(m.mood).label)}</span></td>
        <td>${dt(m.at)}</td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:22px">Belum ada catatan mood.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vOrders() {
  const rows = (DC.data.orders || []).slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  return `<div class="dcard">
    <h3>Pesanan & klik platform <span class="tag">${rows.length}</span></h3>
    <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" id="csvOrders">Unduh CSV</button></div>
    <div class="dtable"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Jenis</th><th>Platform</th><th>Item</th></tr></thead><tbody>
      ${rows.length ? rows.map(o => `<tr>
        <td>${dt(o.at)}</td><td>${esc(uName(o.user_id))}</td><td>${esc(o.kind || '—')}</td>
        <td>${esc(o.platform || '—')}</td>
        <td class="wrap">${esc(Array.isArray(o.items) ? o.items.map(i => dishOf(i).name).join(', ') : (o.item || '—'))}</td>
      </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:22px">Belum ada pesanan.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vChats() {
  const q = DC.q.toLowerCase();
  const rows = (DC.data.chats || []).filter(c => !q || (uName(c.user_id) + c.text).toLowerCase().includes(q))
    .sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  return `<div class="dcard">
    <h3>Transkrip chat <span class="tag">${rows.length}</span></h3>
    ${searchBar('Cari isi chat atau nama…')}
    <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" id="csvChats">Unduh CSV</button></div>
    <div class="dtable"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Peran</th><th>Isi</th></tr></thead><tbody>
      ${rows.length ? rows.slice(0, 400).map(c => `<tr>
        <td>${dt(c.at)}</td><td>${esc(uName(c.user_id))}</td>
        <td>${c.role === 'user' ? '<span class="tag">user</span>' : c.role === 'system' ? '<span class="tag gold">system</span>' : '<span class="tag pink">cimo</span>'}</td>
        <td class="wrap">${esc(c.text)}</td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:22px">Belum ada chat.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vSpins() {
  const rows = (DC.data.spins || []).slice().sort((a, b) => (b.at || '').localeCompare(a.at || ''));
  return `<div class="dcard">
    <h3>Riwayat spinner <span class="tag">${rows.length}</span></h3>
    <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" id="csvSpins">Unduh CSV</button></div>
    <div class="dtable"><table><thead><tr><th>Waktu</th><th>Pengguna</th><th>Menu</th></tr></thead><tbody>
      ${rows.length ? rows.map(s => `<tr><td>${dt(s.at)}</td><td>${esc(uName(s.user_id))}</td><td>${esc(dishOf(s.item).name)}</td></tr>`).join('')
        : '<tr><td colspan="3" style="text-align:center;padding:22px">Belum ada putaran.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vAI() {
  const local = !DB.isRemote;
  return `<div class="dcard">
    <h3>Otak Cimo (AI)</h3>
    <p class="mini" style="margin-bottom:12px">Kunci API disimpan di server, tidak pernah dikirim ke browser pengguna. Kalau kosong, chat memakai mesin lokal Cimo yang tetap jalan penuh.</p>
    ${local ? `<div class="inote" style="margin-bottom:12px"><b>Mode statis.</b> Tanpa server, kunci ini tidak bisa dipakai bersama. Jalankan <code>node server/server.js</code> untuk mengaktifkan AI untuk semua pengguna.</div>` : ''}
    <div class="airow">
      <div class="field"><label>API key</label><input id="aiKey" type="password" placeholder="sk-..." ${local ? 'disabled' : ''}></div>
      <div class="field"><label>Model</label><input id="aiModel" placeholder="gpt-4o-mini" value="${esc(DC.ai.model || 'gpt-4o-mini')}" ${local ? 'disabled' : ''}></div>
    </div>
    <div class="field"><label>Base URL</label><input id="aiBase" value="https://api.openai.com/v1" ${local ? 'disabled' : ''}></div>
    <div class="row">
      <button class="btn sm" id="aiSave" ${local ? 'disabled' : ''}>Simpan kunci</button>
      <button class="btn sm ghost" id="aiTest" ${local ? 'disabled' : ''}>Tes koneksi</button>
      <span class="mini" id="aiStat">${DC.ai.enabled ? 'Aktif · ' + esc(DC.ai.model) : 'Belum aktif'}</span>
    </div>
    <div class="inote" style="margin-top:14px">Format kompatibel OpenAI: OpenAI, Groq, Together, OpenRouter, atau endpoint lokal (Ollama/LM Studio) — cukup ganti Base URL dan model.</div>
  </div>`;
}

function vUmkm() {
  const rows = (DC.data.umkms || []).slice().sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  return `<div class="dcard">
    <h3>UMKM terdaftar <span class="tag">${rows.length}</span></h3>
    <div class="dtable"><table><thead><tr><th>Nama Usaha</th><th>Pemilik</th><th>WA</th><th>Alamat</th><th>Status</th><th>Views</th><th>Clicks</th><th>Daftar</th></tr></thead><tbody>
      ${rows.length ? rows.map(u => `<tr>
        <td><b>${esc(u.name)}</b></td><td>${esc(u.owner || '—')}</td><td>${esc(u.wa || '—')}</td>
        <td>${esc(u.addr || '—')}</td>
        <td>${u.status === 'approved' ? '<span class="tag mint">approved</span>' : '<span class="tag gold">pending</span>'}</td>
        <td>${u.views || 0}</td><td>${u.clicks || 0}</td><td>${dOnly(u.created)}</td>
      </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;padding:22px">Belum ada UMKM terdaftar.</td></tr>'}
    </tbody></table></div>
  </div>`;
}

function vExport() {
  const d = DC.data;
  const rows = [
    ['users', 'Pengguna', (d.users || []).length],
    ['moods', 'Mood', (d.moods || []).length],
    ['orders', 'Pesanan', (d.orders || []).length],
    ['chats', 'Chat', (d.chats || []).length],
    ['spins', 'Putaran', (d.spins || []).length],
  ];
  return `<div class="dcard">
    <h3>Database</h3>
    <p class="mini" style="margin-bottom:12px">Sumber: <b>${DB.isRemote ? 'API server · server/data/db.json' : 'localStorage perangkat ini'}</b>.
    Skema relasional ada di <code>db/schema.sql</code>.</p>
    <div class="kpis" style="margin-bottom:14px">
      ${rows.map(([k, n, v]) => `<div class="kpi"><small>${n}</small><b>${nf(v)}</b></div>`).join('')}
    </div>
    <div class="row">
      <button class="btn sm" id="dlJson">Unduh semua (JSON)</button>
      ${rows.map(([k, n]) => `<button class="btn sm ghost" data-csv="${k}">CSV ${n}</button>`).join('')}
    </div>
    <div class="inote" style="margin-top:14px">
      <b>Tips:</b> file JSON ini bisa langsung diimpor ke Postgres/Supabase memakai <code>db/schema.sql</code>,
      atau disimpan sebagai cadangan. Data live juga tersimpan di <code>server/data/db.json</code>.
    </div>
  </div>`;
}

/* ---------- events ---------- */
function bind() {
  const q = $('#dq');
  if (q) {
    q.oninput = () => {
      DC.q = q.value;
      const pos = q.selectionStart;
      render();
      const nq = $('#dq'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); }
    };
  }
  const qc = $('#dqClear');
  if (qc) qc.onclick = () => { DC.q = ''; render(); };

  const c1 = $('#csvUsers'); if (c1) c1.onclick = () => csv(DC.data.users || [], [
    { k: 'name' }, { k: 'contact' }, { k: 'lang' }, { k: 'guest' }, { k: 'created' }, { k: 'last_seen' },
    { k: 'moods' }, { k: 'orders' }, { k: 'chats' }, { k: 'spins' }, { k: 'id' },
  ], 'users');
  const c2 = $('#csvMoods'); if (c2) c2.onclick = () => csv(DC.data.moods || [], [
    { k: 'date' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'mood' }, { k: 'at' },
  ], 'moods');
  const c3 = $('#csvOrders'); if (c3) c3.onclick = () => csv(DC.data.orders || [], [
    { k: 'at' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'kind' }, { k: 'platform' },
    { k: 'items', v: r => Array.isArray(r.items) ? r.items.join(' | ') : (r.item || '') },
  ], 'orders');
  const c4 = $('#csvChats'); if (c4) c4.onclick = () => csv(DC.data.chats || [], [
    { k: 'at' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'role' }, { k: 'text' },
  ], 'chats');
  const c5 = $('#csvSpins'); if (c5) c5.onclick = () => csv(DC.data.spins || [], [
    { k: 'at' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'menu', v: r => dishOf(r.item).name },
  ], 'spins');

  $$('[data-go]').forEach(b => b.onclick = () => { DC.tab = b.dataset.go; render(); });
  const dj = $('#dlJson'); if (dj) dj.onclick = jsonDump;
  $$('[data-csv]').forEach(b => b.onclick = () => {
    const k = b.dataset.csv;
    if (k === 'users') csv(DC.data.users || [], [{ k: 'name' }, { k: 'contact' }, { k: 'lang' }, { k: 'guest' }, { k: 'created' }], 'users');
    if (k === 'moods') csv(DC.data.moods || [], [{ k: 'date' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'mood' }], 'moods');
    if (k === 'orders') csv(DC.data.orders || [], [{ k: 'at' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'platform' }], 'orders');
    if (k === 'chats') csv(DC.data.chats || [], [{ k: 'at' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'role' }, { k: 'text' }], 'chats');
    if (k === 'spins') csv(DC.data.spins || [], [{ k: 'at' }, { k: 'user', v: r => uName(r.user_id) }, { k: 'menu', v: r => dishOf(r.item).name }], 'spins');
  });

  const save = $('#aiSave');
  if (save) save.onclick = async () => {
    const key = $('#aiKey').value.trim(), model = $('#aiModel').value.trim() || 'gpt-4o-mini', base = $('#aiBase').value.trim() || 'https://api.openai.com/v1';
    try {
      const r = await fetch('api/ai/config?key=' + encodeURIComponent(DC.key), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, model, base }),
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
      DC.ai = { enabled: !!j.enabled, model: j.model };
      $('#aiStat').textContent = j.enabled ? 'Aktif · ' + j.model : 'Belum aktif';
      toast(j.enabled ? 'Kunci disimpan di server' : 'Kunci dikosongkan');
    } catch (e) { toast('Gagal: ' + e.message); }
  };
  const test = $('#aiTest');
  if (test) test.onclick = async () => {
    test.disabled = true; test.textContent = 'Menguji…';
    try {
      const r = await fetch('api/ai', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: 'Balas satu kata: halo' }] }),
      });
      const j = await r.json();
      toast(j.ok ? 'AI menjawab: ' + (j.text || '').slice(0, 40) : 'Gagal: ' + (j.error || r.status));
    } catch (e) { toast('Gagal: ' + e.message); }
    test.disabled = false; test.textContent = 'Tes koneksi';
  };
}

</script>
</body>
</html>
