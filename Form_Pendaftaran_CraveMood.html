<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar CraveMood</title>
<style>
  :root{
    --pink:#ff7aa8; --pink2:#ffb3cc; --yellow:#fddb62;
    --ink:#3a2142; --muted:#7b6a82; --ok:#2e9c6b; --err:#e0415f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
    background:
      radial-gradient(900px 500px at 12% 8%, rgba(255,122,168,.55), transparent 60%),
      radial-gradient(800px 520px at 88% 92%, rgba(253,219,98,.55), transparent 60%),
      linear-gradient(135deg,#fff5f9,#f3ecff 55%,#fff9e6);
  }
  .card{
    width:min(440px,100%); padding:34px 30px 30px; border-radius:26px;
    background:rgba(255,255,255,.42);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 24px 60px rgba(90,40,80,.18), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .dot{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--pink),var(--pink2));box-shadow:0 8px 20px rgba(255,122,168,.45)}
  .dot b{color:#fff;font-size:20px}
  h1{font-size:1.35rem;margin:0;letter-spacing:-.02em}
  .sub{margin:4px 0 22px;color:var(--muted);font-size:.9rem}
  label{display:block;font-size:.82rem;font-weight:650;margin:16px 0 6px}
  .field{position:relative}
  input{
    width:100%;padding:13px 14px;border-radius:14px;font-size:.95rem;color:var(--ink);
    border:1.5px solid rgba(122,90,130,.22);background:rgba(255,255,255,.72);
    outline:none;transition:border-color .18s, box-shadow .18s, background .18s;
  }
  input:focus{border-color:var(--pink);background:#fff;box-shadow:0 0 0 4px rgba(255,122,168,.18)}
  input.invalid{border-color:var(--err);box-shadow:0 0 0 4px rgba(224,65,95,.12)}
  input.valid{border-color:var(--ok)}
  .err{color:var(--err);font-size:.78rem;min-height:16px;margin:5px 2px 0;display:none}
  .err.show{display:block}
  button{
    width:100%;margin-top:22px;padding:14px;border:0;border-radius:15px;cursor:pointer;
    font-size:.98rem;font-weight:700;color:#fff;letter-spacing:.01em;
    background:linear-gradient(135deg,var(--pink),#ff9c6b);
    box-shadow:0 12px 26px rgba(255,122,168,.42);transition:transform .15s, box-shadow .15s, opacity .15s;
  }
  button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 16px 32px rgba(255,122,168,.5)}
  button:disabled{opacity:.65;cursor:wait}
  .spinner{display:none;width:16px;height:16px;margin-right:8px;border-radius:50%;
    border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .7s linear infinite;
    vertical-align:-3px}
  button.loading .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note{margin-top:14px;font-size:.76rem;color:var(--muted);text-align:center;line-height:1.5}
  .alert{padding:12px 14px;border-radius:13px;font-size:.86rem;margin-top:16px;display:none}
  .alert.show{display:block}
  .alert.ok{background:rgba(46,156,107,.14);color:#1d7a52;border:1px solid rgba(46,156,107,.3)}
  .alert.bad{background:rgba(224,65,95,.12);color:#b32744;border:1px solid rgba(224,65,95,.28)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><div class="dot"><b>C</b></div><h1>Gabung CraveMood</h1></div>
  <p class="sub">Satu akun untuk semua rekomendasi kulitan Makassar favoritmu.</p>

  <form id="f" novalidate>
    <label for="nama">Nama Lengkap</label>
    <div class="field"><input id="nama" name="nama_lengkap" placeholder="Andi Pratama" autocomplete="name"></div>
    <p class="err" id="e-nama"></p>

    <label for="wa">Nomor WhatsApp</label>
    <div class="field"><input id="wa" name="nomor_wa" placeholder="0812xxxxxxx atau 62812xxxxxxx" inputmode="numeric" autocomplete="tel"></div>
    <p class="err" id="e-wa"></p>

    <label for="email">Email Gmail</label>
    <div class="field"><input id="email" name="email_gmail" placeholder="nama@gmail.com" inputmode="email" autocomplete="email"></div>
    <p class="err" id="e-email"></p>

    <button id="btn" type="submit"><span class="spinner"></span><span id="btntext">Daftar Sekarang</span></button>
  </form>
  <div class="alert" id="alert"></div>
  <p class="note">Data tersimpan aman di database CraveMood.<br>Hanya email @gmail.com yang diterima.</p>
</div>

<script>
  /* ===== GANTI DENGAN URL WEB APP APPS SCRIPT ANDA ===== */
  const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycb.../exec';
  /* ==================================================== */

  const f = document.getElementById('f');
  const btn = document.getElementById('btn');
  const alertBox = document.getElementById('alert');
  const fields = {
    nama:  { el: document.getElementById('nama'),  err: document.getElementById('e-nama') },
    wa:    { el: document.getElementById('wa'),    err: document.getElementById('e-wa') },
    email: { el: document.getElementById('email'), err: document.getElementById('e-email') }
  };

  function setError(key, msg){
    const f = fields[key];
    f.el.classList.toggle('invalid', !!msg);
    f.el.classList.toggle('valid', !msg && f.el.value.length > 0);
    f.err.textContent = msg || '';
    f.err.classList.toggle('show', !!msg);
    f.el.setAttribute('aria-invalid', msg ? 'true' : 'false');
  }

  function validateNama(v){
    v = v.trim();
    if (v.length < 3) return 'Nama minimal 3 karakter.';
    if (!/^[A-Za-zÀ-ÿ' .]+$/.test(v)) return 'Nama hanya boleh huruf, spasi, titik, dan apostrof (tanpa angka/simbol).';
    return '';
  }
  function validateWa(v){
    v = v.trim();
    if (!v) return 'Nomor WhatsApp wajib diisi.';
    if (/[A-Za-z]/.test(v)) return 'Nomor WhatsApp tidak boleh mengandung huruf.';
    if (/[^0-9+\s().\-]/.test(v)) return 'Nomor WhatsApp mengandung simbol tidak valid.';
    const d = v.replace(/\D/g,'');
    if (d.length < 10 || d.length > 13) return 'Panjang nomor harus 10–13 digit angka.';
    if (!/^(08|628)/.test(d)) return 'Nomor harus diawali 08 atau 628.';
    return '';
  }
  function validateEmail(v){
    v = v.trim().toLowerCase();
    if (!v) return 'Email wajib diisi.';
    if (!/^[a-z0-9._%+-]+@gmail\.com$/.test(v)) return 'Email harus berakhiran @gmail.com.';
    if (/\.\./.test(v.split('@')[0])) return 'Alamat email tidak valid.';
    return '';
  }
  const validators = { nama: validateNama, wa: validateWa, email: validateEmail };

  // real-time validation + blokir huruf pada input WA
  fields.wa.el.addEventListener('input', e => {
    const cleaned = e.target.value.replace(/[^0-9+\s().\-]/g,'');
    if (cleaned !== e.target.value) e.target.value = cleaned;
    setError('wa', validators.wa(e.target.value));
  });
  Object.keys(fields).forEach(k => {
    if (k === 'wa') return;
    fields[k].el.addEventListener('input', () => setError(k, validators[k](fields[k].el.value)));
    fields[k].el.addEventListener('blur',  () => setError(k, validators[k](fields[k].el.value)));
  });

  function normalizeWa(v){
    const d = v.replace(/\D/g,'');
    return /^08/.test(d) ? '62' + d.slice(1) : d;
  }

  function jsonpCall_(payload){
    return new Promise((resolve, reject) => {
      const cbName = 'cmCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
      const params = new URLSearchParams();
      Object.keys(payload).forEach(k => params.append(k, payload[k]));
      params.append('callback', cbName);
      const script = document.createElement('script');
      script.src = WEBAPP_URL + (WEBAPP_URL.indexOf('?') > -1 ? '&' : '?') + params.toString();
      const timer = setTimeout(() => { cleanup(); reject(new Error('timeout / URL salah')); }, 15000);
      function cleanup(){ clearTimeout(timer); delete window[cbName]; script.remove(); }
      window[cbName] = data => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('tidak dapat menghubungi server')); };
      document.head.appendChild(script);
    });
  }

  function showAlert(type, msg){
    alertBox.className = 'alert show ' + type;
    alertBox.textContent = msg;
  }

  f.addEventListener('submit', async e => {
    e.preventDefault();
    let bad = false;
    Object.keys(fields).forEach(k => {
      const msg = validators[k](fields[k].el.value);
      setError(k, msg);
      if (msg) bad = true;
    });
    if (bad){ showAlert('bad','Periksa kembali kolom yang ditandai.'); return; }
    if (WEBAPP_URL.indexOf('AKfycb') !== -1){
      showAlert('bad','URL Web App belum diisi. Buka file HTML dan ganti konstanta WEBAPP_URL.');
      return;
    }

    btn.disabled = true;
    btn.classList.add('loading');
    document.getElementById('btntext').textContent = 'Mengirim…';
    alertBox.className = 'alert';

    const payload = {
      action: 'daftar',
      nama_lengkap: fields.nama.el.value.trim(),
      nomor_wa: normalizeWa(fields.wa.el.value),
      email_gmail: fields.email.el.value.trim().toLowerCase(),
      sumber_trafik: 'Form Web',
      perangkat: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
      bahasa_pilihan: 'id',
      mode_interaksi: 'chat',
      kategori_mood: 'def',
      klik_order: 'Tidak'
    };

    try {
      // 1) Pre-check server-side via JSONP (bisa membaca response walau tanpa CORS)
      const check = await jsonpCall_(Object.assign({}, payload, { action: 'cek' }));
      if (check.status !== 'success') {
        showAlert('bad', check.message || 'Data ditolak server. Periksa kembali.');
        return;
      }

      // 2) Kirim data final lewat fetch() ke Web App Apps Script
      await fetch(WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors', // Apps Script tidak mengirim header CORS
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      showAlert('ok','Pendaftaran berhasil! Data tersimpan di spreadsheet CraveMood.');
      f.reset();
      Object.keys(fields).forEach(k => setError(k, ''));
    } catch (err) {
      showAlert('bad','Gagal menghubungi server: ' + err.message + '. Periksa URL Web App.');
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
      document.getElementById('btntext').textContent = 'Daftar Sekarang';
    }
  });
</script>
</body>
</html>
