<body>

<!-- ============ onboarding ============ -->
<div class="onboard" id="onboard"></div>

<!-- ============ app ============ -->
<div id="app" class="hide">
  <aside class="sidebar">
    <div class="brand">
      <div class="lg"><span>Crave</span><mark>Mood</mark></div>
    </div>
    <div id="navlist" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="lg"><span>Crave</span><mark>Mood</mark></div>
      <div class="row">
        <button class="iconbtn" data-go="cart" aria-label="cart" id="topCart" style="position:relative">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0"/></svg>
          <span class="bdg" id="topbadge" style="display:none;position:absolute;top:-3px;right:-3px">0</span>
        </button>
        <button class="iconbtn" data-go="profile" aria-label="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>
        </button>
      </div>
    </div>
    <div class="shell">
      <div id="view"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="cartbar" id="cartbar">
    <span id="cbt">🛒 0 item</span>
    <button data-go="cart">Lihat Pesanan</button>
  </div>

  <div class="pet" id="pet"></div>
</div>

<!-- ============ modals ============ -->
<div class="modal" id="shareModal">
  <div class="mbox">
    <div class="mhead"><h3>Bagikan pilihanku</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="shareBody"></div>
  </div>
</div>

<div class="modal" id="installModal">
  <div class="mbox">
    <div class="mhead"><h3>Unduh aplikasi</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="installBody"></div>
  </div>
</div>

<div class="installbanner" id="installbanner"></div>

<div class="toast" id="toast"></div>

/*__JS__*/
</script>
