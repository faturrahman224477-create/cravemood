<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF7FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#241529" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>CraveMood — Makan sesuai moodmu</title>
<meta name="description" content="CraveMood: Cimo bantu pilihin makanan khas Makassar sesuai moodmu. Spinner acak, live chat curhat, suara 5 pilihan, bagikan ke sosial media.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CraveMood">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="CraveMood">
<meta name="msapplication-TileColor" content="#FFF7FA">
<meta name="msapplication-TileImage" content="icon-192.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
</style>
</head>
<body>

<!-- ============ onboarding ============ -->
<div class="onboard" id="onboard"></div>

<!-- ============ app ============ -->
<div id="app" class="hide">
  <aside class="sidebar">
    <div class="brand">
      <div class="lg"><span>Crave</span><mark>Mood</mark></div>
    </div>
    <div id="navlist" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="lg"><span>Crave</span><mark>Mood</mark></div>
      <div class="row">
        <button class="iconbtn" data-go="cart" aria-label="cart" id="topCart" style="position:relative">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0"/></svg>
          <span class="bdg" id="topbadge" style="display:none;position:absolute;top:-3px;right:-3px">0</span>
        </button>
        <button class="iconbtn" data-go="profile" aria-label="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>
        </button>
      </div>
    </div>
    <div class="shell">
      <div id="view"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="cartbar" id="cartbar">
    <span id="cbt">🛒 0 item</span>
    <button data-go="cart">Lihat Pesanan</button>
  </div>

  <div class="pet" id="pet"></div>
</div>

<!-- ============ modals ============ -->
<div class="modal" id="shareModal">
  <div class="mbox">
    <div class="mhead"><h3>Bagikan pilihanku</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="shareBody"></div>
  </div>
</div>

<div class="modal" id="installModal">
  <div class="mbox">
    <div class="mhead"><h3>Unduh aplikasi</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="installBody"></div>
  </div>
</div>

<div class="modal" id="vipModal">
  <div class="mbox">
    <div class="mhead"><h3>CraveMood VIP</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="vipBody"></div>
  </div>
</div>

<div class="installbanner" id="installbanner"></div>

<div class="toast" id="toast"></div>

<script>
/*__JS__*/
</script>
</body>
</html>
