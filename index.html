<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7fa">
<title>CraveMood — Makan sesuai moodmu</title>
<meta name="description" content="CraveMood: Cimo bantu pilihin makanan khas Makassar sesuai moodmu. Spinner acak, live chat curhat, suara 5 pilihan, bagikan ke sosial media.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff7fa'/%3E%3Cellipse cx='32' cy='36' rx='22' ry='20' fill='%23f27aa8'/%3E%3Cellipse cx='30' cy='34' rx='20.5' ry='18.5' fill='%23ffa9c9'/%3E%3Cellipse cx='24' cy='34' rx='3.4' ry='4.4' fill='%232f2a6b'/%3E%3Cellipse cx='40' cy='34' rx='3.4' ry='4.4' fill='%232f2a6b'/%3E%3Cpath d='M28 42q4 4 8 0' fill='none' stroke='%232f2a6b' stroke-width='2.4' stroke-linecap='round'/%3E%3Cg transform='translate(46 18) rotate(18)'%3E%3Cellipse cx='-5' rx='5.5' ry='3.4' fill='%23ff7aa8'/%3E%3Cellipse cx='5' rx='5.5' ry='3.4' fill='%23ff7aa8'/%3E%3Ccircle r='2.5' fill='%23ff5c92'/%3E%3C/g%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== CraveMood — design tokens from the mockup ===== */
:root{
  --bg:#fff7fa; --ink:#3a2142; --mu:#7d6683; --sf:#fff; --ln:rgba(90,50,100,.14);
  --cr:#fff8ef; --pk:#ffb6d0; --pkb:#ff8fb8; --pk2:#ff5f98; --plum:#4a2a5e;
  --le:#f4f87f; --sk:#9fd6ff; --pe:#ffb98a; --mi:#a8ecd6; --li:#dccbff; --gd:#ffc800;
  --sh:0 10px 30px rgba(122,42,85,.10); --sh2:0 4px 0 rgba(122,42,85,.10);
  --r:24px; --r2:18px; --nav:264px;
}
[data-theme=dark]{
  --bg:#241529; --ink:#fff0f7; --mu:#d3b9cd; --sf:#35223b; --ln:rgba(255,255,255,.14);
  --cr:#2f1e35; --sh:0 10px 30px rgba(0,0,0,.35); --sh2:0 4px 0 rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:400 15px/1.6 Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:radial-gradient(rgba(255,182,208,.42) 2px,transparent 2.6px);
  background-size:30px 30px; background-attachment:fixed;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
h1,h2,h3,h4,b,button,.f{font-family:Fredoka,Nunito,sans-serif}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--pk);color:#3a2142}
.hide{display:none!important}
/* inline icon primitive — every icon() call gets a sane size */
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.btn .ic{width:17px;height:17px}
.link .ic{width:15px;height:15px}

/* ===== shell ===== */
.sidebar{
  position:fixed; left:0; top:0; bottom:0; width:var(--nav); background:var(--sf);
  border-right:1px solid var(--ln); padding:22px 16px; display:flex; flex-direction:column; gap:6px; z-index:40;
}
.brand{display:flex;align-items:center;gap:8px;padding:4px 10px 18px}
.lg{font:700 1.55rem/1 Fredoka;display:inline-flex;align-items:center;gap:4px;letter-spacing:-.4px}
.lg mark{background:#ff9ec5;color:#3a2142;padding:1px 9px 4px;border-radius:11px;transform:rotate(-3deg);
  box-shadow:0 4px 0 #f27aa8,0 8px 14px rgba(242,122,168,.32)}
.lg small{font:700 .58rem/1 Fredoka;letter-spacing:.18em;opacity:.5;text-transform:uppercase;margin-left:2px}
.navbtn{
  display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--mu);
  padding:11px 13px;border-radius:15px;cursor:pointer;font:600 .95rem Fredoka;text-align:left;
  transition:.22s cubic-bezier(.34,1.56,.64,1);position:relative;
}
.navbtn svg{width:21px;height:21px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{background:color-mix(in srgb,var(--pk) 22%,transparent);color:var(--ink);transform:translateX(2px)}
.navbtn.on{background:var(--ink);color:var(--bg);box-shadow:0 6px 14px rgba(58,33,66,.22)}
.navbtn .bdg{margin-left:auto;background:var(--pk2);color:#fff;font:700 .7rem Fredoka;min-width:20px;height:20px;
  border-radius:99px;display:grid;place-items:center;padding:0 6px}
.navbtn.on .bdg{background:var(--pk);color:#3a2142}
.sidefoot{margin-top:auto;border-top:1px solid var(--ln);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.minicard{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#ffe7f0,#fff3e8);border-radius:18px;padding:10px 12px}
[data-theme=dark] .minicard{background:linear-gradient(135deg,#4a2a5e,#3a2142)}
.minicard b{font-size:.86rem;display:block;line-height:1.2}
.minicard small{font-size:.7rem;color:var(--mu);font-weight:700}

main{margin-left:var(--nav);min-height:100vh;padding:26px 32px 60px}
.shell{max-width:1120px;margin:0 auto}
.topbar{display:none}

/* ===== generic ===== */
.view{display:none}
.view.on{display:block;animation:vin .34s cubic-bezier(.22,1,.36,1)}
@keyframes vin{from{opacity:0;transform:translateY(12px)}}
.pagetitle{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.pagetitle h1{font-size:clamp(1.5rem,3vw,2.05rem);letter-spacing:-.5px}
.pagetitle p{color:var(--mu);font-size:.92rem;margin-top:3px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:20px;box-shadow:var(--sh2)}
.card.tight{padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--mu)}
.sm{font-size:.8rem}
.xs{font-size:.72rem}

.btn{
  border:0;background:var(--pk2);color:#fff;font:700 .95rem Fredoka;padding:12px 24px;border-radius:99px;cursor:pointer;
  box-shadow:0 5px 0 #d63f74;transition:.16s cubic-bezier(.34,1.56,.64,1);display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 0 #d63f74}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #d63f74}
.btn.ghost{background:transparent;color:var(--ink);border:1.6px solid var(--ln);box-shadow:none}
.btn.ghost:hover{border-color:var(--pkb);background:color-mix(in srgb,var(--pk) 16%,transparent);transform:none}
.btn.plum{background:var(--plum);box-shadow:0 5px 0 #2a1634}
.btn.plum:hover{box-shadow:0 6px 0 #2a1634}
.btn.plum:active{box-shadow:0 1px 0 #2a1634}
.btn.sm{padding:8px 16px;font-size:.82rem;box-shadow:0 4px 0 #d63f74}
.btn.sm:active{transform:translateY(3px);box-shadow:0 1px 0 #d63f74}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.btn.block{width:100%}
.iconbtn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;transition:.2s}
.iconbtn:hover{background:color-mix(in srgb,var(--pk) 26%,transparent)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.tag{display:inline-flex;align-items:center;gap:4px;font:700 .66rem Fredoka;padding:3px 10px;border-radius:99px;background:var(--cr);color:var(--ink)}
.bdg{background:var(--pk2);color:#fff;font:700 .62rem Fredoka;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px;line-height:1}
.tag.pink{background:#f08fb4;color:#fff}
.tag.dark{background:var(--ink);color:var(--bg)}
.tag.mint{background:#b7e3d0}
.tag.gold{background:#ffe6a8}

/* ===== onboarding ===== */
.onboard{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;
  background:radial-gradient(ellipse 90% 40% at 50% 18%,rgba(255,255,255,.92),rgba(255,255,255,0) 70%),linear-gradient(180deg,#ffe3ec,#ffd9e6 55%,#ffe8d8)}
[data-theme=dark] .onboard{background:radial-gradient(ellipse 90% 40% at 50% 18%,rgba(255,158,197,.18),transparent 70%),linear-gradient(180deg,#2b1830,#241529)}
.onboard .box{width:min(430px,100%);text-align:center}
.onboard .cimo{width:180px;margin:0 auto -20px;cursor:pointer;position:relative;z-index:2;filter:drop-shadow(0 10px 16px rgba(122,42,85,.16))}
.onboard .cimo svg{width:100%;height:auto}
.onboard h2{font-size:1.7rem;letter-spacing:-.4px}
.onboard p.sub{color:var(--mu);font-size:.88rem;margin:6px 0 18px}
.onboard .sheetbox{background:var(--sf);border-radius:30px;padding:20px 20px 24px;box-shadow:0 24px 60px rgba(122,42,85,.22);text-align:left}
.field{margin-bottom:12px}
.field label{display:block;font:700 .76rem Fredoka;color:var(--mu);margin:0 0 5px 4px;letter-spacing:.02em}
.field input,.field select,.field textarea{
  width:100%;border:1.8px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:14px;
  padding:11px 14px;font:600 .9rem Nunito;outline:none;transition:.18s
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pk2);background:var(--sf);box-shadow:0 0 0 4px color-mix(in srgb,var(--pk) 32%,transparent)}
.field textarea{resize:vertical;min-height:70px}
.langs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.langopt{display:flex;align-items:center;gap:8px;border:1.8px solid var(--ln);background:var(--bg);border-radius:14px;padding:9px 11px;cursor:pointer;font:700 .84rem Fredoka;transition:.18s}
.langopt:hover{border-color:var(--pkb)}
.langopt.on{border-color:var(--pk2);background:color-mix(in srgb,var(--pk) 22%,var(--sf));box-shadow:0 3px 0 color-mix(in srgb,var(--pk2) 40%,transparent)}
.langopt i{font-style:normal;font-size:1.05rem}
.hint{font-size:.72rem;color:var(--mu);line-height:1.45}
.err{color:#d63f74;font-size:.75rem;font-weight:700;margin-top:4px;min-height:1em}

/* ===== beranda ===== */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:24px 26px;display:grid;grid-template-columns:1.15fr .85fr;gap:10px;align-items:center;
  background:linear-gradient(135deg,#ffe3ec,#ffd9e6 55%,#ffe8d8);border:1px solid var(--ln)}
[data-theme=dark] .hero{background:linear-gradient(135deg,#3d2347,#33203a 55%,#3a2434)}
.hero .say{display:inline-block;background:var(--sf);border-radius:16px 16px 16px 5px;padding:8px 15px;font:700 .84rem Fredoka;
  box-shadow:0 4px 0 rgba(122,42,85,.12);animation:say .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes say{from{transform:scale(.85);opacity:0}}
.hero h1{font-size:clamp(1.5rem,3.2vw,2.2rem);line-height:1.1;margin:12px 0 6px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--pk2)}
.hero p{color:var(--mu);font-size:.9rem;max-width:330px}
.hero .cimobox{display:grid;place-items:center;position:relative}
.hero .cimobox .halo{position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 70%);animation:pulseHalo 4s ease-in-out infinite}
@keyframes pulseHalo{50%{transform:scale(1.08);opacity:.7}}
.hero .cimobox svg{position:relative;cursor:pointer;filter:drop-shadow(0 14px 18px rgba(122,42,85,.18))}
.hero .cimobox svg.hop{animation:hop .62s cubic-bezier(.3,1.7,.5,1)}
@keyframes hop{30%{transform:translateY(-26px) scaleY(1.07)}60%{transform:translateY(0) scaleY(.92)}}
.float{animation:flt 3.4s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}

.sectitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}
.sectitle h2{font-size:1.12rem;display:flex;align-items:center;gap:8px}
.sectitle h2 span.n{width:24px;height:24px;border-radius:50%;background:var(--pk);color:#3a2142;font:700 .74rem Fredoka;display:grid;place-items:center}
.sectitle .link{background:none;border:0;color:var(--pk2);font:700 .82rem Fredoka;cursor:pointer;display:inline-flex;align-items:center;gap:4px}

.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mood{background:color-mix(in srgb,var(--c) 26%,var(--sf));border:2px solid var(--ln);border-radius:20px;padding:10px 4px 8px;cursor:pointer;text-align:center;
  transition:.26s cubic-bezier(.34,1.56,.64,1);color:var(--ink);position:relative;overflow:hidden}
.mood:hover{transform:translateY(-5px) rotate(-1deg);border-color:var(--c)}
.mood.on{border-color:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 60%,transparent);transform:translateY(-4px)}
.mood .face{display:grid;place-items:center;height:56px}
.mood b{font-size:.78rem;display:block;line-height:1.2}
.mood.on::after{content:"";position:absolute;inset:0;border-radius:18px;background:color-mix(in srgb,var(--c) 16%,transparent);pointer-events:none}

.locbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:7px 8px 7px 16px;margin:16px 0 4px}
.locbar svg{width:17px;height:17px;stroke:var(--pk2);fill:none;stroke-width:2.2;flex:none}
.locbar select{border:0;background:transparent;color:var(--ink);font:700 .84rem Nunito;outline:none;flex:1;min-width:140px;cursor:pointer}
.locbar .dist{font:700 .72rem Fredoka;background:var(--cr);padding:5px 12px;border-radius:99px;color:var(--mu)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.6px solid var(--ln);background:var(--sf);color:var(--mu);font:700 .78rem Fredoka;
  padding:7px 15px;border-radius:99px;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--pkb);color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:block}

.recs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.rec{background:var(--sf);border:1px solid var(--ln);border-radius:26px;overflow:hidden;position:relative;
  transition:.28s cubic-bezier(.34,1.56,.64,1);display:flex;flex-direction:column}
.rec:hover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(122,42,85,.16)}
.rec .pic{height:150px;display:grid;place-items:center;position:relative;overflow:hidden}
.rec .pic > svg{height:104px;width:auto;transition:.4s cubic-bezier(.34,1.56,.64,1)}
.rec:hover .pic > svg{transform:scale(1.08) rotate(-3deg)}
.rec .pic .cimomini{position:absolute;left:7px;bottom:3px;opacity:.95;line-height:0}
.rec .pic .cimomini svg{width:28px;height:auto}
.rec .pic .badge{position:absolute;top:9px;left:9px}
.rec .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.rec h4{font-size:1rem;line-height:1.2}
.rec .stall{font-size:.74rem;color:var(--mu);font-weight:700;display:flex;align-items:center;gap:3px}
.rec .meta{font-size:.7rem;color:var(--mu);display:flex;gap:6px;flex-wrap:wrap}
.rec .meta b{color:#e8a300;font-weight:700}
.rec .price{margin-top:auto;padding-top:9px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.rec .price b{font:700 .84rem Fredoka;color:var(--pk2)}
.addbtn{border:1.8px solid var(--pk2);background:var(--sf);color:var(--pk2);font:700 .74rem Fredoka;padding:6px 13px;
  border-radius:99px;cursor:pointer;transition:.18s;white-space:nowrap}
.addbtn:hover{background:var(--pk2);color:#fff}
.addbtn:active{transform:scale(.9)}
.step{display:inline-flex;align-items:center;background:var(--pk2);border-radius:99px;color:#fff;overflow:hidden}
.step button{border:0;background:none;color:#fff;font:700 1rem Fredoka;width:27px;height:27px;cursor:pointer;line-height:1}
.step button:hover{background:rgba(0,0,0,.12)}
.step i{font-style:normal;font-weight:800;min-width:16px;text-align:center;font-size:.76rem}

.empty{text-align:center;padding:34px 16px;color:var(--mu)}
.empty .big{width:110px;margin:0 auto 8px;opacity:.85}

/* ===== spinner ===== */
.spinwrap{display:grid;grid-template-columns:1.05fr .95fr;gap:26px;align-items:center}
.wheelbox{position:relative;display:grid;place-items:center;padding:8px}
.wheel{width:min(370px,80vw);aspect-ratio:1;border-radius:50%;position:relative;
  box-shadow:0 18px 40px rgba(122,42,85,.22),inset 0 0 0 10px var(--sf),inset 0 0 0 13px rgba(90,50,100,.10);
  transition:transform 4.6s cubic-bezier(.12,.72,.06,1);will-change:transform}
.wheel .seg{position:absolute;inset:0;transform-origin:50% 50%;display:flex;justify-content:center;
  padding-top:14px;font:700 .66rem Fredoka;color:#3a2142;pointer-events:none;line-height:1.1}
.wheel .seg span{display:block;max-width:86px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:3;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.hub{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--sf);display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(122,42,85,.25);z-index:2;border:3px solid var(--pk)}
.spininfo h2{font-size:1.5rem;letter-spacing:-.4px;margin-bottom:6px}
.spininfo p{color:var(--mu);font-size:.9rem;margin-bottom:14px}
.spinres{display:flex;gap:12px;align-items:center;background:var(--cr);border-radius:20px;padding:12px;margin-top:14px;animation:say .45s cubic-bezier(.34,1.56,.64,1)}
.spinres .pic{width:74px;height:74px;border-radius:16px;display:grid;place-items:center;flex:none}
.history{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.history span{font:700 .68rem Fredoka;background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 10px;color:var(--mu)}

/* ===== chat ===== */
.chatwrap{display:grid;grid-template-rows:auto 1fr auto;height:calc(100vh - 200px);min-height:460px;
  background:var(--sf);border:1px solid var(--ln);border-radius:30px;overflow:hidden;box-shadow:var(--sh)}
.chathead{display:flex;align-items:center;gap:11px;padding:13px 16px;border-bottom:1px solid var(--ln);
  background:linear-gradient(180deg,color-mix(in srgb,var(--pk) 26%,var(--sf)),var(--sf))}
.chathead .av{width:44px;height:44px;border-radius:50%;background:#fff3f8;display:grid;place-items:center;flex:none;position:relative;border:1px solid var(--ln)}
[data-theme=dark] .chathead .av{background:#4a2a5e}
.chathead .av .dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#3ec98a;border:2px solid var(--sf)}
.chathead b{font-size:.98rem;display:block;line-height:1.2}
.chathead small{font-size:.72rem;color:var(--mu);font-weight:700}
.chatbody{overflow-y:auto;padding:16px 16px 6px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.chatbody::-webkit-scrollbar{width:7px}
.chatbody::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px}
.day{text-align:center;font:700 .68rem Fredoka;color:var(--mu);margin:4px 0}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%;animation:msgIn .32s cubic-bezier(.22,1,.36,1)}
@keyframes msgIn{from{opacity:0;transform:translateY(9px) scale(.97)}}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.msg .av{width:30px;height:30px;border-radius:50%;background:#fff3f8;display:grid;place-items:center;flex:none;overflow:hidden}
[data-theme=dark] .msg .av{background:#4a2a5e}
.bub{background:var(--cr);border-radius:18px 18px 18px 5px;padding:9px 14px;font-size:.875rem;line-height:1.55;
  box-shadow:0 2px 0 rgba(122,42,85,.06);white-space:pre-wrap;word-break:break-word}
[data-theme=dark] .bub{background:#42294b}
.msg.me .bub{background:var(--plum);color:#fff;border-radius:18px 18px 5px 18px}
.bub .em{font-size:1.05rem;vertical-align:-.1em}
.typing{display:flex;gap:4px;padding:12px 15px;background:var(--cr);border-radius:18px 18px 18px 5px;width:max-content}
[data-theme=dark] .typing{background:#42294b}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:tp 1.1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:6px 14px 8px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1.5px solid var(--ln);background:var(--sf);color:var(--mu);font:700 .74rem Fredoka;
  padding:6px 13px;border-radius:99px;cursor:pointer;transition:.18s}
.quick button:hover{border-color:var(--pk2);color:var(--pk2)}
.composer{display:flex;gap:8px;padding:10px 14px 14px;border-top:1px solid var(--ln);align-items:flex-end;background:var(--sf)}
.composer .inp{flex:1;display:flex;align-items:flex-end;background:var(--bg);border:1.8px solid var(--ln);border-radius:22px;padding:5px 6px 5px 14px;transition:.18s}
.composer .inp:focus-within{border-color:var(--pk2);box-shadow:0 0 0 4px color-mix(in srgb,var(--pk) 26%,transparent)}
.composer textarea{flex:1;border:0;background:none;color:var(--ink);font:600 .9rem Nunito;resize:none;outline:none;
  padding:7px 0;max-height:110px;line-height:1.45}
.composer .send{width:38px;height:38px;border-radius:50%;border:0;background:var(--pk2);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
.composer .send:hover{transform:scale(1.06)}
.composer .send:disabled{opacity:.4;cursor:default;transform:none}
.composer .mic{width:38px;height:38px;border-radius:50%;border:1.6px solid var(--ln);background:var(--sf);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
.composer .mic.on{background:#ff4d6d;color:#fff;border-color:#ff4d6d;animation:micPulse 1.2s infinite}
@keyframes micPulse{50%{box-shadow:0 0 0 8px rgba(255,77,109,.2)}}
.composer svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== cart / pesanan ===== */
.cartitem{display:flex;gap:12px;align-items:center;padding:11px;border-radius:20px;border:1px solid var(--ln);margin-bottom:9px;background:var(--bg)}
.cartitem .pic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;flex:none}
.cartitem .pic svg{height:44px}
.cartitem .inf{flex:1;min-width:0}
.cartitem b{font-size:.9rem;display:block;line-height:1.25}
.cartitem small{display:block;font-size:.72rem;color:var(--mu);font-weight:700}
.cartitem .pr{font:700 .8rem Fredoka;color:var(--pk2);margin-top:2px}
.totline{display:flex;justify-content:space-between;align-items:baseline;font:700 1.02rem Fredoka;margin:14px 0 2px}
.plats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.plat{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--bg);border:2px solid var(--ln);
  border-radius:18px;padding:12px 4px;cursor:pointer;font:700 .72rem Fredoka;color:var(--ink);transition:.2s}
.plat:hover{transform:translateY(-3px)}
.plat.on{border-color:var(--pc);box-shadow:0 5px 0 color-mix(in srgb,var(--pc) 45%,transparent)}
.plat i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.plat svg{width:22px;height:22px}
.plat u{text-decoration:none;font-size:.62rem;color:#3ec98a}

/* ===== share ===== */
.sharegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:8px}
.shareacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.shareacts .btn{padding:10px 8px;font-size:.78rem;box-shadow:0 4px 0 rgba(214,63,116,.9);white-space:nowrap;overflow:hidden}
.shareacts .btn.ghost{box-shadow:none}
.soc{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;font:700 .68rem Fredoka;color:var(--ink)}
.soc i{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;transition:.22s cubic-bezier(.34,1.56,.64,1);box-shadow:0 5px 12px rgba(0,0,0,.14)}
.soc:hover i{transform:translateY(-5px) scale(1.06)}
.soc svg{width:25px;height:25px}
.preview{width:100%;max-width:250px;border-radius:20px;box-shadow:0 14px 30px rgba(122,42,85,.2);display:block;margin:0 auto}

/* ===== recap ===== */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats>div{padding:12px 6px;border-radius:20px;background:var(--bg);border:1px solid var(--ln)}
.stats b{display:block;font-size:1.6rem;color:var(--pk2);line-height:1.1}
.stats span{font-size:.7rem;color:var(--mu);font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .wd{text-align:center;font:700 .64rem Fredoka;color:var(--mu);padding-bottom:2px}
.cd{aspect-ratio:1;border-radius:12px;background:var(--bg);display:grid;place-items:center;position:relative;
  font-size:.6rem;font-weight:800;color:var(--mu);border:1px solid transparent;transition:.2s}
.cd:hover{transform:scale(1.12);z-index:2}
.cd.today{border-color:var(--pk2);box-shadow:0 0 0 2px color-mix(in srgb,var(--pk) 40%,transparent)}
.cd span{position:absolute;top:2px;left:5px}
.cd .mini{width:62%}
.bars{margin-top:6px}
.bar{display:flex;align-items:center;gap:9px;margin:7px 0;font:700 .76rem Fredoka}
.bar .tr{flex:1;background:var(--bg);border-radius:99px;height:9px;overflow:hidden}
.bar .tr i{display:block;height:9px;border-radius:99px;transition:width .7s cubic-bezier(.22,1,.36,1)}

/* ===== profil / settings ===== */
.avatar-lg{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#ffe7f0,#fff3e8);display:grid;place-items:center;margin:0 auto 8px;border:3px solid var(--sf);box-shadow:0 8px 20px rgba(122,42,85,.18)}
[data-theme=dark] .avatar-lg{background:linear-gradient(135deg,#4a2a5e,#3a2142)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow .lbl b{font-size:.9rem;display:block}
.setrow .lbl small{font-size:.72rem;color:var(--mu)}
.setrow select{max-width:230px;min-width:150px;border:1.8px solid var(--ln);background:var(--bg);color:var(--ink);
  border-radius:12px;padding:8px 12px;font:700 .82rem Nunito;outline:none;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;background:var(--ln);outline:none;width:150px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--pk2);
  border:3px solid var(--sf);box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--pk2);border:3px solid var(--sf);cursor:pointer}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--ln);border-radius:99px;cursor:pointer;transition:.24s}
.switch span:before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.24s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--pk2)}
.switch input:checked+span:before{transform:translateX(20px)}
.voicecard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.vopt{border:1.8px solid var(--ln);background:var(--bg);border-radius:16px;padding:10px 11px;cursor:pointer;text-align:left;transition:.2s;color:var(--ink)}
.vopt:hover{border-color:var(--pkb);transform:translateY(-2px)}
.vopt.on{border-color:var(--pk2);background:color-mix(in srgb,var(--pk) 20%,var(--sf));box-shadow:0 4px 0 color-mix(in srgb,var(--pk2) 30%,transparent)}
.vopt b{font-size:.82rem;display:block}
.vopt small{font-size:.66rem;color:var(--mu);font-weight:700}
.vopt .wave{display:flex;gap:2px;align-items:flex-end;height:14px;margin-top:5px}
.vopt .wave i{width:3px;border-radius:2px;background:var(--pkb);opacity:.7}

/* ===== table / admin ===== */
.tablewrap{overflow-x:auto;border-radius:16px;border:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:560px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font:700 .68rem Fredoka;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);background:var(--bg)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--pk) 10%,transparent)}
td .tag{font-size:.6rem}

/* ===== floating cimo (draggable) ===== */
.pet{position:fixed;right:26px;bottom:26px;width:74px;height:74px;z-index:60;cursor:grab;touch-action:none;
  filter:drop-shadow(0 10px 16px rgba(122,42,85,.28));transition:filter .2s}
.pet:active{cursor:grabbing}
.pet.drag{filter:drop-shadow(0 18px 26px rgba(122,42,85,.4))}
.pet svg{pointer-events:none}
.pet .bubble{position:absolute;right:64px;top:2px;background:var(--sf);border:1px solid var(--ln);border-radius:14px 14px 4px 14px;
  padding:6px 11px;font:700 .72rem Fredoka;white-space:nowrap;box-shadow:0 6px 14px rgba(122,42,85,.16);opacity:0;transform:scale(.8);transition:.25s;pointer-events:none}
.pet .bubble.on{opacity:1;transform:scale(1)}
.pet .hintdot{position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:var(--pk2);border:2px solid var(--sf);animation:micPulse 2s infinite}

/* ===== cart bar ===== */
.cartbar{position:fixed;left:50%;transform:translate(-50%,140%);bottom:20px;
  width:min(520px,calc(100% - 28px));background:var(--ink);color:var(--bg);border-radius:99px;padding:8px 8px 8px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 14px 30px rgba(0,0,0,.3);z-index:55;
  transition:transform .38s cubic-bezier(.34,1.4,.5,1),opacity .28s;font:700 .82rem Fredoka;
  opacity:0;visibility:hidden;pointer-events:none}
.cartbar.on{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto}
.cartbar button{border:0;background:var(--pk);color:#3a2142;font:700 .78rem Fredoka;padding:9px 16px;border-radius:99px;cursor:pointer}

/* ===== toast / modal / sheet ===== */
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);
  background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font:700 .8rem Fredoka;z-index:95;
  box-shadow:0 10px 26px rgba(0,0,0,.28);transition:transform .34s cubic-bezier(.34,1.4,.5,1),opacity .3s;
  max-width:90vw;text-align:center;opacity:0;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.modal{position:fixed;inset:0;background:rgba(38,18,44,.5);backdrop-filter:blur(3px);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .mbox{background:var(--bg);border-radius:30px;width:min(520px,100%);max-height:92vh;overflow:auto;
  padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.34,1.5,.5,1)}
.modal .mbox.wide{width:min(760px,100%)}
#adminModal .mbox{width:min(760px,100%)}
#adminModal table{min-width:620px;font-size:.74rem}
#adminModal th,#adminModal td{padding:8px 9px}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.modal .mhead h3{font-size:1.15rem}
.closebtn{border:0;background:var(--cr);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--ink);font-size:1rem;display:grid;place-items:center;flex:none}

/* ===== mobile nav ===== */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:50;justify-content:space-around}
.tabbar button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;font:700 .58rem Fredoka;cursor:pointer;border-radius:14px;position:relative;transition:.2s}
.tabbar button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--pk2)}
.tabbar button.on svg{fill:color-mix(in srgb,var(--pk2) 18%,transparent)}
.tabbar .bdg{position:absolute;top:2px;right:50%;transform:translateX(16px);background:var(--pk2);color:#fff;
  font:700 .55rem Fredoka;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

/* ===== responsive ===== */
@media(max-width:1080px){
  .moods{grid-template-columns:repeat(3,1fr)}
  .recs{grid-template-columns:repeat(2,1fr)}
  .spinwrap{grid-template-columns:1fr;gap:16px}
  .wheel{width:min(300px,70vw)}
}
@media(max-width:980px){
  :root{--nav:0px}
  .sidebar{display:none}
  .tabbar{display:flex}
  main{margin-left:0;padding:12px 14px 120px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 12px}
  .topbar .lg{font-size:1.3rem}
  .hero{grid-template-columns:1fr;text-align:center;padding:20px 18px}
  .hero p{margin:0 auto}
  .hero .cimobox{order:-1}
  .hero .cimobox .halo{width:180px;height:180px}
  .chatwrap{height:calc(100vh - 172px);min-height:420px;border-radius:24px}
  .cartbar{left:14px;right:92px;width:auto;transform:translateY(140%);bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:7px 7px 7px 14px;font-size:.74rem}
  .cartbar.on{transform:translateY(0)}
  .cartbar button{padding:8px 12px;font-size:.7rem;white-space:nowrap}
  #cbt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pet{bottom:calc(70px + env(safe-area-inset-bottom,0px));right:10px;width:56px;height:56px;opacity:.94}
  .sharegrid{grid-template-columns:repeat(5,1fr);gap:6px}
  .soc i{width:46px;height:46px;border-radius:15px}
  .topbar .bdg{font-size:.55rem;min-width:16px;height:16px}
}
@media(max-width:560px){
  .recs{grid-template-columns:1fr}
  .moods{grid-template-columns:repeat(3,1fr);gap:8px}
  .mood .face{height:48px}
  .sharegrid{grid-template-columns:repeat(5,1fr)}
  .soc{font-size:.58rem}
  .soc i{width:42px;height:42px}
  .langs{grid-template-columns:1fr}
  .plats{grid-template-columns:1fr;gap:6px}
  .plat{flex-direction:row;justify-content:flex-start;padding:10px 12px;gap:10px}
  .stats b{font-size:1.3rem}
  .setrow{gap:8px}
  .setrow select{max-width:100%;flex:1}
  input[type=range]{width:120px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>
</head>
<body>

<!-- ============ onboarding ============ -->
<div class="onboard" id="onboard"></div>

<!-- ============ app ============ -->
<div id="app" class="hide">
  <aside class="sidebar">
    <div class="brand">
      <div class="lg"><span>Crave</span><mark>Mood</mark></div>
    </div>
    <div id="navlist" style="display:flex;flex-direction:column;gap:4px"></div>
    <div class="sidefoot" id="sidefoot"></div>
  </aside>

  <main>
    <div class="topbar">
      <div class="lg"><span>Crave</span><mark>Mood</mark></div>
      <div class="row">
        <button class="iconbtn" data-go="cart" aria-label="cart" id="topCart" style="position:relative">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9.5 8a2.5 2.5 0 0 1 5 0"/></svg>
          <span class="bdg" id="topbadge" style="display:none;position:absolute;top:-3px;right:-3px">0</span>
        </button>
        <button class="iconbtn" data-go="profile" aria-label="profile">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>
        </button>
      </div>
    </div>
    <div class="shell">
      <div id="view"></div>
    </div>
  </main>

  <nav class="tabbar" id="tabbar"></nav>

  <div class="cartbar" id="cartbar">
    <span id="cbt">🛒 0 item</span>
    <button data-go="cart">Lihat Pesanan</button>
  </div>

  <div class="pet" id="pet"></div>
</div>

<!-- ============ modals ============ -->
<div class="modal" id="shareModal">
  <div class="mbox">
    <div class="mhead"><h3>Bagikan pilihanku</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="shareBody"></div>
  </div>
</div>

<div class="modal" id="adminModal">
  <div class="mbox">
    <div class="mhead"><h3>Database pendaftar</h3><button class="closebtn" aria-label="close">✕</button></div>
    <div id="adminBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== Cimo mascot (SVG) — ported 1:1 from the design mockup ===== */
const MOODC = {
  def:    ['#ffa9c9', '#f27aa8'],
  senang: ['#eef26b', '#c9d445'],
  sedih:  ['#8fd3ff', '#5eb0ee'],
  marah:  ['#ffac78', '#f2864c'],
  capek:  ['#f3f6fc', '#cfd5e6'],
  kecewa: ['#ecd7ab', '#cdb27e'],
  bingung:['#9fead0', '#68cdaa'],
};
const MOODLBL = {def:'Cimo', senang:'Senang', sedih:'Sedih', marah:'Marah', capek:'Capek', kecewa:'Kecewa', bingung:'Bingung'};
let _cu = 0;

function cimo(mood, size, peek, costume) {
  mood = MOODC[mood] ? mood : 'def';
  size = size || 120;
  const [a, b] = MOODC[mood], g = 'c' + (_cu++), k = '#2f2a6b';
  const eye = (x, ry, py) => {
    ry = ry === undefined ? 14 : ry; py = py || 0;
    return `<ellipse cx="${x}" cy="${88 + py}" rx="12" ry="${ry}" fill="${k}"/><circle cx="${x + 4}" cy="${82 + py}" r="4.6" fill="#fff"/><circle cx="${x - 3}" cy="${95 + py}" r="2.2" fill="#fff"/>`;
  };
  const st = (d, w) => `<path d="${d}" fill="none" stroke="${k}" stroke-width="${w || 4}" stroke-linecap="round" stroke-linejoin="round"/>`;
  let e = eye(76) + eye(124), x = '', mo = st('M90 110Q100 119 110 110');
  const TY = {def:0, senang:0, sedih:4, marah:2, capek:0, kecewa:6, bingung:0};
  x += `<g transform="translate(0 ${TY[mood]})">` + st('M60 74l-6-4M64 69l-3-6M140 74l6-4M136 69l3-6', 3) + '</g>';

  if (mood === 'senang') {
    mo = '<path d="M84 106Q100 134 116 106Z" fill="#7a2a55"/><ellipse cx="100" cy="122" rx="8" ry="4.5" fill="#ff8fa8"/>';
    x += '<path d="M24 40l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM168 30l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#ffc800"/>';
  }
  if (mood === 'sedih') {
    e = eye(76, 15, 4) + eye(124, 15, 4);
    x += '<path d="M64 108q-6 10 0 13q6-3 0-13z" fill="#fff" opacity=".9"/>';
    mo = st('M88 122Q100 110 112 122');
  }
  if (mood === 'marah') {
    e = eye(76, 11, 2) + eye(124, 11, 2);
    x += '<path d="M150 34l12 12M162 34l-12 12" stroke="#ff4d4d" stroke-width="4.5" stroke-linecap="round"/>';
    mo = st('M88 121Q100 112 112 121');
  }
  if (mood === 'capek') {
    e += `<rect x="62" y="68" width="28" height="20" fill="${a}"/><rect x="110" y="68" width="28" height="20" fill="${a}"/>` + st('M62 88h28M110 88h28');
    mo = st('M91 119h18');
    x += '<path d="M72 12v16M86 6v22M100 4v24M114 6v22M128 12v16" stroke="#8a8fa8" stroke-width="2.5" stroke-linecap="round"/>';
  }
  if (mood === 'kecewa') {
    e = eye(76, 12, 6) + eye(124, 12, 6);
    x += '<path d="M154 50q-6 10 0 13q6-3 0-13z" fill="#bfe6ff" stroke="#6db6f3" stroke-width="2"/>';
    mo = st('M89 121Q100 113 111 121');
  }
  if (mood === 'bingung') {
    e = eye(76, 14) + eye(124, 10, -2);
    x += '<g fill="none" stroke="#2fae8a" stroke-width="3" stroke-linecap="round"><path d="M36 38a8 8 0 1 1 8 8a4 4 0 1 1-4-4"/><path d="M160 36a8 8 0 1 1 8 8a4 4 0 1 1-4-4"/></g><text x="92" y="28" font-size="28" font-weight="700" fill="#2fae8a" font-family="Fredoka,sans-serif">?</text>';
    mo = st('M86 117q7-8 14 0t14 0');
  }
  const core = `<ellipse cx="100" cy="96" rx="70" ry="62" fill="${b}"/><g clip-path="url(#${g})"><ellipse cx="93" cy="89" rx="68" ry="60" fill="${a}"/></g><ellipse cx="62" cy="56" rx="15" ry="8" transform="rotate(-28 62 56)" fill="#fff" opacity=".55"/><circle cx="82" cy="45" r="3.4" fill="#fff" opacity=".55"/><ellipse cx="52" cy="108" rx="11" ry="7" fill="#ff6f9c" opacity=".42"/><ellipse cx="148" cy="108" rx="11" ry="7" fill="#ff6f9c" opacity=".42"/><g fill="#fff" opacity=".6"><circle cx="146" cy="130" r="2"/><circle cx="156" cy="124" r="1.6"/><circle cx="52" cy="132" r="1.8"/><circle cx="62" cy="138" r="1.5"/></g>${e}${x}${mo}`;
  const defs = `<defs><clipPath id="${g}"><ellipse cx="100" cy="96" rx="70" ry="62"/></clipPath><clipPath id="${g}c"><rect x="-10" y="0" width="220" height="138"/></clipPath></defs>`;

  let body;
  if (peek) {
    const hd = cx => `<circle cx="${cx}" cy="139" r="15" fill="${a}" stroke="${b}" stroke-width="1.6"/><circle cx="${cx - 5}" cy="133" r="3.2" fill="#fff" opacity=".5"/>`;

  } else {
    body = `<svg viewBox="0 0 200 185" width="${size}" role="img" aria-label="Cimo ${mood}">${defs}<ellipse cx="100" cy="173" rx="56" ry="7" fill="#3a2142" opacity=".1"/><ellipse cx="78" cy="159" rx="17" ry="9" fill="${b}"/><ellipse cx="122" cy="159" rx="17" ry="9" fill="${b}"/><ellipse cx="32" cy="106" rx="12" ry="14" transform="rotate(-20 32 106)" fill="${a}"/><ellipse cx="168" cy="100" rx="12" ry="14" transform="rotate(20 168 100)" fill="${a}"/>${core}</svg>`;
  }
  if (!costume) return body;
  // costume overlay
  const dk = MOODC[mood][1], g2 = 'k' + (_cu++);
  let o = '';
  if (costume === 'crown') o += `<path d="M68 46L72 20L88 34L100 12L112 34L128 20L132 46Z" fill="#ffd25e" stroke="#e0a82e" stroke-width="3" stroke-linejoin="round"/><circle cx="72" cy="20" r="4" fill="#ff8fb8"/><circle cx="100" cy="12" r="4.5" fill="#8fd3ff"/><circle cx="128" cy="20" r="4" fill="#ff8fb8"/>`;
  if (costume === 'koki') o += `<g stroke="${dk}" stroke-width="2.5"><circle cx="72" cy="26" r="16" fill="#fff"/><circle cx="100" cy="16" r="20" fill="#fff"/><circle cx="128" cy="26" r="16" fill="#fff"/></g><rect x="64" y="30" width="72" height="19" rx="5" fill="#fff" stroke="${dk}" stroke-width="2.5"/><path d="M78 126H122L100 150Z" fill="#ff8fb8"/>`;
  if (costume === 'batik') o += `<g clip-path="url(#${g2})"><path d="M24 132Q100 152 176 132V176H24Z" fill="#7a4a2a"/><path d="M24 132Q100 152 176 132" fill="none" stroke="#e0b25a" stroke-width="3.5"/></g>`;
  return `<div style="position:relative;display:inline-block;line-height:0">${body}<svg viewBox="0 0 200 185" width="${size}" style="position:absolute;left:0;top:0"><defs><clipPath id="${g2}"><ellipse cx="100" cy="96" rx="70" ry="62"/></clipPath></defs>${o}</svg></div>`;
}

/* standalone SVG for canvas export */
function cimoSVG(mood, size) {
  const s = cimo(mood, size || 300).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  return s;
}

/* ===== database layer =====
   Works in two modes:
   1. remote  — if a CraveMood API is reachable (server/server.js), all writes go there
   2. local   — otherwise a JSON store in localStorage (default on GitHub Pages)
   Schema is identical in both modes, see db/schema.sql
*/
const DB = (() => {
  const KEY = 'cravemood.db.v1';
  const SCHEMA = { v: 1, users: [], moods: [], orders: [], chats: [], spins: [], settings: {} };
  let state = null, remote = false, base = '', ready = false;

  const uid = () => 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(clone(SCHEMA), JSON.parse(raw)) : clone(SCHEMA);
    } catch (e) { state = clone(SCHEMA); }
    if (!Array.isArray(state.users)) state.users = [];
    return state;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn('DB: quota', e); }
  }

  /* password hashing — SHA-256 when available, deterministic fallback otherwise */
  async function hash(pw, salt) {
    const txt = salt + '::' + pw + '::cravemood';
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* insecure context */ }
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < txt.length; i++) {
      h1 ^= txt.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ txt.charCodeAt(i), 2654435761) >>> 0;
    }
    return 'fnv' + h1.toString(16) + h2.toString(16);
  }

  async function probe() {
    base = (window.CRAVEMOOD_API || '').replace(/\/$/, '');
    if (!base && location.protocol === 'file:') return false;
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 1200);
      const r = await fetch((base || '') + '/api/health', { signal: c.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j && j.ok);
    } catch (e) { return false; }
  }

  async function api(path, body, key) {
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers['X-Admin-Key'] = key;
    const r = await fetch(base + path, {
      method: body ? 'POST' : 'GET',
      headers: headers,
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store',
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  /* ---- public API ---- */
  return {
    get isRemote() { return remote; },
    get ready() { return ready; },

    async init() {
      remote = await probe();
      ready = true;
      return remote;
    },

    /* account */
    async register({ name, contact, password, lang, guest }) {
      if (remote) {
        const j = await api('/api/register', { name, contact, password, lang, guest });
        return j;
      }
      const s = load();
      const c = String(contact || '').trim().toLowerCase();
      if (!guest && s.users.some(u => (u.contact || '').toLowerCase() === c)) {
        return { ok: false, error: 'exists' };
      }
      const salt = Math.random().toString(36).slice(2, 10);
      const u = {
        id: uid(), name: String(name || '').trim().slice(0, 40),
        contact: c, lang: lang || 'id', salt,
        pw: guest ? '' : await hash(password || '', salt),
        guest: !!guest,
        created: new Date().toISOString(),
        last_seen: new Date().toISOString(),
        moods: 0, orders: 0, chats: 0, spins: 0,
      };
      s.users.push(u); persist();
      return { ok: true, user: pub(u) };
    },

    async login({ contact, password }) {
      if (remote) return api('/api/login', { contact, password });
      const s = load();
      const c = String(contact || '').trim().toLowerCase();
      const u = s.users.find(x => (x.contact || '').toLowerCase() === c && !x.guest);
      if (!u) return { ok: false, error: 'bad' };
      const h = await hash(password || '', u.salt);
      if (h !== u.pw) return { ok: false, error: 'bad' };
      u.last_seen = new Date().toISOString(); persist();
      return { ok: true, user: pub(u) };
    },

    async me(id) {
      if (!id) return null;
      if (remote) {
        try { const j = await api('/api/me?id=' + encodeURIComponent(id)); return j.ok ? j.user : null; }
        catch (e) { return null; }
      }
      const u = load().users.find(x => x.id === id);
      return u ? pub(u) : null;
    },

    async users(adminKey) {
      if (remote) { const j = await api('/api/users', null, adminKey); return j.users || []; }
      return load().users.map(pub);
    },

    async touch(id) {
      if (remote) return;
      const u = load().users.find(x => x.id === id);
      if (u) { u.last_seen = new Date().toISOString(); persist(); }
    },

    /* activity */
    async addMood(userId, mood, date) {
      const d = date || new Date().toISOString().slice(0, 10);
      if (remote) { try { await api('/api/mood', { userId, mood, date: d }); } catch (e) {} }
      const s = load();
      s.moods = s.moods.filter(m => !(m.user_id === userId && m.date === d));
      s.moods.push({ user_id: userId, mood, date: d, at: new Date().toISOString() });
      const u = s.users.find(x => x.id === userId); if (u) u.moods = (u.moods || 0) + 1;
      persist();
    },

    async addOrder(userId, payload) {
      if (remote) { try { await api('/api/order', Object.assign({ userId }, payload)); } catch (e) {} }
      const s = load();
      s.orders.push(Object.assign({ id: 'o_' + Date.now().toString(36), user_id: userId, at: new Date().toISOString() }, payload));
      const u = s.users.find(x => x.id === userId); if (u) u.orders = (u.orders || 0) + 1;
      persist();
    },

    async logChat(userId, role, text) {
      const s = load();
      s.chats.push({ user_id: userId, role, text: String(text).slice(0, 500), at: new Date().toISOString() });
      if (s.chats.length > 800) s.chats = s.chats.slice(-800);
      const u = s.users.find(x => x.id === userId); if (u) u.chats = (u.chats || 0) + 1;
      persist();
    },

    async logSpin(userId, item) {
      const s = load();
      s.spins.push({ user_id: userId, item, at: new Date().toISOString() });
      if (s.spins.length > 500) s.spins = s.spins.slice(-500);
      const u = s.users.find(x => x.id === userId); if (u) u.spins = (u.spins || 0) + 1;
      persist();
    },

    moodsOf(userId) {
      return load().moods.filter(m => m.user_id === userId).map(m => ({ d: m.date, m: m.mood }));
    },

    /* settings blob (per device) */
    getSetting(k, dflt) {
      const s = load();
      return (s.settings && s.settings[k] !== undefined) ? s.settings[k] : dflt;
    },
    setSetting(k, v) {
      const s = load();
      s.settings[k] = v; persist();
    },

    /* export */
    dump() { return clone(load()); },
    async exportJSON(adminKey) {
      let data = null;
      if (remote && adminKey) { try { data = await api('/api/export', null, adminKey); } catch (e) { data = null; } }
      if (!data) data = load();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      dl(blob, 'cravemood-database-' + new Date().toISOString().slice(0, 10) + '.json');
    },
    async exportCSV(adminKey) {
      const rows = await this.users(adminKey);
      const head = ['id', 'name', 'contact', 'lang', 'guest', 'created', 'last_seen', 'moods', 'orders', 'chats', 'spins'];
      const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const csv = [head.join(',')].concat(rows.map(r => head.map(h => esc(r[h])).join(','))).join('\r\n');
      dl(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), 'cravemood-registrants.csv');
    },
  };

  function pub(u) {
    return {
      id: u.id, name: u.name, contact: u.contact, lang: u.lang, guest: !!u.guest,
      created: u.created, last_seen: u.last_seen,
      moods: u.moods || 0, orders: u.orders || 0, chats: u.chats || 0, spins: u.spins || 0,
    };
  }
  function dl(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  }
})();


/* ===== Cimo voice engine + sound effects ===== */

const VOICES = [
  {id:'lembut',  name:'Cimo Lembut',  desc:'Halus, pelan, menenangkan', rate:0.92, pitch:1.12, icon:'🌸'},
  {id:'ceria',   name:'Cimo Ceria',   desc:'Cerah, ceria, bersemangat',  rate:1.06, pitch:1.34, icon:'✨'},
  {id:'tenang',  name:'Cimo Tenang',  desc:'Rendah, dewasa, sabar',      rate:0.84, pitch:0.96, icon:'🌙'},
  {id:'energik', name:'Cimo Energik', desc:'Cepat, lincah, playful',     rate:1.16, pitch:1.24, icon:'⚡'},
  {id:'hangat',  name:'Cimo Hangat',  desc:'Berat, hangat, seperti kakak',rate:0.95, pitch:0.82, icon:'🤎'},
];

const Voice = (() => {
  const synth = window.speechSynthesis;
  const supported = !!synth;
  let voices = [], cur = null, speaking = false, queue = 0;
  const S = {
    profile: 'lembut', lang: 'id', rate: 1, pitch: 1, volume: 1, enabled: true,
  };

  function loadVoices() {
    if (!supported) return;
    voices = synth.getVoices() || [];
  }
  if (supported) {
    loadVoices();
    synth.addEventListener && synth.addEventListener('voiceschanged', loadVoices);
    if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = loadVoices;
  }

  const LOCALE = { id: 'id-ID', en: 'en-US', zh: 'zh-CN', hi: 'hi-IN' };

  function pickVoice(lang) {
    const want = (LOCALE[lang] || 'id-ID').toLowerCase();
    const pre = want.split('-')[0];
    const score = v => {
      let s = 0;
      const n = (v.name || '').toLowerCase(), l = (v.lang || '').toLowerCase().replace('_', '-');
      if (l === want) s += 60;
      else if (l.startsWith(pre)) s += 35;
      else return -1;
      if (/natural|neural|premium|enhanced/.test(n)) s += 25;
      if (/google/.test(n)) s += 14;
      if (/microsoft/.test(n)) s += 8;
      if (/female|wanita|perempuan|xiaoxiao|siti|swara|zira|aria|jenny|kalpana|heera/.test(n)) s += 10;
      if (v.localService) s += 4;
      return s;
    };
    let best = null, bs = -1;
    for (const v of voices) { const s = score(v); if (s > bs) { bs = s; best = v; } }
    return best;
  }

  function profile() { return VOICES.find(v => v.id === S.profile) || VOICES[0]; }

  /* split into human-sized chunks so the voice breathes */
  function chunks(text) {
    return String(text)
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
      .replace(/\s+/g, ' ')
      .split(/(?<=[.!?。！？…])\s+|(?<=[,;，、])\s+/)
      .map(s => s.trim())
      .filter(Boolean)
      .reduce((acc, s) => {
        const last = acc[acc.length - 1];
        if (last && last.length + s.length < 90) acc[acc.length - 1] = last + ' ' + s;
        else acc.push(s);
        return acc;
      }, []);
  }

  function speak(text, opts) {
    if (!supported || !S.enabled) return Promise.resolve();
    opts = opts || {};
    try { synth.cancel(); } catch (e) {}
    const p = profile();
    const list = chunks(text);
    if (!list.length) return Promise.resolve();
    const v = pickVoice(opts.lang || S.lang);
    const token = ++queue;
    speaking = true;

    return new Promise(resolve => {
      let i = 0;
      const next = () => {
        if (token !== queue || i >= list.length) { if (token === queue) speaking = false; return resolve(); }
        const seg = list[i++];
        const u = new SpeechSynthesisUtterance(seg);
        if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = LOCALE[opts.lang || S.lang] || 'id-ID'; }
        // natural prosody: slow down on the first chunk, gentle lift at the end of questions
        const isQ = /[?？]$/.test(seg);
        const drift = (i === 1 ? -0.03 : 0) + (isQ ? 0.05 : 0) + (Math.random() * 0.04 - 0.02);
        u.rate = clamp((opts.rate || p.rate * S.rate) + drift, 0.5, 1.8);
        u.pitch = clamp((opts.pitch || p.pitch * S.pitch) + (isQ ? 0.07 : 0), 0, 2);
        u.volume = clamp(S.volume, 0, 1);
        u.onend = () => setTimeout(next, i === list.length ? 0 : 70);
        u.onerror = () => { speaking = false; resolve(); };
        try { synth.speak(u); } catch (e) { resolve(); }
      };
      next();
    });
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function stop() { try { synth.cancel(); } catch (e) {} speaking = false; queue++; }

  return {
    get supported() { return supported; },
    get voices() { return voices; },
    get speaking() { return speaking; },
    get settings() { return S; },
    get current() { return profile(); },
    set(k, v) { S[k] = v; },
    setAll(o) { Object.assign(S, o); },
    speak, stop,
    preview(id, lang) {
      const p = VOICES.find(v => v.id === id) || profile();
      const line = {
        id: 'Hai, aku Cimo. Kalau kamu lagi capek, cerita aja. Aku dengerin sampai selesai.',
        en: 'Hi, I am Cimo. If you are tired, just tell me. I will listen until the end.',
        zh: '嗨，我是 Cimo。如果你累了，就跟我说吧，我会听你说完。',
        hi: 'नमस्ते, मैं Cimo हूँ। अगर थक गए हो, तो बताइए। मैं पूरा सुनूँगा।',
      }[lang || S.lang] || '';
      return speak(line, { rate: p.rate * S.rate, pitch: p.pitch * S.pitch, lang: lang || S.lang });
    },
  };
})();

/* ===== synthesized UI sounds (no assets needed) ===== */
const SFX = (() => {
  let ctx = null, on = true;
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, gain, slideTo) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.16, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  const lib = {
    add() { tone(660, .09, 'triangle', .16, 1180); setTimeout(() => tone(1320, .07, 'sine', .09), 55); },
    remove() { tone(420, .1, 'triangle', .13, 260); },
    tap() { tone(880, .045, 'sine', .07); },
    pop() { tone(520, .07, 'sine', .12, 900); },
    success() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .16, 'sine', .11), i * 80)); },
    tick() { tone(1400, .03, 'square', .05); },
    error() { tone(240, .18, 'sawtooth', .09, 160); },
    spin() { for (let i = 0; i < 8; i++) setTimeout(() => tone(900 - i * 60, .04, 'square', .04), i * 55); },
  };
  return {
    get enabled() { return on; },
    set enabled(v) { on = !!v; },
    init() { ac(); },
    play(name) { if (!on) return; try { (lib[name] || lib.tap)(); } catch (e) {} },
  };
})();

    fallback: ['समझ नहीं आया। एक बात और कहोगे?', 'मैं सच में समझना चाहता हूँ। कौन सी बात सबसे ज़रूरी है?'],

const REFLECT = {
  id: ['Kedengeran berat ya.', 'Aku nangkep kok.', 'Hmm, itu nggak enak.', 'Oke, aku ngerti arahnya.', 'Wajar kalau kamu ngerasa gitu.'],
  en: ['That sounds heavy.', 'I hear you.', 'Hmm, that is rough.', 'Okay, I follow.', 'It makes sense you feel that way.'],
  zh: ['听起来很沉重。', '我懂你的意思。', '嗯，那确实难受。', '好，我跟上了。'],
  hi: ['सुनने में भारी लगता है।', 'मैं समझ रहा हूँ।', 'हम्म, यह मुश्किल है।', 'ठीक, समझ गया।'],
};

const CHIPS = {
  id: [['Lagi capek banget','tired'],['Aku lagi sedih','sad'],['Mau makan apa ya?','food_ask'],['Aku butuh teman cerita','lonely']],
  en: [['I am so tired','tired'],['I feel sad','sad'],['What should I eat?','food_ask'],['I need to talk','lonely']],
  zh: [['我好累','tired'],['我有点难过','sad'],['我该吃什么？','food_ask'],['我想找人聊聊','lonely']],
  hi: [['मैं थक गया हूँ','tired'],['मन उदास है','sad'],['क्या खाऊँ?','food_ask'],['किसी से बात करनी है','lonely']],
};

const ChatEngine = (() => {
  const S = {
    name: '', lang: 'id', mood: 'def', turn: 0,
    topics: [], lastTopic: null, lastIntent: null, pending: null,
    sentiment: 0, trend: [], foods: [], askedName: false, used: {},
  };
  const HISTORY = [];

  function normalize(t) {
    let s = String(t || '').toLowerCase().trim();
    s = s.replace(/[^\p{L}\p{N}\s'?！？。，、]/gu, ' ');
    s = s.replace(/\s+/g, ' ');
    const words = s.split(' ');
    const mapped = words.map(w => SLANG[w] || w);
    return { raw: s, norm: mapped.join(' '), words: mapped };
  }

  function detectLang(text) {
    if (/[\u4e00-\u9fff]/.test(text)) return 'zh';
    if (/[\u0900-\u097f]/.test(text)) return 'hi';
    const en = /\b(the|you|i|am|are|is|what|why|how|feel|today|tired|sad|want|eat|love|work|because|really|thanks|hello)\b/i;
    if (en.test(text) && !/\b(aku|kamu|saya|lagi|makan|gimana|banget)\b/i.test(text)) return 'en';
    return S.lang;
  }

  function sentiment(norm, words) {
    let score = 0, hits = 0;
    words.forEach((w, i) => {
      let v = 0;
      if (POS.indexOf(w) > -1) v = 1;
      else if (NEG.indexOf(w) > -1) v = -1;
      if (!v) return;
      const prev = words.slice(Math.max(0, i - 2), i).join(' ');
      if (NEGATORS.some(n => prev.indexOf(n) > -1)) v *= -0.85;
      score += v; hits++;
    });
    // intensifiers
    if (/banget|sangat|parah|amat|really|very|so much|bgt|extremely|太|非常|बहुत/.test(norm)) score *= 1.35;
    return hits ? Math.max(-3, Math.min(3, score / Math.sqrt(hits) * 1.4)) : 0;
  }

  function emotionOf(norm, sc) {
    if (/marah|kesal|kesel|bete|emosi|benci|angry|mad|hate|गुस्सा|生气/.test(norm)) return 'marah';
    if (/capek|lelah|letih|ngantuk|exhaust|tired|burnout|थका|累/.test(norm)) return 'capek';
    if (/cemas|takut|khawatir|overthink|panik|anxious|worried|scared|焦虑|चिंता/.test(norm)) return 'bingung';
    if (/kecewa|hampa|kosong|numb|hopeless|empty|putus asa|失望|निराश/.test(norm)) return 'kecewa';
    if (/sedih|nangis|menangis|sepi|kesepian|lonely|sad|cry|broken|难过|उदास/.test(norm)) return 'sedih';
    if (sc > 0.9) return 'senang';
    if (sc < -0.9) return 'sedih';
    return S.mood === 'def' ? 'def' : S.mood;
  }

  function topicsOf(norm) {
    const out = [];
    for (const k in TOPICS) {
      if (TOPICS[k].some(w => norm.indexOf(w) > -1)) out.push(k);
    }
    return out;
  }

  function scoreIntent(norm, raw) {
    let best = { id: 'fallback', s: 0 };
    for (const it of INTENTS) {
      let s = 0;
      for (const kw of it.k) {
        if (norm.indexOf(kw) > -1 || raw.indexOf(kw) > -1) {
          s += kw.length > 5 ? 2.2 : (kw.length > 3 ? 1.7 : 1.2);
          if (kw.indexOf(' ') > -1) s += 0.8;
        }
      }
      if (s > best.s) best = { id: it.id, s };
    }
    return best;
  }

  function pick(arr) {
    if (!arr || !arr.length) return null;
    const key = arr.join('|').slice(0, 40);
    S.used[key] = (S.used[key] || 0) + 1;
    const i = (S.used[key] - 1) % arr.length;
    return arr[i];
  }

  function bank(lang, intent) {
    const b = BANK[lang] || BANK.id;
    return b[intent] || (BANK.id[intent] || BANK.id.fallback);
  }

  function fill(t) {
    return String(t)
      .replace(/\{name\}/g, S.name || (S.lang === 'en' ? 'you' : 'kamu'))
      .replace(/\{topic\}/g, topicWord(S.lastTopic))
      .replace(/\{food\}/g, S.foods[0] || '');
  }
  const TOPICWORD = {
    id:{kerja:'kerjaan',kuliah:'kuliah',cinta:'urusan hati',keluarga:'keluarga',uang:'uang',teman:'pertemanan',badan:'badan',diri:'diri sendiri'},
    en:{kerja:'work',kuliah:'school',cinta:'love',keluarga:'family',uang:'money',teman:'friendship',badan:'health',diri:'yourself'},
    zh:{kerja:'工作',kuliah:'学业',cinta:'感情',keluarga:'家人',uang:'钱',teman:'朋友',badan:'身体',diri:'自己'},
    hi:{kerja:'काम',kuliah:'पढ़ाई',cinta:'रिश्ते',keluarga:'परिवार',uang:'पैसा',teman:'दोस्ती',badan:'सेहत',diri:'खुद'},
  };
  function topicWord(t) { return ((TOPICWORD[S.lang] || TOPICWORD.id)[t]) || (S.lang === 'en' ? 'that' : 'itu'); }

  function foodSuggest() {
    const m = S.mood === 'def' ? (S.sentiment < 0 ? 'sedih' : 'bingung') : S.mood;
    const list = MENU.filter(x => x.moods.indexOf(m) > -1);
    return list.length ? list[Math.floor(Math.random() * list.length)] : MENU[0];
  }

  /* --- optional LLM upgrade --- */
  async function llm(text) {
    const cfg = DB.getSetting('ai', {});
    if (!cfg.key) return null;
    const base = (cfg.base || 'https://api.openai.com/v1').replace(/\/$/, '');
    const langName = { id:'Indonesian', en:'English', zh:'Simplified Chinese', hi:'Hindi' }[S.lang] || 'Indonesian';
    const sys = `You are Cimo, a warm best friend inside CraveMood (a Makassar food app). Reply ONLY in ${langName}.
Be human: 2-4 short sentences, casual, specific, never preachy. Reflect what the user feels before advising.
Remember the conversation: reference earlier details naturally. Ask at most one gentle question at the end.
Never say you are an AI. Never list bullet points. User name: ${S.name || 'unknown'}. Current mood: ${S.mood}.
If they mention food, you may suggest Makassar dishes (coto, konro, pallubasa, es pisang ijo, pisang epe, jalangkote, mie titi).`;
    const msgs = [{ role: 'system', content: sys }].concat(HISTORY.slice(-14));
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 16000);
      const r = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
        body: JSON.stringify({ model: cfg.model || 'gpt-4o-mini', messages: msgs, temperature: 0.85, max_tokens: 240 }),
        signal: c.signal,
      });
      clearTimeout(t);
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      const out = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      return out ? out.trim() : null;
    } catch (e) { return null; }
  }

  async function reply(text) {
    const { raw, norm, words } = normalize(text);
    const lang = detectLang(String(text || ''));
    if (lang !== S.lang) { S.lang = lang; }
    S.turn++;

    const sc = sentiment(norm, words);
    S.sentiment = sc;
    S.trend.push(sc);
    if (S.trend.length > 8) S.trend.shift();

    const emo = emotionOf(norm, sc);
    const tp = topicsOf(norm);
    if (tp.length) {
      tp.forEach(t => { if (S.topics.indexOf(t) === -1) S.topics.push(t); });
      S.lastTopic = tp[0];
    }

    let { id: intent, s: score } = scoreIntent(norm, raw);

    // short answers continue the previous thread instead of resetting it
    const short = words.length <= 4;
    if (score < 1.6 && short && S.pending) {
      if (/^(iya|ya|yes|yup|betul|bener|hmm|oke|ok|he eh|heeh)$/.test(norm)) intent = 'more';
      else if (/^(tidak|nggak|gak|no|belum|bukan|engga)$/.test(norm)) intent = 'more';
    }
    if (score < 1.6 && /[?？]/.test(String(text)) && S.lastIntent) intent = 'why';
    if (score < 1.6 && tp.length && sc < -0.4) intent = topicIntent(tp[0]);

    // never greet twice in a row
    if (intent === 'greet' && (S.lastIntent === 'greet' || S.turn > 2)) intent = 'ask_how';

    S.mood = emo;

    // LLM path
    HISTORY.push({ role: 'user', content: String(text).slice(0, 400) });
    const ai = await llm(text);
    if (ai) {
      HISTORY.push({ role: 'assistant', content: ai });
      S.lastIntent = intent; S.pending = true;
      return { text: ai, mood: emo, chips: chipsFor(intent), source: 'ai' };
    }

    // local path
    let core = fill(pick(bank(S.lang, intent)) || pick(BANK.id.fallback));
    if (intent === 'fallback' && tp.length) core = fill(pick(bank(S.lang, topicIntent(tp[0]))));
    if (intent === 'who_am_i' && !S.lastTopic) core = fill(pick(bank(S.lang, 'who_am_i'))).replace(/\{topic\}/g, topicWord('kerja'));

    // reflection prefix, only when the user shares something emotional
    let pre = '';
    if (sc <= -0.8 && intent !== 'thanks' && intent !== 'bye' && intent !== 'greet' && Math.random() < 0.62) {
      pre = pick(REFLECT[S.lang] || REFLECT.id) + ' ';
    }
    // thread callback
    let call = '';
    if (S.turn > 3 && S.topics.length && sc < -0.3 && Math.random() < 0.3) {
      call = {
        id: `Tadi kamu juga cerita soal ${topicWord(S.topics[S.topics.length - 1])}. `,
        en: `You mentioned ${topicWord(S.topics[S.topics.length - 1])} earlier too. `,
        zh: `你刚才也提到${topicWord(S.topics[S.topics.length - 1])}。`,
        hi: `तुमने पहले भी ${topicWord(S.topics[S.topics.length - 1])} के बारे में बताया था। `,
      }[S.lang] || '';
    }

    let out = pre + call + core;

    // after a few emotional turns, offer food as a bridge into the app
    if (S.turn >= 3 && sc < -0.5 && !S.foods.length && Math.random() < 0.42) {
      const f = foodSuggest();
      S.foods.push(f.name);
      const tail = {
        id: ` Kalau kamu mau, aku bisa temenin cari yang anget — ${f.name} misalnya. Mau?`,
        en: ` If you want, I can help you find something warm — ${f.name}, maybe. Want that?`,
        zh: ` 如果你愿意，我可以帮你找点热的——比如${f.name}。要吗？`,
        hi: ` चाहो तो कुछ गरम ढूँढ लें — जैसे ${f.name}। चलेगा?`,
      }[S.lang];
      out += tail;
    }

    HISTORY.push({ role: 'assistant', content: out });
    if (HISTORY.length > 40) HISTORY.splice(0, HISTORY.length - 40);

    S.lastIntent = intent;
    S.pending = ['tired','sad','angry','anxious','lonely','love','work','school','money','family','friend','health','stressed','fail','empty','selfdoubt','more','why','advice'].indexOf(intent) > -1;

    return { text: out, mood: emo, chips: chipsFor(intent), source: 'local', intent: intent };
  }

  function topicIntent(t) {
    return ({ kerja:'work', kuliah:'school', cinta:'love', keluarga:'family', uang:'money', teman:'friend', badan:'health', diri:'selfdoubt' })[t] || 'sad';
  }

  function chipsFor(intent) {
    const base = CHIPS[S.lang] || CHIPS.id;
    const extra = {
      id: {
        tired: ['Iya, capek pikiran','Capek badan','Aku mau istirahat'],
        sad: ['Aku mau cerita','Aku cuma butuh didengar','Aku nggak tahu kenapa'],
        food_ask: ['Yang anget','Yang pedes','Yang murah'],
        love: ['Kita putus','Aku masih sayang','Aku bingung'],
        work: ['Bos-ku nyebelin','Aku mau resign','Lembur terus'],
      },
      en: {
        tired: ['Mental tired','Body tired','I want to rest'],
        sad: ['I want to talk','Just listen please','I do not know why'],
        food_ask: ['Something warm','Something spicy','Something cheap'],
        love: ['We broke up','I still love them','I am confused'],
        work: ['My boss is awful','I want to quit','Always overtime'],
      },
    }[S.lang];
    const list = (extra && extra[intent]) || base;
    return list.slice(0, 3);
  }

  return {
    get state() { return S; },
    setLang(l) { S.lang = l; },
    setName(n) { S.name = n; S.askedName = true; },
    setMood(m) { S.mood = m; },
    reset() { S.turn = 0; S.topics = []; S.lastTopic = null; S.lastIntent = null; S.pending = null; S.sentiment = 0; S.trend = []; S.foods = []; HISTORY.length = 0; },
    greet(name) {
      S.name = name || S.name;
      const t = {
        id: `Hai ${S.name || 'kamu'}! Aku Cimo. Di sini kamu bisa cerita apa aja — nggak harus rapi, nggak harus positif. Mau mulai dari mana?`,
        en: `Hey ${S.name || 'you'}! I am Cimo. You can tell me anything here — no need to be tidy, no need to be positive. Where do you want to start?`,
        zh: `嗨 ${S.name || '你'}！我是 Cimo。这里想说什么都可以——不用讲得整齐，也不用假装开心。想从哪里开始？`,
        hi: `नमस्ते ${S.name || 'तुम'}! मैं Cimo हूँ। यहाँ कुछ भी कह सकते हो — सलीके से कहने की ज़रूरत नहीं। कहाँ से शुरू करें?`,
      }[S.lang];
      HISTORY.push({ role: 'assistant', content: t });
      return t;
    },
    reply,
    chips: () => CHIPS[S.lang] || CHIPS.id,
    quickChipsFor: chipsFor,
    foodSuggest,
  };
})();

const rp = n => 'Rp ' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

/* ---------- distance ---------- */
function distKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.max(0.6, 2 * R * Math.asin(Math.sqrt(h)) * 1.25);
}
function streetOf(i) { return STREETS[i] || STREETS[0]; }
function curStreet() { return STREETS.find(s => s.id === App.street) || STREETS[0]; }
function distOf(item) { return +(distKm(curStreet(), streetOf(item.st)) + jitter(item.id)).toFixed(1); }
function minsOf(item) { return Math.max(8, Math.round(distOf(item) * 3.6)); }
function jitter(id) { let h = 7; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return (h % 16) / 10; }

/* ---------- persistence ---------- */
function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(App.cart)); } catch (e) {} }
function loadCart() { try { App.cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; } catch (e) { App.cart = {}; } }
function saveSettings() { DB.setSetting('settings', App.settings); }
function savePrefs() { DB.setSetting('prefs', { lang: App.lang, mood: App.mood, street: App.street, costum: App.costum, pet: App.pet }); }

  e.textContent = msg; e.classList.add('on');

  toastT = setTimeout(() => e.classList.remove('on'), 2400);

}

/* ---------- cart ---------- */
function cartCount() { return Object.values(App.cart).reduce((a, b) => a + b, 0); }
function cartTotals() {
  let c = 0, lo = 0, hi = 0;
  for (const id in App.cart) {
    const it = MENU.find(m => m.id === id); if (!it) continue;
    const q = App.cart[id];
    c += q; lo += q * it.lo; hi += q * it.hi;
  }
  return { c, lo, hi };
}
function addToCart(id, silent) {
  App.cart[id] = (App.cart[id] || 0) + 1;
  saveCart(); SFX.play('add');
  const it = MENU.find(m => m.id === id);
  if (!silent) toast((it ? it.name : '') + ' ' + t('add_ok'));
  updateCartBar();
  if (currentView === 'home') renderRecs();
  else if (currentView === 'cart') renderCart();
  else if (currentView === 'spin') { const b = $('#spinResult'); if (b && App.lastSpin) renderSpinResult(App.lastSpin); }
}
function decCart(id) {
  if (!App.cart[id]) return;
  App.cart[id]--; SFX.play('remove');
  if (App.cart[id] <= 0) delete App.cart[id];
  saveCart(); updateCartBar();
  if (currentView === 'home') renderRecs();
  else if (currentView === 'cart') renderCart();
  else if (currentView === 'spin') { const b = $('#spinResult'); if (b && App.lastSpin) renderSpinResult(App.lastSpin); }
}
function updateCartBar() {
  const { c, lo, hi } = cartTotals();

  bar.classList.toggle('on', c > 0 && !hide);
  $('#cbt').textContent = `🛒 ${c} item · ±${rp(lo)} – ${rp(hi)}`;
  const b = $('#navbadge'); if (b) { b.textContent = c; b.style.display = c ? 'grid' : 'none'; }
  const mb = $('#topbadge'); if (mb) { mb.textContent = c; mb.style.display = c ? 'grid' : 'none'; }
}

function wheelItems() {
  let l = MENU.filter(m => m.moods.indexOf(App.mood) > -1);

}

function viewSpin() {
  const items = wheelItems();
  const n = items.length, seg = 360 / n;

  return `
  <div class="pagetitle"><div><h1>${t('spin_t')}</h1><p>${t('spin_sub')}</p></div>

        <svg class="pointer" width="34" height="40" viewBox="0 0 34 40"><path d="M17 38L4 10a14 14 0 0 1 26 0z" fill="#ff5f98" stroke="#fff" stroke-width="3"/></svg>
        <div class="wheel" id="wheel" style="background:conic-gradient(${grad})">
          ${items.map((m, i) => `<div class="seg" style="transform:rotate(${i * seg + seg / 2}deg)"><span>${esc(m.name.length > 15 ? m.name.slice(0, 14) + '…' : m.name)}</span></div>`).join('')}
          <div class="hub" style="left:calc(50% - 32px);top:calc(50% - 32px)">${cimo(App.mood, 52)}</div>
        </div>
      </div>
      <div class="spininfo">
        <h2 id="spinTitle">${t('spin_win')}</h2>
        <p>${t('spin_sub')}</p>
        <button class="btn block" id="spinBtn">${icon('wheel')} ${t('spin_go')}</button>
        <div id="spinResult"></div>
        <div id="spinHist"></div>
      </div>
    </div>
  </div>`;
}

function doSpin() {
  if (App.spinning) return;
  const wheel = $('#wheel'); if (!wheel) return;
  const items = wheelItems(), n = items.length, seg = 360 / n;
  const idx = Math.floor(Math.random() * n);
  const center = idx * seg + seg / 2;
  const jitter = (Math.random() - 0.5) * (seg * 0.55);
  const turns = 5 + Math.floor(Math.random() * 3);
  const prev = Number(wheel.dataset.rot || 0);
  const target = prev + turns * 360 + (360 - center) + jitter;
  wheel.dataset.rot = target;
  App.spinning = true;
  SFX.play('spin');
  let tk = 0;
  const iv = setInterval(() => { if (tk++ < 22) SFX.play('tick'); else clearInterval(iv); }, 190);
  wheel.style.transition = 'transform 4.6s cubic-bezier(.12,.72,.06,1)';
  wheel.style.transform = `rotate(${target}deg)`;
  setTimeout(() => {
    clearInterval(iv);
    App.spinning = false;
    App.lastSpin = items[idx];
    App.spinHist = (App.spinHist || []).concat(items[idx].name).slice(-8);
    SFX.play('success');
    renderSpinResult(items[idx]);
    if (App.user) DB.logSpin(App.user.id, items[idx].id).catch(() => {});
  }, 4700);
}

function renderSpinHist() {
  const hist = $('#spinHist'); if (!hist) return;

  $('#sendBtn').disabled = true;

  SFX.play('tap');
  if (App.user) DB.logChat(App.user.id, 'user', text).catch(() => {});

  const b = $('#chatBody');

  const res = await ChatEngine.reply(text);
  await new Promise(r => setTimeout(r, 420 + Math.random() * 480));

  addMsg('cimo', res.text, res.mood);
  App.mood = res.mood;
  renderChips(res.chips);
  if (App.user) DB.logChat(App.user.id, 'cimo', res.text).catch(() => {});

  if (App.settings.speak && Voice.supported) {
    Voice.speak(res.text.replace(/\*[^*]+\*/g, ''), { lang: App.settings.voiceLang || App.lang });

  updatePetFace();
}

/* ---------- recap ---------- */
function iso(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
function moodMap() {
  const map = {}, now = new Date();
  if (App.user) DB.moodsOf(App.user.id).forEach(x => { map[x.d] = x.m; });
  // gentle demo data for earlier days so the calendar never looks empty
  const keys = MOODS.map(m => m.k);
  for (let d = 1; d < now.getDate(); d++) {
    const k = iso(now.getFullYear(), now.getMonth(), d);
    if (!map[k]) { const h = (d * 7 + 3) % 11; if (h < 7) map[k] = keys[(d * 5 + h) % keys.length]; }
  }
  if (!map[iso(now.getFullYear(), now.getMonth(), now.getDate())]) map[iso(now.getFullYear(), now.getMonth(), now.getDate())] = App.mood;
  return map;
}
function viewRecap() {
  return `<div class="pagetitle"><div><h1>${t('recap_t')}</h1><p>${t('recap_sub')}</p></div>
    <button class="btn sm ghost" id="recapShare">${icon('share')} ${t('cart_share')}</button></div>
  <div class="card"><div class="stats">
    <div><b id="s1">0</b><span>${t('recap_day')}</span></div>
    <div><b id="s2">0</b><span>${t('recap_streak')}</span></div>
    <div><div id="s3" style="width:44px;height:44px;margin:0 auto"></div><span>${t('recap_top')}</span></div>
  </div></div>
  <div class="card" style="margin-top:12px"><b id="calTitle" style="font-size:1rem"></b><div class="cal" id="cal"></div></div>
  <div class="card" style="margin-top:12px"><b style="font-size:.95rem">${t('recap_t')}</b><div class="bars" id="bars"></div></div>`;
}
function renderRecap() {
  const map = moodMap(), now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const dim = new Date(y, mo + 1, 0).getDate(), off = (new Date(y, mo, 1).getDay() + 6) % 7;
  const keys = Object.keys(map);
  $('#s1').textContent = keys.length;
  let streak = 0, cur = new Date();
  while (map[iso(cur.getFullYear(), cur.getMonth(), cur.getDate())]) { streak++; cur.setDate(cur.getDate() - 1); }
  $('#s2').textContent = streak;
  const cnt = {}; Object.values(map).forEach(k => cnt[k] = (cnt[k] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  $('#s3').innerHTML = top ? cimo(top[0], 40) : '';
  const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  $('#calTitle').textContent = `${BLN[mo]} ${y}`;
  let h = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(d => `<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(off);
  for (let d = 1; d <= dim; d++) {
    const k = map[iso(y, mo, d)], today = d === now.getDate();
    h += `<div class="cd ${today ? 'today' : ''}" title="${k ? MOODLBL[k] : '—'}"><span>${d}</span>${k ? `<div class="mini">${cimo(k, 30)}</div>` : ''}</div>`;
  }
  $('#cal').innerHTML = h;
  const mx = Math.max(1, ...Object.values(cnt));
  $('#bars').innerHTML = MOODS.map(m => {
    const v = cnt[m.k] || 0;
    return `<div class="bar"><span style="width:96px;display:flex;align-items:center;gap:6px"><span style="width:22px;height:22px;flex:none">${cimo(m.face, 20)}</span>${m.label}</span>
      <div class="tr"><i style="width:${(v / mx) * 100}%;background:${m.c}"></i></div><b style="width:26px;text-align:right;font-size:.72rem">${v}</b></div>`;
  }).join('');
}
