/* ===== database layer =====
   Works in two modes:
   1. remote  — if a CraveMood API is reachable (server/server.js), all writes go there
   2. local   — otherwise a JSON store in localStorage (default on GitHub Pages)
   Schema is identical in both modes, see db/schema.sql
*/
const DB = (() => {
  const KEY = 'cravemood.db.v1';
  const SCHEMA = { v: 1, users: [], moods: [], orders: [], chats: [], spins: [], umkms: [], transactions: [], settings: {} };
  let state = null, remote = false, base = '', ready = false;

  const uid = () => 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  function load() {
    if (state) return state;
    try {
      const raw = localStorage.getItem(KEY);
      state = raw ? Object.assign(clone(SCHEMA), JSON.parse(raw)) : clone(SCHEMA);
    } catch (e) { state = clone(SCHEMA); }
    if (!Array.isArray(state.users)) state.users = [];
    return state;
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn('DB: quota', e); }
  }

  /* password hashing — SHA-256 when available, deterministic fallback otherwise */
  async function hash(pw, salt) {
    const txt = salt + '::' + pw + '::cravemood';
    try {
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (e) { /* insecure context */ }
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < txt.length; i++) {
      h1 ^= txt.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ txt.charCodeAt(i), 2654435761) >>> 0;
    }
    return 'fnv' + h1.toString(16) + h2.toString(16);
  }

  async function probe() {
    base = (window.CRAVEMOOD_API || '').replace(/\/$/, '');
    if (!base && location.protocol === 'file:') return false;
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 1200);
      const r = await fetch((base || '') + '/api/health', { signal: c.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j && j.ok);
    } catch (e) { return false; }
  }

  async function api(path, body, key) {
    const headers = { 'Content-Type': 'application/json' };
    if (key) headers['X-Admin-Key'] = key;
    const r = await fetch(base + path, {
      method: body ? 'POST' : 'GET',
      headers: headers,
      body: body ? JSON.stringify(body) : undefined,
      cache: 'no-store',
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  /* ---- public API ---- */
  return {
    get isRemote() { return remote; },
    get ready() { return ready; },

    async init() {
      remote = await probe();
      ready = true;
      return remote;
    },

    /* account */
    async register({ name, contact, password, lang, guest }) {
      if (remote) {
        const j = await api('/api/register', { name, contact, password, lang, guest });
        return j;
      }
      const s = load();
      const c = String(contact || '').trim().toLowerCase();
      if (!guest && s.users.some(u => (u.contact || '').toLowerCase() === c)) {
        return { ok: false, error: 'exists' };
      }
      const salt = Math.random().toString(36).slice(2, 10);
      const u = {
        id: uid(), name: String(name || '').trim().slice(0, 40),
        contact: c, lang: lang || 'id', salt,
        pw: guest ? '' : await hash(password || '', salt),
        guest: !!guest,
        created: new Date().toISOString(),
        last_seen: new Date().toISOString(),
        moods: 0, orders: 0, chats: 0, spins: 0,
        vip: false, vip_expiry: null, umkm: null,
      };
      s.users.push(u); persist();
      return { ok: true, user: pub(u) };
    },

    async login({ contact, password }) {
      if (remote) return api('/api/login', { contact, password });
      const s = load();
      const c = String(contact || '').trim().toLowerCase();
      const u = s.users.find(x => (x.contact || '').toLowerCase() === c && !x.guest);
      if (!u) return { ok: false, error: 'bad' };
      const h = await hash(password || '', u.salt);
      if (h !== u.pw) return { ok: false, error: 'bad' };
      u.last_seen = new Date().toISOString(); persist();
      return { ok: true, user: pub(u) };
    },

    async me(id) {
      if (!id) return null;
      if (remote) {
        try { const j = await api('/api/me?id=' + encodeURIComponent(id)); return j.ok ? j.user : null; }
        catch (e) { return null; }
      }
      const u = load().users.find(x => x.id === id);
      return u ? pub(u) : null;
    },

    async users(adminKey) {
      if (remote) { const j = await api('/api/users', null, adminKey); return j.users || []; }
      return load().users.map(pub);
    },

    async touch(id) {
      if (remote) return;
      const u = load().users.find(x => x.id === id);
      if (u) { u.last_seen = new Date().toISOString(); persist(); }
    },

    /* activity */
    async addMood(userId, mood, date) {
      const d = date || new Date().toISOString().slice(0, 10);
      if (remote) { try { await api('/api/mood', { userId, mood, date: d }); } catch (e) {} }
      const s = load();
      s.moods = s.moods.filter(m => !(m.user_id === userId && m.date === d));
      s.moods.push({ user_id: userId, mood, date: d, at: new Date().toISOString() });
      const u = s.users.find(x => x.id === userId); if (u) u.moods = (u.moods || 0) + 1;
      persist();
    },

    async addOrder(userId, payload) {
      if (remote) { try { await api('/api/order', Object.assign({ userId }, payload)); } catch (e) {} }
      const s = load();
      s.orders.push(Object.assign({ id: 'o_' + Date.now().toString(36), user_id: userId, at: new Date().toISOString() }, payload));
      const u = s.users.find(x => x.id === userId); if (u) u.orders = (u.orders || 0) + 1;
      persist();
    },

    async logChat(userId, role, text) {
      const s = load();
      s.chats.push({ user_id: userId, role, text: String(text).slice(0, 500), at: new Date().toISOString() });
      if (s.chats.length > 800) s.chats = s.chats.slice(-800);
      const u = s.users.find(x => x.id === userId); if (u) u.chats = (u.chats || 0) + 1;
      persist();
    },

    async logSpin(userId, item) {
      const s = load();
      s.spins.push({ user_id: userId, item, at: new Date().toISOString() });
      if (s.spins.length > 500) s.spins = s.spins.slice(-500);
      const u = s.users.find(x => x.id === userId); if (u) u.spins = (u.spins || 0) + 1;
      persist();
    },

    moodsOf(userId) {
      return load().moods.filter(m => m.user_id === userId).map(m => ({ d: m.date, m: m.mood }));
    },

    /* VIP */
    async setVip(userId, active, expiry) {
      if (remote) { try { await api('/api/vip', { userId, active, expiry }); } catch (e) {} }
      const s = load();
      const u = s.users.find(x => x.id === userId);
      if (u) { u.vip = !!active; u.vip_expiry = expiry || null; persist(); }
    },

    isVip(userId) {
      const u = load().users.find(x => x.id === userId);
      if (!u || !u.vip) return false;
      if (u.vip_expiry && new Date(u.vip_expiry) < new Date()) { u.vip = false; persist(); return false; }
      return true;
    },

    /* UMKM */
    async registerUmkm(userId, data) {
      if (remote) { const j = await api('/api/umkm', Object.assign({ userId }, data)); return j; }
      const s = load();
      const entry = Object.assign({
        id: 'umkm_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        user_id: userId, status: 'pending', created: new Date().toISOString(),
        views: 0, clicks: 0, rating: 0, menus: [],
      }, data);
      s.umkms.push(entry);
      const u = s.users.find(x => x.id === userId); if (u) u.umkm = entry.id;
      persist();
      return { ok: true, umkm: entry };
    },

    getUmkm(userId) {
      const s = load();
      const u = s.users.find(x => x.id === userId);
      if (!u || !u.umkm) return null;
      return s.umkms.find(x => x.id === u.umkm) || null;
    },

    /* transactions / payments */
    async createTransaction(userId, data) {
      if (remote) { const j = await api('/api/transaction', Object.assign({ userId }, data)); return j; }
      const s = load();
      const tx = Object.assign({
        id: 'tx_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
        user_id: userId, status: 'pending', created: new Date().toISOString(),
        paid_at: null, gateway: data.gateway || 'manual',
      }, data);
      s.transactions = s.transactions || [];
      s.transactions.push(tx);
      persist();
      return { ok: true, tx };
    },

    async updateTransaction(txId, status, meta) {
      if (remote) { const j = await api('/api/transaction/update', { txId, status, meta }); return j; }
      const s = load();
      s.transactions = s.transactions || [];
      const tx = s.transactions.find(x => x.id === txId);
      if (!tx) return { ok: false, error: 'not found' };
      tx.status = status;
      if (meta) Object.assign(tx, meta);
      if (status === 'success') tx.paid_at = new Date().toISOString();
      persist();
      return { ok: true, tx };
    },

    getTransactions(userId) {
      const s = load();
      return (s.transactions || []).filter(x => x.user_id === userId).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    },

    /* settings blob (per device) */
    getSetting(k, dflt) {
      const s = load();
      return (s.settings && s.settings[k] !== undefined) ? s.settings[k] : dflt;
    },
    setSetting(k, v) {
      const s = load();
      s.settings[k] = v; persist();
    },

    /* export */
    dump() { return clone(load()); },
    async exportJSON(adminKey) {
      let data = null;
      if (remote && adminKey) { try { data = await api('/api/export', null, adminKey); } catch (e) { data = null; } }
      if (!data) data = load();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      dl(blob, 'cravemood-database-' + new Date().toISOString().slice(0, 10) + '.json');
    },
    async exportCSV(adminKey) {
      const rows = await this.users(adminKey);
      const head = ['id', 'name', 'contact', 'lang', 'guest', 'created', 'last_seen', 'moods', 'orders', 'chats', 'spins'];
      const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const csv = [head.join(',')].concat(rows.map(r => head.map(h => esc(r[h])).join(','))).join('\r\n');
      dl(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), 'cravemood-registrants.csv');
    },
  };

  function pub(u) {
    return {
      id: u.id, name: u.name, contact: u.contact, lang: u.lang, guest: !!u.guest,
      created: u.created, last_seen: u.last_seen,
      moods: u.moods || 0, orders: u.orders || 0, chats: u.chats || 0, spins: u.spins || 0,
      vip: !!u.vip, vip_expiry: u.vip_expiry || null, umkm: u.umkm || null,
    };
  }
  function dl(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1200);
  }
})();


/* ===== Cimo voice engine =====
   Cimo speaks with ONE voice, and every word must be understandable.

   Order of preference:
     1. a real recording for this exact line  (audio/cimo/manifest.json)
     2. the most natural system voice available, at a calm human pace

   The recorded sample (audio/cimo/cimo-voice.mp3) is kept as Cimo's voice
   identity and can be mapped to lines through the manifest; a 3 second clip
   cannot pronounce new sentences on its own. */

const CIMO_CLIP = 'audio/cimo/cimo-voice.mp3';

/* the host gate also guards sub-resources, so carry the share code along */
function assetUrl(path) {
  try {
    const sc = new URLSearchParams(location.search).get('sharecode');
    if (!sc) return path;
    return path + (path.indexOf('?') > -1 ? '&' : '?') + 'sharecode=' + encodeURIComponent(sc);
  } catch (e) { return path; }
}

/* calm base pace: noticeably slower than the browser default so nothing
   gets swallowed, then nudged per mood */
const BASE_RATE = 0.90;
const MOODTONE = {
  senang: { r: 1.06, p: 1.10, gap: 150 },
  sedih:  { r: 0.94, p: 0.94, gap: 260 },
  marah:  { r: 1.00, p: 0.92, gap: 180 },
  bingung: { r: 0.97, p: 1.04, gap: 210 },
  capek:  { r: 0.92, p: 0.92, gap: 280 },
  kecewa: { r: 0.94, p: 0.90, gap: 270 },
  def:    { r: 1.00, p: 1.00, gap: 190 },
};

const Voice = (() => {
  const synth = window.speechSynthesis || null;
  const LOCALE = { id: 'id-ID', en: 'en-US', zh: 'zh-CN', hi: 'hi-IN' };
  let voices = [], enabled = true, volume = 1, speaking = false, token = 0, currentAudio = null;
  const S = { lang: 'id', name: '' };

  /* ---- reference voice profile -------------------------------------
     the owner's recording is analysed once (median pitch + syllable rate)
     so the spoken voice sits in the same register and tempo as the clip */
  const REF = { pitch: 1, rate: 1, f0: 0, syl: 0, ready: false };
  let refLoading = null;
  /* the analysis is cheap but not instant — remember it after the first run */
  const REF_KEY = 'cm_voice_ref_v1';
  try {
    const c = JSON.parse(localStorage.getItem(REF_KEY) || 'null');
    if (c && c.f0) { REF.pitch = c.pitch; REF.rate = c.rate; REF.f0 = c.f0; REF.syl = c.syl; REF.ready = true; }
  } catch (e) {}

  function analyse(buffer) {
    try {
      const sr = buffer.sampleRate;
      const raw = buffer.getChannelData(0);
      const step = Math.max(1, Math.floor(sr / 8000));
      const n = Math.floor(raw.length / step);
      const x = new Float32Array(n);
      for (let i = 0; i < n; i++) x[i] = raw[i * step];
      const asr = sr / step;
      const frame = Math.floor(asr * 0.04);
      const hop = Math.floor(asr * 0.02);
      const minLag = Math.floor(asr / 400), maxLag = Math.floor(asr / 70);
      const f0s = [];
      let peaks = 0, prevLoud = false;
      for (let s = 0; s + frame < n; s += hop) {
        let e = 0;
        for (let i = 0; i < frame; i++) { const v = x[s + i]; e += v * v; }
        const rms = Math.sqrt(e / frame);
        if (rms > 0.02) {
          let best = 0, bestLag = 0;
          for (let lag = minLag; lag <= maxLag; lag++) {
            let sum = 0;
            for (let i = 0; i < frame - lag; i++) sum += x[s + i] * x[s + i + lag];
            if (sum > best) { best = sum; bestLag = lag; }
          }
          if (bestLag) { const hz = asr / bestLag; if (hz > 70 && hz < 400) f0s.push(hz); }
        }
        const loud = rms > 0.05;
        if (loud && !prevLoud) peaks++;
        prevLoud = loud;
      }
      f0s.sort((a, b) => a - b);
      const f0 = f0s.length ? f0s[Math.floor(f0s.length / 2)] : 0;
      const dur = buffer.duration || 1;
      return { f0, syl: peaks / dur };
    } catch (e) { return { f0: 0, syl: 0 }; }
  }

  function loadRef() {
    if (refLoading) return refLoading;
    refLoading = (async () => {
      try {
        const res = await fetch(assetUrl(CIMO_CLIP), { cache: 'force-cache' });
        if (!res.ok) return;
        const ab = await res.arrayBuffer();
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return;
        const c = new C();
        const buf = await c.decodeAudioData(ab);
        const r = analyse(buf);
        if (r.f0) REF.pitch = Math.max(0.95, Math.min(1.28, r.f0 / 205));
        if (r.syl) REF.rate = Math.max(0.92, Math.min(1.08, r.syl / 4.2));
        REF.f0 = Math.round(r.f0); REF.syl = +r.syl.toFixed(2); REF.ready = true;
        try { localStorage.setItem(REF_KEY, JSON.stringify({ pitch: REF.pitch, rate: REF.rate, f0: REF.f0, syl: REF.syl })); } catch (e) {}
        try { c.close(); } catch (e) {}
      } catch (e) {}
    })();
    return refLoading;
  }
  loadRef();

  function loadVoices() {
    if (!synth) return;
    try { voices = synth.getVoices() || []; } catch (e) { voices = []; }
  }
  if (synth) {
    loadVoices();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);
    synth.onvoiceschanged = loadVoices;
    setTimeout(loadVoices, 400);
    setTimeout(loadVoices, 1500);
  }

  const HUMAN = /natural|neural|online|premium|enhanced|siri|expressive/i;
  const NICE = /gadis|andika|ardi|damayanti|siti|swara|dewi|indah|xiaoxiao|aria|jenny|kalpana|heera|zira|samantha/i;

  function score(v, lang) {
    const want = (LOCALE[lang] || 'id-ID').toLowerCase();
    const pre = want.split('-')[0];
    const n = (v.name || '').toLowerCase();
    const l = (v.lang || '').toLowerCase().replace('_', '-');
    let s = 0;
    if (l === want) s += 60; else if (l.startsWith(pre)) s += 35; else return -1;
    if (HUMAN.test(n)) s += 40;
    if (NICE.test(n)) s += 18;
    if (/google/.test(n)) s += 12;
    if (/microsoft/.test(n)) s += 6;
    if (/female|wanita|perempuan/.test(n)) s += 6;
    if (v.localService) s += 3;
    return s;
  }

  function pickVoice(lang) {
    let best = null, bs = -1;
    for (const v of voices) {
      const s = score(v, lang || S.lang);
      if (s > bs) { bs = s; best = v; }
    }
    return best;
  }

  /* optional exact recordings: { "normalised text": "file.mp3" } */
  let pack = null;
  /* the ElevenLabs voice pack (generated by tools/gen-voice.mjs) */
  let lines = null;
  function packKey(t) {
    return String(t).toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
  }
  /* the recordings never contain the user's name — look the line up without it
     (mirrors the same cleanup in tools/gen-chat.mjs) */
  function stripName(t) {
    if (!S.name) return t;
    const n = String(S.name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let s = String(t);
    if (new RegExp('^\\s*' + n, 'i').test(s)) {
      s = s.replace(new RegExp('^\\s*' + n + '\\s*[!,.?]?\\s*', 'i'), '');
    } else {
      s = s.replace(new RegExp(n + '\\s*!', 'gi'), '!')
           .replace(new RegExp(',\\s*' + n, 'gi'), '')
           .replace(new RegExp(n + ',\\s*', 'gi'), '')
           .replace(new RegExp(n, 'gi'), 'kamu');
    }
    return s.replace(/\s+([!?.,])/g, '$1').replace(/\s+/g, ' ').trim();
  }
  function lookup(text) {
    if (!pack) return null;
    return pack[packKey(text)] || (S.name ? pack[packKey(stripName(text))] : null) || null;
  }
  let packDone = null;
  function loadPack() {
    if (packDone) return packDone;
    if (!(typeof fetch === 'function' && /^https?:$/.test(location.protocol))) { packDone = Promise.resolve(); return packDone; }
    packDone = fetch(assetUrl('audio/cimo/manifest.json'), { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (j && typeof j === 'object') pack = j; })
      .catch(() => {});
    return packDone;
  }
  loadPack();
  if (typeof fetch === 'function' && /^https?:$/.test(location.protocol)) {
    fetch(assetUrl('audio/cimo/lines.json'), { cache: 'no-cache' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => { if (j && j.moods) lines = j; })
      .catch(() => {});
  }

  /* a touch brighter/faster than the raw render = cuter, more cheerful */
  const CIMO_RATE = 1;

  function playFile(path, rate) {
    return new Promise(resolve => {
      let done = false;
      const fin = v => { if (!done) { done = true; resolve(v); } };
      try {
        const a = new Audio(assetUrl(path));
        currentAudio = a;
        a.volume = Math.max(0, Math.min(1, volume));
        const rt = rate || 1;
        if (rt !== 1) {
          a.playbackRate = rt;
          try { a.preservesPitch = false; } catch (e) {}
          try { a.webkitPreservesPitch = false; } catch (e) {}
        }
        a.onended = () => { if (currentAudio === a) currentAudio = null; fin(true); };
        a.onerror = () => fin(false);
        /* never let a stuck player block the next segment */
        a.onloadedmetadata = () => {
          const d = isFinite(a.duration) ? a.duration : 3;
          setTimeout(() => fin(true), (d / rt) * 1000 + 700);
        };
        a.play().then(() => { speaking = true; }).catch(() => fin(false));
        setTimeout(() => fin(true), 20000);
      } catch (e) { fin(false); }
    });
  }
  function playClip(file) { return playFile('audio/cimo/' + file, CIMO_RATE); }

  /* split into short, speakable phrases — short phrases are easier to follow */
  function chunks(text) {
    return String(text)
      .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, '')
      .replace(/\s+/g, ' ')
      .split(/(?<=[.!?。！？…])\s+|(?<=[,;，、])\s+/)
      .map(s => s.trim())
      .filter(Boolean)
      .reduce((acc, s) => {
        const last = acc[acc.length - 1];
        if (last && last.length + s.length < 72) acc[acc.length - 1] = last + ' ' + s;
        else acc.push(s);
        return acc;
      }, []);
  }

  function stop() {
    token++;
    if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
    if (synth) { try { synth.cancel(); } catch (e) {} }
    speaking = false;
  }

  async function speak(text, opts) {
    opts = opts || {};
    if (!enabled) return Promise.resolve();
    text = String(text || '').trim();
    if (!text) return Promise.resolve();

    if (!pack) await loadPack();
    const clip = lookup(text);
    if (clip) return playClip(clip);

    if (!synth) return Promise.resolve();

    stop();
    const my = token;
    const list = chunks(text);
    if (!list.length) return Promise.resolve();

    const v = pickVoice(opts.lang || S.lang);
    const tone = MOODTONE[opts.mood] || MOODTONE.def;
    const baseRate = BASE_RATE * tone.r * REF.rate * (opts.rate || 1);
    const basePitch = tone.p * REF.pitch * (opts.pitch || 1);
    speaking = true;

    return new Promise(resolve => {
      let i = 0;
      const done = () => { if (my === token) speaking = false; resolve(); };
      const next = () => {
        if (my !== token) return done();
        if (i >= list.length) return done();
        const seg = list[i++];
        const u = new SpeechSynthesisUtterance(seg);
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = LOCALE[opts.lang || S.lang] || 'id-ID';

        const isQ = /[?？]$/.test(seg);
        const isComma = /[,;，、]$/.test(seg);
        /* tiny variation keeps it from sounding flat, without speeding it up */
        u.rate = Math.max(0.55, Math.min(1.15, baseRate + (Math.random() * 0.04 - 0.02)));
        u.pitch = Math.max(0, Math.min(2, basePitch + (isQ ? 0.06 : 0) + (Math.random() * 0.04 - 0.02)));
        u.volume = Math.max(0, Math.min(1, volume));

        const pause = i >= list.length ? 0 : (isComma ? Math.round(tone.gap * 0.6) : tone.gap);
        u.onend = () => setTimeout(next, pause);
        u.onerror = () => done();
        try { synth.speak(u); } catch (e) { done(); }
      };
      next();
      /* safety net: some engines never fire onend */
      const guard = setInterval(() => {
        if (my !== token) { clearInterval(guard); return; }
        if (!synth.speaking && !synth.pending) { clearInterval(guard); done(); }
      }, 900);
    });
  }

  return {
    get supported() { return !!synth; },
    get hasPack() { return !!(lines && lines.moods); },
    /* the mood greeting, spoken with the real recorded voice when the pack exists */
    async speakMood(mood, dishId, fallbackText) {
      if (!enabled) return;
      if (lines && lines.moods && lines.moods[mood]) {
        const mm = lines.moods[mood];
        const segs = [];
        if (mm.pre) segs.push(mm.pre);
        if (dishId && lines.dishes && lines.dishes[dishId]) segs.push(lines.dishes[dishId]);
        if (mm.post) segs.push(mm.post);
        if (segs.length) {
          stop();
          const my = token;
          speaking = true;
          for (const s of segs) {
            if (my !== token || !enabled) break;
            await playClip(s);
          }
          if (my === token) speaking = false;
          return;
        }
      }
      return speak(fallbackText || '', { mood });
    },
    /* a canned line (greet / preview / added / saved) with the recorded voice */
    async speakFixed(key, fallbackText, opts) {
      if (!enabled) return;
      const f = lines && lines.fixed && lines.fixed[key];
      if (f) {
        stop();
        const my = token;
        speaking = true;
        await playClip(f);
        if (my === token) speaking = false;
        return;
      }
      return speak(fallbackText || '', opts);
    },
    get ready() { return !!synth && voices.length > 0; },
    get speaking() { return speaking; },
    get enabled() { return enabled; },
    set enabled(v) { enabled = !!v; if (!v) stop(); },
    get volume() { return volume; },
    set volume(v) { volume = Math.max(0, Math.min(1, v)); },
    get settings() { return { enabled, volume, lang: S.lang, name: S.name, ref: REF }; },
    set(k, v) { if (k === 'volume') volume = v; else if (k === 'enabled') enabled = !!v; else if (k === 'lang') S.lang = v; else if (k === 'name') S.name = v || ''; },
    setAll(o) { if (!o) return; if ('volume' in o) volume = o.volume; if ('enabled' in o) enabled = o.enabled; if ('lang' in o && o.lang) S.lang = o.lang; if ('name' in o) S.name = o.name || ''; },
    stop, speak,
    _lookup(t) { return lookup(t); },
    playOriginal() { return playFile(CIMO_CLIP); },
    preview() {
      return this.speakFixed('preview', 'Hai, aku Cimo. Kalau kamu lagi capek, cerita aja. Aku dengerin sampai selesai.', { mood: 'def' });
    },
  };
})();

/* ===== synthesized UI sounds (no assets needed) ===== */
const SFX = (() => {
  let ctx = null, on = true, tickToken = 0;
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ctx = new C();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, gain, slideTo) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain || 0.16, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  const lib = {
    add() { tone(660, .09, 'triangle', .16, 1180); setTimeout(() => tone(1320, .07, 'sine', .09), 55); },
    remove() { tone(420, .1, 'triangle', .13, 260); },
    tap() { tone(880, .045, 'sine', .07); },
    pop() { tone(520, .07, 'sine', .12, 900); },
    success() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .16, 'sine', .11), i * 80)); },
    tick() { tone(1400, .03, 'square', .05); },
    error() { tone(240, .18, 'sawtooth', .09, 160); },
    spin() { for (let i = 0; i < 8; i++) setTimeout(() => tone(900 - i * 60, .04, 'square', .04), i * 55); },
  };
  return {
    get enabled() { return on; },
    set enabled(v) { on = !!v; },
    init() { ac(); },
    play(name) { if (!on) return; try { (lib[name] || lib.tap)(); } catch (e) {} },
    /* ticks that slow down with the wheel — feels like it is really spinning */
    spinTicks(dur) {
      if (!on) return;
      const token = ++tickToken;
      const total = dur || 3800;
      const t0 = performance.now();
      const step = () => {
        if (token !== tickToken) return;
        const p = Math.min(1, (performance.now() - t0) / total);
        if (p >= 1) return;
        tone(1500 - p * 780, 0.028, 'square', Math.max(0.018, 0.055 - p * 0.03));
        setTimeout(step, 42 + 300 * Math.pow(p, 2.4));
      };
      step();
    },
    stopTicks() { tickToken++; },
  };
})();

    fallback: ['समझ नहीं आया। एक बात और कहोगे?', 'मैं सच में समझना चाहता हूँ। कौन सी बात सबसे ज़रूरी है?'],

const REFLECT = {
  id: ['Kedengeran berat ya.', 'Aku nangkep kok.', 'Hmm, itu nggak enak.', 'Oke, aku ngerti arahnya.', 'Wajar kalau kamu ngerasa gitu.'],
  en: ['That sounds heavy.', 'I hear you.', 'Hmm, that is rough.', 'Okay, I follow.', 'It makes sense you feel that way.'],

const CHIPS = {
  id: [['Lagi capek banget','tired'],['Aku lagi sedih','sad'],['Mau makan apa ya?','food_ask'],['Aku butuh teman cerita','lonely']],
  en: [['I am so tired','tired'],['I feel sad','sad'],['What should I eat?','food_ask'],['I need to talk','lonely']],
  zh: [['我好累','tired'],['我有点难过','sad'],['我该吃什么？','food_ask'],['我想找人聊聊','lonely']],
  hi: [['मैं थक गया हूँ','tired'],['मन उदास है','sad'],['क्या खाऊँ?','food_ask'],['किसी से बात करनी है','lonely']],
};

const ChatEngine = (() => {
  const S = {
    name: '', lang: 'id', mood: 'def', turn: 0,
    topics: [], lastTopic: null, lastIntent: null, pending: null,
    sentiment: 0, trend: [], foods: [], askedName: false, used: {},
  };
  const HISTORY = [];

  function normalize(t) {
    let s = String(t || '').toLowerCase().trim();
    s = s.replace(/[^\p{L}\p{N}\s'?！？。，、]/gu, ' ');
    s = s.replace(/\s+/g, ' ');
    const words = s.split(' ');
    const mapped = words.map(w => SLANG[w] || w);
    return { raw: s, norm: mapped.join(' '), words: mapped };
  }

  function detectLang(text) {
    if (/[\u4e00-\u9fff]/.test(text)) return 'zh';
    if (/[\u0900-\u097f]/.test(text)) return 'hi';
    const en = /\b(the|you|i|am|are|is|what|why|how|feel|today|tired|sad|want|eat|love|work|because|really|thanks|hello)\b/i;
    if (en.test(text) && !/\b(aku|kamu|saya|lagi|makan|gimana|banget)\b/i.test(text)) return 'en';
    return S.lang;
  }

  function sentiment(norm, words) {
    let score = 0, hits = 0;
    words.forEach((w, i) => {
      let v = 0;
      if (POS.indexOf(w) > -1) v = 1;
      else if (NEG.indexOf(w) > -1) v = -1;
      if (!v) return;
      const prev = words.slice(Math.max(0, i - 2), i).join(' ');
      if (NEGATORS.some(n => prev.indexOf(n) > -1)) v *= -0.85;
      score += v; hits++;
    });
    // intensifiers
    if (/banget|sangat|parah|amat|really|very|so much|bgt|extremely|太|非常|बहुत/.test(norm)) score *= 1.35;
    return hits ? Math.max(-3, Math.min(3, score / Math.sqrt(hits) * 1.4)) : 0;
  }

  function emotionOf(norm, sc) {
    if (/marah|kesal|kesel|bete|emosi|benci|angry|mad|hate|गुस्सा|生气/.test(norm)) return 'marah';
    if (/capek|lelah|letih|ngantuk|exhaust|tired|burnout|थका|累/.test(norm)) return 'capek';
    if (/cemas|takut|khawatir|overthink|panik|anxious|worried|scared|焦虑|चिंता/.test(norm)) return 'bingung';
    if (/kecewa|hampa|kosong|numb|hopeless|empty|putus asa|失望|निराश/.test(norm)) return 'kecewa';
    if (/sedih|nangis|menangis|sepi|kesepian|lonely|sad|cry|broken|难过|उदास/.test(norm)) return 'sedih';
    if (sc > 0.9) return 'senang';
    if (sc < -0.9) return 'sedih';
    return S.mood === 'def' ? 'def' : S.mood;
  }

  function topicsOf(norm) {
    const out = [];
    for (const k in TOPICS) {
      if (TOPICS[k].some(w => norm.indexOf(w) > -1)) out.push(k);
    }
    return out;
  }

  function scoreIntent(norm, raw) {
    let best = { id: 'fallback', s: 0 };
    for (const it of INTENTS) {
      let s = 0;
      for (const kw of it.k) {
        if (norm.indexOf(kw) > -1 || raw.indexOf(kw) > -1) {
          s += kw.length > 5 ? 2.2 : (kw.length > 3 ? 1.7 : 1.2);
          if (kw.indexOf(' ') > -1) s += 0.8;
        }
      }
      if (s > best.s) best = { id: it.id, s };
    }
    return best;
  }

  function pick(arr) {
    if (!arr || !arr.length) return null;
    const key = arr.join('|').slice(0, 40);
    S.used[key] = (S.used[key] || 0) + 1;
    const i = (S.used[key] - 1) % arr.length;
    return arr[i];
  }

  function bank(lang, intent) {
    const b = BANK[lang] || BANK.id;
    return b[intent] || (BANK.id[intent] || BANK.id.fallback);
  }

  function fill(t) {
    return String(t)
      .replace(/\{name\}/g, S.name || (S.lang === 'en' ? 'you' : 'kamu'))
      .replace(/\{topic\}/g, topicWord(S.lastTopic))
      .replace(/\{food\}/g, S.foods[0] || '');
  }
  const TOPICWORD = {
    id:{kerja:'kerjaan',kuliah:'kuliah',cinta:'urusan hati',keluarga:'keluarga',uang:'uang',teman:'pertemanan',badan:'badan',diri:'diri sendiri'},
    en:{kerja:'work',kuliah:'school',cinta:'love',keluarga:'family',uang:'money',teman:'friendship',badan:'health',diri:'yourself'},
    zh:{kerja:'工作',kuliah:'学业',cinta:'感情',keluarga:'家人',uang:'钱',teman:'朋友',badan:'身体',diri:'自己'},
    hi:{kerja:'काम',kuliah:'पढ़ाई',cinta:'रिश्ते',keluarga:'परिवार',uang:'पैसा',teman:'दोस्ती',badan:'सेहत',diri:'खुद'},
  };
  function topicWord(t) { return ((TOPICWORD[S.lang] || TOPICWORD.id)[t]) || (S.lang === 'en' ? 'that' : 'itu'); }

  function foodSuggest() {
    const m = S.mood === 'def' ? (S.sentiment < 0 ? 'sedih' : 'bingung') : S.mood;
    const list = MENU.filter(x => x.moods.indexOf(m) > -1);
    return list.length ? list[Math.floor(Math.random() * list.length)] : MENU[0];
  }

  /* --- optional LLM upgrade --- */
  async function llm(text) {
    const langName = { id:'Indonesian', en:'English', zh:'Simplified Chinese', hi:'Hindi' }[S.lang] || 'Indonesian';
    const sys = `You are Cimo, a warm best friend inside CraveMood (a Makassar food app). Reply ONLY in ${langName}.
Be human: 2-4 short sentences, casual, specific, never preachy. Reflect what the user feels before advising.
Remember the conversation: reference earlier details naturally. Ask at most one gentle question at the end.
Never say you are an AI. Never list bullet points. User name: ${S.name || 'unknown'}. Current mood: ${S.mood}.
If they mention food, you may suggest Makassar dishes (coto, konro, pallubasa, es pisang ijo, pisang epe, jalangkote, mie titi).`;
    const msgs = [{ role: 'system', content: sys }].concat(HISTORY.slice(-14));

    /* 1) server proxy, the API key stays on the server, never in the browser */
    if (location.protocol !== 'file:') {
      try {
        const c1 = new AbortController();
        const t1 = setTimeout(() => c1.abort(), 16000);
        const r1 = await fetch('api/ai', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: msgs }), signal: c1.signal,
        });
        clearTimeout(t1);
        if (r1.ok) { const j1 = await r1.json(); if (j1.ok && j1.text) return j1.text; }
      } catch (e) { /* fall through */ }
    }

    /* 2) local key, only for the developer machine or a static deploy */
    const cfg = DB.getSetting('ai', {}) || {};
    if (!cfg.key) return null;
    const base = (cfg.base || 'https://api.openai.com/v1').replace(/\/$/, '');
    try {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), 16000);
      const r = await fetch(base + '/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
        body: JSON.stringify({ model: cfg.model || 'gpt-4o-mini', messages: msgs, temperature: 0.85, max_tokens: 240 }),
        signal: c.signal,
      });
      clearTimeout(t);
      if (!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      const out = j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
      return out ? out.trim() : null;
    } catch (e) { return null; }
  }

  async function reply(text) {
    const { raw, norm, words } = normalize(text);
    const lang = detectLang(String(text || ''));
    if (lang !== S.lang) { S.lang = lang; }
    S.turn++;

    const sc = sentiment(norm, words);
    S.sentiment = sc;
    S.trend.push(sc);
    if (S.trend.length > 8) S.trend.shift();

    const emo = emotionOf(norm, sc);
    const tp = topicsOf(norm);
    if (tp.length) {
      tp.forEach(t => { if (S.topics.indexOf(t) === -1) S.topics.push(t); });
      S.lastTopic = tp[0];
    }

    let { id: intent, s: score } = scoreIntent(norm, raw);

    // short answers continue the previous thread instead of resetting it
    const short = words.length <= 4;
    if (score < 1.6 && short && S.pending) {
      if (/^(iya|ya|yes|yup|betul|bener|hmm|oke|ok|he eh|heeh)$/.test(norm)) intent = 'more';
      else if (/^(tidak|nggak|gak|no|belum|bukan|engga)$/.test(norm)) intent = 'more';
    }
    if (score < 1.6 && /[?？]/.test(String(text)) && S.lastIntent) intent = 'why';
    if (score < 1.6 && tp.length && sc < -0.4) intent = topicIntent(tp[0]);

    // never greet twice in a row
    if (intent === 'greet' && (S.lastIntent === 'greet' || S.turn > 2)) intent = 'ask_how';

    S.mood = emo;

    // LLM path
    HISTORY.push({ role: 'user', content: String(text).slice(0, 400) });
    const ai = await llm(text);
    if (ai) {
      HISTORY.push({ role: 'assistant', content: ai });
      S.lastIntent = intent; S.pending = true;
      return { text: ai, mood: emo, chips: chipsFor(intent), source: 'ai' };
    }

    // local path
    let core = fill(pick(bank(S.lang, intent)) || pick(BANK.id.fallback));
    if (intent === 'fallback' && tp.length) core = fill(pick(bank(S.lang, topicIntent(tp[0]))));
    if (intent === 'who_am_i' && !S.lastTopic) core = fill(pick(bank(S.lang, 'who_am_i'))).replace(/\{topic\}/g, topicWord('kerja'));

    // reflection prefix, only when the user shares something emotional
    let pre = '';
    if (sc <= -0.8 && intent !== 'thanks' && intent !== 'bye' && intent !== 'greet' && Math.random() < 0.62) {
      pre = pick(REFLECT[S.lang] || REFLECT.id) + ' ';
    }
    // thread callback
    let call = '';
    if (S.turn > 3 && S.topics.length && sc < -0.3 && Math.random() < 0.3) {
      call = {
        id: `Tadi kamu juga cerita soal ${topicWord(S.topics[S.topics.length - 1])}. `,
        en: `You mentioned ${topicWord(S.topics[S.topics.length - 1])} earlier too. `,
        zh: `你刚才也提到${topicWord(S.topics[S.topics.length - 1])}。`,
        hi: `तुमने पहले भी ${topicWord(S.topics[S.topics.length - 1])} के बारे में बताया था। `,
      }[S.lang] || '';
    }

    let out = pre + call + core;

    // after a few emotional turns, offer food as a bridge into the app
    if (S.turn >= 3 && sc < -0.5 && !S.foods.length && Math.random() < 0.42) {
      const f = foodSuggest();
      S.foods.push(f.name);
      const tail = {
        id: ` Kalau kamu mau, aku bisa temenin cari yang anget, ${f.name} misalnya. Mau?`,
        en: ` If you want, I can help you find something warm, ${f.name}, maybe. Want that?`,
        zh: ` 如果你愿意，我可以帮你找点热的，比如${f.name}。要吗？`,
        hi: ` चाहो तो कुछ गरम ढूँढ लें, जैसे ${f.name}। चलेगा?`,
      }[S.lang];
      out += tail;
    }

    HISTORY.push({ role: 'assistant', content: out });
    if (HISTORY.length > 40) HISTORY.splice(0, HISTORY.length - 40);

    S.lastIntent = intent;
    S.pending = ['tired','sad','angry','anxious','lonely','love','work','school','money','family','friend','health','stressed','fail','empty','selfdoubt','more','why','advice'].indexOf(intent) > -1;

    return { text: out, speak: core, mood: emo, chips: chipsFor(intent), source: 'local', intent: intent };
  }

  function topicIntent(t) {
    return ({ kerja:'work', kuliah:'school', cinta:'love', keluarga:'family', uang:'money', teman:'friend', badan:'health', diri:'selfdoubt' })[t] || 'sad';
  }

  function chipsFor(intent) {
    const base = CHIPS[S.lang] || CHIPS.id;
    const extra = {
      id: {
        tired: ['Iya, capek pikiran','Capek badan','Aku mau istirahat'],
        sad: ['Aku mau cerita','Aku cuma butuh didengar','Aku nggak tahu kenapa'],
        food_ask: ['Yang anget','Yang pedes','Yang murah'],
        love: ['Kita putus','Aku masih sayang','Aku bingung'],
        work: ['Bos-ku nyebelin','Aku mau resign','Lembur terus'],
      },
      en: {
        tired: ['Mental tired','Body tired','I want to rest'],
        sad: ['I want to talk','Just listen please','I do not know why'],
        food_ask: ['Something warm','Something spicy','Something cheap'],
        love: ['We broke up','I still love them','I am confused'],
        work: ['My boss is awful','I want to quit','Always overtime'],
      },
    }[S.lang];
    const list = (extra && extra[intent]) || base;
    return list.slice(0, 3);
  }

  return {
    get state() { return S; },
    setLang(l) { S.lang = l; },
    setName(n) { S.name = n; S.askedName = true; },
    setMood(m) { S.mood = m; },
    reset() { S.turn = 0; S.topics = []; S.lastTopic = null; S.lastIntent = null; S.pending = null; S.sentiment = 0; S.trend = []; S.foods = []; HISTORY.length = 0; },
    greet(name) {
      S.name = name || S.name;
      const t = {
        id: `Hai ${S.name || 'kamu'}! Aku Cimo. Di sini kamu bisa cerita apa aja, nggak harus rapi, nggak harus positif. Mau mulai dari mana?`,
        en: `Hey ${S.name || 'you'}! I am Cimo. You can tell me anything here, no need to be tidy, no need to be positive. Where do you want to start?`,
        zh: `嗨 ${S.name || '你'}！我是 Cimo。这里想说什么都可以，不用讲得整齐，也不用假装开心。想从哪里开始？`,
        hi: `नमस्ते ${S.name || 'तुम'}! मैं Cimo हूँ। यहाँ कुछ भी कह सकते हो, सलीके से कहने की ज़रूरत नहीं। कहाँ से शुरू करें?`,
      }[S.lang];
      HISTORY.push({ role: 'assistant', content: t });
      return t;
    },
    reply,
    chips: () => CHIPS[S.lang] || CHIPS.id,
    quickChipsFor: chipsFor,
    foodSuggest,
  };
})();

/* ---------- distance ---------- */
function distKm(a, b) {
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return Math.max(0.6, 2 * R * Math.asin(Math.sqrt(h)) * 1.25);
}
function streetOf(i) { return STREETS[i] || STREETS[0]; }
function curStreet() { return STREETS.find(s => s.id === App.street) || STREETS[0]; }
function distOf(item) { return +(distKm(curStreet(), streetOf(item.st)) + jitter(item.id)).toFixed(1); }
function minsOf(item) { return Math.max(8, Math.round(distOf(item) * 3.6)); }
function jitter(id) { let h = 7; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return (h % 16) / 10; }

function hex2rgb(h) {
  h = String(h).replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function mixHex(base, color, t) {
  const A = hex2rgb(base), B = hex2rgb(color);
  const c = i => Math.round(A[i] * (1 - t) + B[i] * t);
  return '#' + [c(0), c(1), c(2)].map(x => x.toString(16).padStart(2, '0')).join('');
}
function applyMoodBg() {

  const c = (picked && m) ? m.c : '#ff9ec5';
  const A = mixHex('#ffffff', c, picked ? 0.40 : 0.26);
  const B = mixHex('#ffffff', c, picked ? 0.24 : 0.16);
  const C = mixHex('#fff2ea', c, picked ? 0.11 : 0.07);
  const D = mixHex('#fff6ef', c, picked ? 0.04 : 0.02);
  root.style.setProperty('--bgA', A);
  root.style.setProperty('--bgB', B);
  root.style.setProperty('--bgC', C);
  root.style.setProperty('--bgD', D);
  root.style.setProperty('--moodc', c);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', A);
}

/* ---------- cart ---------- */
function cartCount() { return Object.values(App.cart).reduce((a, b) => a + b, 0); }
function cartTotals() {
  let c = 0, lo = 0, hi = 0;
  for (const id in App.cart) {
    const it = MENU.find(m => m.id === id); if (!it) continue;
    const q = App.cart[id];
    c += q; lo += q * it.lo; hi += q * it.hi;
  }
  return { c, lo, hi };
}
function addToCart(id, silent) {
  App.cart[id] = (App.cart[id] || 0) + 1;
  saveCart(); SFX.play('add');
  const it = MENU.find(m => m.id === id);
  if (!silent) toast((it ? it.name : '') + ' ' + t('add_ok'));
  updateCartBar();
  if (currentView === 'home') renderRecs();
  else if (currentView === 'cart') renderCart();
  else if (currentView === 'spin') { const b = $('#spinResult'); if (b && App.lastSpin) renderSpinResult(App.lastSpin); }
}
function decCart(id) {
  if (!App.cart[id]) return;
  App.cart[id]--; SFX.play('remove');
  if (App.cart[id] <= 0) delete App.cart[id];
  saveCart(); updateCartBar();
  if (currentView === 'home') renderRecs();
  else if (currentView === 'cart') renderCart();
  else if (currentView === 'spin') { const b = $('#spinResult'); if (b && App.lastSpin) renderSpinResult(App.lastSpin); }
}
function updateCartBar() {
  const { c, lo, hi } = cartTotals();
  const bar = $('#cartbar');
  const hide = currentView === 'cart' || currentView === 'chat';
  bar.classList.toggle('on', c > 0 && !hide);
  $('#cbt').textContent = `🛒 ${c} ${t('item')} · ±${rp(lo)} – ${rp(hi)}`;
  const b = $('#navbadge'); if (b) { b.textContent = c; b.style.display = c ? 'grid' : 'none'; }
  const tb = $('#tabbadge'); if (tb) { tb.textContent = c; tb.style.display = c ? 'grid' : 'none'; }
  const mb = $('#topbadge'); if (mb) { mb.textContent = c; mb.style.display = c ? 'grid' : 'none'; }
}

/* "Putar acak" — a real spinning-wheel popup */
let popItems = [], popRot = 0, popSpinning = false;

function openSpinPop() {
  const m = $('#spinModal');
  if (!m) return;
  popRot = 0;
  m.classList.add('on');
  renderSpinPop();
}

function renderSpinPop() {
  popItems = wheelItems();
  if (!popItems.length) popItems = recList();
  const n = popItems.length, seg = 360 / n;
  const cols = ['#ffd9e6', '#ffe9c9', '#d9f0e3', '#dbe9fb', '#eee0fb', '#ffe3d4', '#f4f7c9', '#e2f4f8'];
  const grad = popItems.map((_, i) => `${cols[i % cols.length]} ${i * seg}deg ${(i + 1) * seg}deg`).join(',');
  $('#spinPopBody').innerHTML = `
    <p class="hint" style="text-align:center;margin-bottom:12px">${t('spin_pop_sub')}</p>
    <div class="popwheelbox">
      <svg class="pointer" width="28" height="34" viewBox="0 0 34 40"><path d="M17 38L4 10a14 14 0 0 1 26 0z" fill="#ff5f98" stroke="#fff" stroke-width="3"/></svg>
      <div class="wheel popwheel" id="popWheel" style="background:conic-gradient(${grad})">
        ${popItems.map((m, i) => {
          const ang = i * seg + seg / 2, rad = (ang - 90) * Math.PI / 180, R = 30;
          const px = 50 + R * Math.cos(rad), py = 50 + R * Math.sin(rad);
          return `<div class="seg"><span style="left:${px.toFixed(2)}%;top:${py.toFixed(2)}%">${foodEmoji(m, i)}</span></div>`;
        }).join('')}
        <div class="hub">${cimo(App.mood, 42)}</div>
      </div>
    </div>
    <div id="popResult"></div>
    <button class="btn block" id="popSpinBtn" style="margin-top:14px">${icon('wheel')} ${t('spin_pop_btn')}</button>`;
  $('#popSpinBtn').onclick = spinPopGo;
}

function spinPopGo() {
  if (popSpinning) return;
  const wheel = $('#popWheel'); if (!wheel) return;
  const n = popItems.length, seg = 360 / n;
  const idx = Math.floor(Math.random() * n);
  const center = idx * seg + seg / 2;
  const jitter = (Math.random() - 0.5) * (seg * 0.5);
  const turns = 5 + Math.floor(Math.random() * 3);
  popRot += turns * 360 + (360 - center) + jitter;
  popSpinning = true;
  const btn = $('#popSpinBtn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  const res = $('#popResult'); if (res) res.innerHTML = '';
  SFX.play('spin');
  SFX.spinTicks(3800);
  wheel.style.transition = 'transform 3.8s cubic-bezier(.12,.72,.06,1)';
  wheel.style.transform = `rotate(${popRot}deg)`;
  setTimeout(() => {
    popSpinning = false;
    const pick = popItems[idx];
    App.lastSpin = pick;
    SFX.play('success');
    const q = App.cart[pick.id] || 0;
    if (res) res.innerHTML = `<div class="shuffleres" style="margin:12px 0 0">

    if (btn) { btn.disabled = false; btn.innerHTML = `${icon('wheel')} ${t('spin_pop_again')}`; }

  }, 3900);

          ${items.map((m, i) => {
            const ang = i * seg + seg / 2, rad = (ang - 90) * Math.PI / 180, R = 29;
            const px = 50 + R * Math.cos(rad), py = 50 + R * Math.sin(rad);
            return `<div class="seg"><span style="left:${px.toFixed(2)}%;top:${py.toFixed(2)}%">${foodEmoji(m, i)}</span></div>`;
          }).join('')}
          <div class="hub" style="left:calc(50% - 32px);top:calc(50% - 32px)">${cimo(App.mood, 52)}</div>
        </div>
      </div>

        <p>${t('spin_sub')}</p>
        <button class="btn block" id="spinBtn">${icon('wheel')} ${t('spin_go')}</button>
        <div id="spinResult"></div>
        <div id="spinHist"></div>
      </div>
    </div>
  </div>`;
}

function doSpin() {
  if (App.spinning) return;
  const wheel = $('#wheel'); if (!wheel) return;
  const items = wheelItems(), n = items.length, seg = 360 / n;
  const idx = Math.floor(Math.random() * n);
  const center = idx * seg + seg / 2;
  const jitter = (Math.random() - 0.5) * (seg * 0.55);
  const turns = 5 + Math.floor(Math.random() * 3);
  const prev = Number(wheel.dataset.rot || 0);
  const target = prev + turns * 360 + (360 - center) + jitter;
  wheel.dataset.rot = target;
  App.spinning = true;
  SFX.play('spin');
  SFX.spinTicks(4200);
  wheel.style.transition = 'transform 4.6s cubic-bezier(.12,.72,.06,1)';
  wheel.style.transform = `rotate(${target}deg)`;
  setTimeout(() => {
    App.spinning = false;
    App.lastSpin = items[idx];
    App.spinHist = (App.spinHist || []).concat(items[idx].name).slice(-8);
    SFX.play('success');
    renderSpinResult(items[idx]);
    if (App.user) DB.logSpin(App.user.id, items[idx].id).catch(() => {});
  }, 4700);
}

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text) return;
  const input = $('#chatInput');
  if (input) { input.value = ''; input.style.height = 'auto'; }
  $('#sendBtn').disabled = true;
  addMsg('me', text);
  SFX.play('tap');
  if (App.user) DB.logChat(App.user.id, 'user', text).catch(() => {});

  const b = $('#chatBody');
  const typing = document.createElement('div');
  typing.className = 'msg'; typing.id = 'typing';
  typing.innerHTML = `<div class="av">${cimo(App.mood, 26)}</div><div class="typing"><i></i><i></i><i></i></div>`;
  b.appendChild(typing); b.scrollTop = b.scrollHeight;

  const res = await ChatEngine.reply(text);
  await new Promise(r => setTimeout(r, 420 + Math.random() * 480));
  const tp = $('#typing'); if (tp) tp.remove();

  addMsg('cimo', res.text, res.mood);
  App.mood = normMood(res.mood);
  renderChips(res.chips);
  if (App.user) DB.logChat(App.user.id, 'cimo', res.text).catch(() => {});

  if (App.settings.speak && Voice.supported) {
    Voice.speak(String(res.speak || res.text).replace(/\*[^*]+\*/g, ''), { lang: App.settings.voiceLang || App.lang });
  }
  updatePetFace();
}

/* ---------- recap ---------- */
function iso(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
function moodMap() {
  const map = {}, now = new Date();
  if (App.user) DB.moodsOf(App.user.id).forEach(x => { map[x.d] = x.m; });
  // gentle demo data for earlier days so the calendar never looks empty
  const keys = MOODS.map(m => m.k);
  for (let d = 1; d < now.getDate(); d++) {
    const k = iso(now.getFullYear(), now.getMonth(), d);
    if (!map[k]) { const h = (d * 7 + 3) % 11; if (h < 7) map[k] = keys[(d * 5 + h) % keys.length]; }
  }
  if (!map[iso(now.getFullYear(), now.getMonth(), now.getDate())]) map[iso(now.getFullYear(), now.getMonth(), now.getDate())] = App.mood;
  return map;
}
function viewRecap() {
  return `<div class="pagetitle"><div><h1>${t('recap_t')}</h1><p>${t('recap_sub')}</p></div>
    <button class="btn sm ghost" id="recapShare">${icon('share')} ${t('cart_share')}</button></div>
  <div class="card"><div class="stats">
    <div><b id="s1">0</b><span>${t('recap_day')}</span></div>
    <div><b id="s2">0</b><span>${t('recap_streak')}</span></div>
    <div><div id="s3" style="width:44px;height:44px;margin:0 auto"></div><span>${t('recap_top')}</span></div>
  </div></div>
  <div class="card" style="margin-top:12px"><b id="calTitle" style="font-size:1rem"></b><div class="cal" id="cal"></div></div>
  <div class="card" style="margin-top:12px"><b style="font-size:.95rem">${t('recap_t')}</b><div class="bars" id="bars"></div></div>`;
}
function renderRecap() {
  const map = moodMap(), now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  const dim = new Date(y, mo + 1, 0).getDate(), off = (new Date(y, mo, 1).getDay() + 6) % 7;
  const keys = Object.keys(map);
  $('#s1').textContent = keys.length;
  let streak = 0, cur = new Date();
  while (map[iso(cur.getFullYear(), cur.getMonth(), cur.getDate())]) { streak++; cur.setDate(cur.getDate() - 1); }
  $('#s2').textContent = streak;
  const cnt = {}; Object.values(map).forEach(k => cnt[k] = (cnt[k] || 0) + 1);
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  $('#s3').innerHTML = top ? cimo(top[0], 40) : '';
  const BLN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
  $('#calTitle').textContent = `${BLN[mo]} ${y}`;
  let h = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'].map(d => `<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(off);
  for (let d = 1; d <= dim; d++) {
    const k = map[iso(y, mo, d)], today = d === now.getDate();
    h += `<div class="cd ${today ? 'today' : ''}" title="${k ? MOODLBL[k] : '—'}"><span>${d}</span>${k ? `<div class="mini">${cimo(k, 30)}</div>` : ''}</div>`;
  }
  $('#cal').innerHTML = h;
  const mx = Math.max(1, ...Object.values(cnt));
  $('#bars').innerHTML = MOODS.map(m => {
    const v = cnt[m.k] || 0;
    return `<div class="bar"><span style="width:96px;display:flex;align-items:center;gap:6px"><span style="width:22px;height:22px;flex:none">${cimo(m.face, 20)}</span>${mL(m)}</span>
      <div class="tr"><i style="width:${(v / mx) * 100}%;background:${m.c}"></i></div><b style="width:26px;text-align:right;font-size:.72rem">${v}</b></div>`;
  }).join('');
}

function svgDataUrl(mood, size, costume) {
  let s = cimo(mood, size, false, costume || '');
  const m = s.match(/<svg[^>]*>/);
  if (m && m[0].indexOf('xmlns') === -1) s = s.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  s = s.replace(`width="${size}"`, `width="${size}" height="${Math.round(size * 185 / 200)}"`);
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
}

async function buildShareCard() {
  const W = 1000, H = 1300;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  const moodObj = MOODS.find(m => m.k === App.mood) || MOODS[0];
  const c0 = MOODC[moodObj.face] || MOODC.def;

  /* soft dotted backdrop */
  x.fillStyle = '#fdf4f8'; x.fillRect(0, 0, W, H);
  x.fillStyle = 'rgba(255,255,255,.8)';
  for (let i = 16; i < W; i += 30) for (let j = 16; j < H; j += 30) { x.beginPath(); x.arc(i, j, 2.2, 0, 7); x.fill(); }

  /* mood-tinted card (mockup story card) */
  const CX = 64, CY = 56, CW = W - 128, CH = H - 112, R = 56;
  const g = x.createLinearGradient(0, CY, 0, CY + CH);
  g.addColorStop(0, c0[0]); g.addColorStop(0.58, c0[1]); g.addColorStop(1, '#ffd9e8');
  roundRect(x, CX, CY, CW, CH, R); x.fillStyle = g; x.fill();
  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = 5; x.stroke();

  /* brand + mood */
  x.textAlign = 'center';
  x.fillStyle = '#3a2142';
  x.font = '700 48px Fredoka, Nunito, sans-serif';
  x.fillText('CraveMood', W / 2, CY + 122);

  x.fillStyle = 'rgba(58,33,66,.55)';
  x.font = '700 30px Nunito, sans-serif';
  x.fillText(t('share_mood_today'), W / 2, CY + 184);

  x.fillStyle = '#3a2142';
  x.font = '700 80px Fredoka, Nunito, sans-serif';
  x.fillText(mL(moodObj), W / 2, CY + 278);

  /* mascot */
  try {
    const img = await loadImg(svgDataUrl(moodObj.face, 440, App.costum));
    x.drawImage(img, W / 2 - 220, CY + 282, 440, 407);
  } catch (e) {}

  /* recommendation card */
  const rx = 168, ry = CY + 700, rw = W - 336, rh = 214;
  x.fillStyle = 'rgba(255,255,255,.95)';
  roundRect(x, rx, ry, rw, rh, 34); x.fill();

  x.fillStyle = 'rgba(58,33,66,.5)';
  x.font = '700 28px Nunito, sans-serif';
  x.fillText(t('share_rec'), W / 2, ry + 58);

  const cartIds = Object.keys(App.cart);
  let pick = cartIds.length ? MENU.find(m => m.id === cartIds[0]) : null;
  if (!pick) pick = recList()[0] || MENU.find(m => m.moods.indexOf(App.mood) > -1) || MENU[0];

  x.fillStyle = '#3a2142';
  x.font = '700 48px Fredoka, Nunito, sans-serif';
  const pn = pick ? pick.name : 'Coto Makassar';
  x.fillText(pn.length > 20 ? pn.slice(0, 19) + '…' : pn, W / 2, ry + 120);

  x.fillStyle = 'rgba(58,33,66,.6)';
  x.font = '700 26px Nunito, sans-serif';
  const sub = pick ? `${pick.stall} · ${distOf(pick).toFixed(1).replace('.', ',')} km` : 'Coto Daeng Tata · 1,2 km';
  x.fillText(sub.length > 34 ? sub.slice(0, 33) + '…' : sub, W / 2, ry + 168);

  /* footer */
  x.fillStyle = 'rgba(58,33,66,.45)';
  x.font = '700 26px Nunito, sans-serif';
  x.fillText('cravemood.id', W / 2, CY + CH - 52);

  const dataUrl = cv.toDataURL('image/jpeg', 0.92);
  const blob = await canvasToBlob(cv);
  return { blob, dataUrl };
}

/* toBlob can silently never fire (or OOM on huge PNGs) — fall back to the data URL bytes */
function canvasToBlob(cv) {
  return new Promise(resolve => {
    let done = false;
    const finish = b => { if (!done) { done = true; resolve(b); } };
    try { cv.toBlob(b => finish(b), 'image/jpeg', 0.92); } catch (e) {}
    setTimeout(() => {
      if (done) return;
      try {
        const url = cv.toDataURL('image/jpeg', 0.92);
        const bin = atob(url.split(',')[1]);
        const u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        finish(new Blob([u8], { type: 'image/jpeg' }));
      } catch (e) { finish(null); }
    }, 2200);
  });
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    const to = setTimeout(() => rej(new Error('img timeout')), 1200);
    i.onload = () => { clearTimeout(to); res(i); };
    i.onerror = () => { clearTimeout(to); rej(new Error('img error')); };
    i.src = src;
  });
}

async function shareTo(k, blob, caption, url) {
  SFX.play('tap');
  const text = encodeURIComponent(caption);
  const u = encodeURIComponent(url);
  if (k === 'ig') {
    const file = new File([blob], 'cravemood.jpg', { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], text: caption, title: 'CraveMood' }); return; }
      catch (e) { /* user cancelled */ }
    }
    downloadBlob(blob); copyText(caption);
    toast('Gambar tersimpan & caption disalin. Buka Instagram → Story → unggah.');
    return;
  }
  const links = {
    wa: 'https://wa.me/?text=' + encodeURIComponent(caption + '\n' + url),
    tg: 'https://t.me/share/url?url=' + u + '&text=' + text,
    x: 'https://twitter.com/intent/tweet?text=' + text + '&url=' + u,
    fb: 'https://www.facebook.com/sharer/sharer.php?u=' + u,
  };
  window.open(links[k], '_blank', 'noopener,width=620,height=620');
}
function downloadBlob(blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cravemood-' + App.mood + '-' + Date.now() + '.jpg';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function copyText(txt) {
  if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}

/* ---------- pet ---------- */
function mountPet() {
  const p = $('#pet');
  p.innerHTML = cimo(App.mood, 66) + '<div class="bubble" id="petBubble"></div><div class="hintdot"></div>';
  if (App.pet) { p.style.left = App.pet.x + 'px'; p.style.top = App.pet.y + 'px'; p.style.right = 'auto'; p.style.bottom = 'auto'; }
  let drag = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  p.addEventListener('pointerdown', e => {
    drag = true; moved = false;
    const r = p.getBoundingClientRect();
    sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    p.setPointerCapture(e.pointerId); p.classList.add('drag');
  });
  p.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    const nx = Math.max(6, Math.min(window.innerWidth - 76, ox + dx));
    const ny = Math.max(6, Math.min(window.innerHeight - 76, oy + dy));
    p.style.left = nx + 'px'; p.style.top = ny + 'px'; p.style.right = 'auto'; p.style.bottom = 'auto';
  });
  p.addEventListener('pointerup', e => {
    if (!drag) return;
    drag = false; p.classList.remove('drag');
    if (moved) {
      const r = p.getBoundingClientRect();
      App.pet = { x: Math.round(r.left), y: Math.round(r.top) };
      savePrefs();
    } else {
      go('chat'); SFX.play('pop');
    }
  });
  p.addEventListener('dblclick', () => {
    App.pet = null; p.style.left = ''; p.style.top = ''; p.style.right = ''; p.style.bottom = '';
    savePrefs(); toast('Posisi Cimo direset');
  });
  updatePetFace();
}
function updatePetFace() {
  const p = $('#pet');
  if (!p) return;
  p.innerHTML = cimo(App.mood, 66) + '<div class="bubble" id="petBubble"></div><div class="hintdot"></div>';
}

function go(v) {

}
function render() {
  const v = currentView;
  applyMoodBg();
  $('#view').innerHTML = RENDER[v]();
  $$('#navlist .navbtn, #tabbar button').forEach(b => b.classList.toggle('on', b.dataset.go === v));
  if (v === 'home') { renderRecs(); }
  if (v === 'spin') {
    if (App.lastSpin) renderSpinResult(App.lastSpin);
    else {
      $('#spinResult').innerHTML = `<p class="hint" style="margin-top:14px">Tekan <b>Putar roda</b> dan biar Cimo yang mutusin. Kamu tinggal bilang cocok atau nggak.</p>`;

    }

  if (v === 'chat') {
    if (!App.messages.length) {
      ChatEngine.setName(App.user ? App.user.name : '');
      App.messages.push({ role: 'cimo', text: ChatEngine.greet(App.user ? App.user.name : ''), mood: App.mood });

    const vt = $('#voiceToggle'); if (vt) vt.style.color = App.settings.speak ? 'var(--pk2)' : 'var(--mu)';

/* ---------- global events ---------- */
function bindGlobal() {
  document.addEventListener('click', e => {
    SFX.init();
    const g = e.target.closest('[data-go]');
    if (g) { SFX.play('tap'); go(g.dataset.go); return; }

    const ins = e.target.closest('[data-install]');
    if (ins) { SFX.play('tap'); openInstall(ins.dataset.install); return; }

    const add = e.target.closest('[data-add]');
    if (add) { addToCart(add.dataset.add); flyToCart(add); return; }
    const inc = e.target.closest('[data-inc]');
    if (inc) { addToCart(inc.dataset.inc, true); return; }
    const dec = e.target.closest('[data-dec]');
    if (dec) { decCart(dec.dataset.dec); return; }
    const mood = e.target.closest('[data-mood]');
    if (mood) {
      const firstPick = !App.moodPicked;
      App.mood = mood.dataset.mood;
      App.moodPicked = true;
      ChatEngine.setMood(App.mood);
      SFX.play('pop');
      savePrefs();
      if (firstPick) {
        /* reveal the whole recommendation block for the first time */
        render();
        updatePetFace();
      } else {
        applyMoodBg();
        const hc = $('#heroCimo');
        if (hc) { hc.innerHTML = cimo(App.mood, 40, false, App.costum); hc.classList.add('hop'); setTimeout(() => hc.classList.remove('hop'), 650); }
        const sc = $('#sayCimo');
        if (sc) { sc.innerHTML = cimo(App.mood, 208, false, App.costum); sc.classList.add('hop'); setTimeout(() => sc.classList.remove('hop'), 650); }
        $$('#moods .mpill').forEach(b => b.classList.toggle('on', b.dataset.mood === App.mood));
        renderRecs();
        updatePetFace();
      }
      if (App.user) DB.addMood(App.user.id, App.mood).catch(() => {});
      const mo = MOODS.find(m => m.k === App.mood);
      if (mo) {
        const top = recList()[0];
        const line = mSay(mo, top ? top.name : '');
        const sayEl = $('#say');
        if (sayEl) {
          sayEl.textContent = line;
          sayEl.style.animation = 'none'; void sayEl.offsetWidth; sayEl.style.animation = '';
        }
        const tagEl = $('#moodTag'); if (tagEl) tagEl.textContent = mS(mo);
        /* on Beranda the speech bubble already says it — don't cover the CTA with the pet bubble */
        if (currentView !== 'home') petSay(line.length > 62 ? line.slice(0, 60) + '…' : line);
        if (App.settings.speak) {
          if (sayEl) sayEl.classList.add('talking');
          const pr = Voice.speakMood(mo.k, top ? top.id : '', line);
          if (pr && pr.then) pr.then(() => { const e2 = $('#say'); if (e2) e2.classList.remove('talking'); });
        }
      }
      return;
    }
    const cat = e.target.closest('[data-cat]');
    if (cat) { App.cat = cat.dataset.cat; SFX.play('tap'); $$('#cats .chip').forEach(b => b.classList.toggle('on', b.dataset.cat === App.cat)); renderRecs(); return; }
    const plat = e.target.closest('[data-plat]');
    if (plat) { openPlatform(plat.dataset.plat); return; }
    const shop = e.target.closest('[data-shop]');
    if (shop) { try { window.open(shop.dataset.shop, '_blank', 'noopener'); } catch (err) {} return; }
    const cos = e.target.closest('[data-costum]');
    if (cos) {
      if (!isVip()) { toast(t('vip_only')); SFX.play('error'); return; }
      App.costum = cos.dataset.costum || '';
      savePrefs(); SFX.play('pop'); render(); toast(t('prof_saved'));
      return;
    }
    const lang = e.target.closest('[data-lang]');
    if (lang) { setLang(lang.dataset.lang); return; }
    const chip = e.target.closest('[data-chip]');
    if (chip) { sendChat(chip.dataset.chip); return; }
    const soc = e.target.closest('[data-soc]');
    if (soc) { return; }
  });

  document.addEventListener('change', e => {
    const id = e.target.id;
    if (id === 'streetSel') {
      App.street = e.target.value; savePrefs(); SFX.play('tap');
      renderRecs();
      const sf = $('#sidefoot'); if (sf) renderNav();
      toast('Lokasi: ' + curStreet().name);
    }
    if (id === 'soundSw') { App.settings.sound = e.target.checked; SFX.enabled = e.target.checked; saveSettings(); if (e.target.checked) SFX.play('add'); }
    if (id === 'speakSw') { App.settings.speak = e.target.checked; Voice.set('enabled', e.target.checked); saveSettings(); if (e.target.checked) Voice.preview(); }
    if (id === 'darkSw') { App.settings.theme = e.target.checked ? 'dark' : 'light'; saveSettings(); applyTheme(); }
  });

  document.addEventListener('input', e => {
    const id = e.target.id;
    if (id === 'vol') { App.settings.vol = +e.target.value; $('#volV').textContent = Math.round(e.target.value * 100) + '%'; Voice.set('volume', App.settings.vol); saveSettings(); }
    if (id === 'chatInput') {
      const el = e.target;
      el.style.height = 'auto'; el.style.height = Math.min(110, el.scrollHeight) + 'px';
      $('#sendBtn').disabled = !el.value.trim();
    }
  });

  document.addEventListener('keydown', e => {
    if (e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      const v = e.target.value.trim(); if (v) sendChat(v);
    }
    if (e.key === 'Escape') { $$('.modal.on').forEach(m => m.classList.remove('on')); }
  });

  // delegated handlers for dynamically rendered blocks (target may be a child svg/path)
  document.addEventListener('click', e => {
    const hit = sel => e.target.closest(sel);
    if (hit('#shuffleBtn')) { openSpinPop(); return; }
    if (hit('#spinBtn')) { doSpin(); return; }
    if (hit('#spinAgain')) { doSpin(); return; }
    if (hit('#openShare') || hit('#recapShare')) { openShare(); return; }
    if (hit('#testVoice')) { Voice.preview(); return; }
    if (hit('#startVip')) { openVipModal(); return; }
    if (hit('#logoutBtn')) { DB.setSetting('session', null); location.reload(); return; }
    if (hit('#chatReset')) {
      App.messages = []; ChatEngine.reset();
      const g = ChatEngine.greet(App.user ? App.user.name : '');
      App.messages.push({ role: 'cimo', text: g, mood: App.mood });
      renderMessages(); renderChips(); toast('Chat direset'); return;
    }
    if (hit('#voiceToggle')) {
      App.settings.speak = !App.settings.speak; saveSettings();
      toast(App.settings.speak ? 'Suara Cimo: ON' : 'Suara Cimo: OFF');
      hit('#voiceToggle').style.color = App.settings.speak ? 'var(--pk2)' : 'var(--mu)';
      if (App.settings.speak) Voice.preview();
      return;
    }
    if (hit('#sendBtn')) { const v = $('#chatInput').value.trim(); if (v) sendChat(v); return; }
    if (hit('#micBtn')) { startMic(); return; }
    if (e.target.closest('#shareModal .closebtn') || e.target.id === 'shareModal') { $('#shareModal').classList.remove('on'); return; }
    if (e.target.closest('#installModal .closebtn') || e.target.id === 'installModal') { $('#installModal').classList.remove('on'); return; }
    if (e.target.closest('#spinModal .closebtn') || e.target.id === 'spinModal') { $('#spinModal').classList.remove('on'); SFX.stopTicks(); return; }
  });

  window.addEventListener('hashchange', () => {
    const v = (location.hash || '#/home').replace('#/', '');
    if (RENDER[v] && v !== currentView) { currentView = v; render(); }
  });
  window.addEventListener('resize', () => {
    const p = $('#pet');
    if (p && p.style.left) {
      const r = p.getBoundingClientRect();
      const nx = Math.min(r.left, window.innerWidth - 76), ny = Math.min(r.top, window.innerHeight - 76);
      p.style.left = nx + 'px'; p.style.top = ny + 'px';
    }
  });
}

function flyToCart(btn) {
  const target = $('#cartbar');
  if (!target) return;
  const r = btn.getBoundingClientRect();
  const s = document.createElement('span');
  s.textContent = '🍡';
  s.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;font-size:22px;pointer-events:none;z-index:70;transition:all .7s cubic-bezier(.3,-0.2,.6,1)`;
  document.body.appendChild(s);
  const tr = target.getBoundingClientRect();
  requestAnimationFrame(() => {
    s.style.left = (tr.left + tr.width / 2) + 'px';
    s.style.top = (tr.top + 10) + 'px';
    s.style.transform = 'scale(.4) rotate(30deg)';
    s.style.opacity = '0';
  });
  setTimeout(() => s.remove(), 750);
}

/* ---------- mic ---------- */
let recog = null, micOn = false;
function startMic() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $('#micBtn');
  if (!SR) { toast('Browser ini belum mendukung input suara. Coba Chrome.'); return; }
  if (micOn && recog) { recog.stop(); return; }
  recog = new SR();
  recog.lang = { id: 'id-ID', en: 'en-US', zh: 'zh-CN', hi: 'hi-IN' }[App.settings.voiceLang || App.lang] || 'id-ID';
  recog.interimResults = false; recog.maxAlternatives = 1;
  recog.onstart = () => { micOn = true; btn.classList.add('on'); $('#chatStatus').textContent = 'Mendengarkan…'; };
  recog.onend = () => { micOn = false; btn.classList.remove('on'); $('#chatStatus').textContent = t('chat_on'); };
  recog.onerror = () => { micOn = false; btn.classList.remove('on'); toast('Suara tidak tertangkap. Coba lagi.'); };
  recog.onresult = ev => {
    const txt = ev.results[0][0].transcript;
    if (txt) sendChat(txt);
  };
  try { recog.start(); } catch (e) { toast('Mikrofon tidak bisa dimulai.'); }
}

/* ---------- language ---------- */
function setLang(l) {
  if (!I18N[l]) return;
  App.lang = l; App.settings.voiceLang = l;
  Voice.set('lang', l); ChatEngine.setLang(l);
  savePrefs(); saveSettings();
  renderNav(); render();
  SFX.play('pop');
  toast(I18N[l].tagline);
}

/* ---------- boot ---------- */
async function boot() {
  await DB.init();
  loadPrefs(); loadCart(); applyTheme();
  SFX.enabled = App.settings.sound;

  const sid = DB.getSetting('session', null);
  if (sid) {
    try { App.user = await DB.me(sid); } catch (e) { App.user = null; }
  }
  if (App.user) {
    App.lang = App.user.lang || App.lang;
    ChatEngine.setLang(App.lang); ChatEngine.setName(App.user.name);
    Voice.set('lang', App.settings.voiceLang || App.lang);
    $('#onboard').classList.add('hide');
    boot2();
  } else {
    obLang = App.lang;
    showOnboard();
  }
}

/* ---------- a soft click on every tappable ---------- */
function initClickSound() {
  if (window.__clickInit) return;
  window.__clickInit = true;
  const SEL = 'button, [role="button"], .chip, .mpill, .langopt, .cosopt, .plat, .fadd, .iconbtn, .tabbar button, .step button, .card, .pickcard, select';
  /* any tap anywhere silences Cimo first; the tap handler below may start a new line */
  document.addEventListener('click', () => Voice.stop(), { capture: true, passive: true });
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest(SEL);
    if (!el || el.disabled) return;
    if (el.hasAttribute('data-add') || el.hasAttribute('data-dec') || el.hasAttribute('data-inc')) return;
    SFX.init();
    SFX.play('tap');
  }, { passive: true, capture: true });
}

/* ---------- Cimo looks at your finger / cursor ---------- */
function initEyeTracking() {
  if (window.__eyeInit) return;
  window.__eyeInit = true;
  let raf = 0, px = 0, py = 0, has = false;
  const SEL = '.bigcimo .ceye, .avatar-lg .ceye, .pet .ceye, .splash .hero-cimo .ceye, .cosopt .ceye';

  function apply() {
    raf = 0;
    if (!has) return;
    const eyes = document.querySelectorAll(SEL);
    for (const g of eyes) {
      const svg = g.ownerSVGElement;
      if (!svg) continue;
      const r = svg.getBoundingClientRect();
      if (r.width < 20) continue;
      const cx = r.left + r.width * 0.5;
      const cy = r.top + r.height * 0.42;
      const dx = px - cx, dy = py - cy;
      const d = Math.hypot(dx, dy) || 1;
      const reach = Math.min(1, d / Math.max(120, r.width * 0.9));
      const ox = (dx / d) * 5 * reach;
      const oy = (dy / d) * 4 * reach;
      g.setAttribute('transform', `translate(${ox.toFixed(2)} ${oy.toFixed(2)})`);
    }
  }
  function onMove(e) {
    const t = e.touches && e.touches[0] ? e.touches[0] : e;
    if (t.clientX == null) return;
    px = t.clientX; py = t.clientY; has = true;
    if (!raf) raf = requestAnimationFrame(apply);
  }
  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('touchstart', onMove, { passive: true });
  window.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('scroll', () => { if (has && !raf) raf = requestAnimationFrame(apply); }, { passive: true });
}

/* ---------- self-update: an already-open app refreshes after a new deploy ---------- */
function checkBuild() {
  try {
    const m = document.querySelector('meta[name="build"]');
    if (!m || !m.content) return;
    fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        if (!j || !j.v || j.v === m.content) return;
        const u = new URL(location.href);
        if (u.searchParams.get('v') === j.v) return;   // already tried this build
        u.searchParams.set('v', j.v);
        location.replace(u.toString());
      })
      .catch(() => {});
  } catch (e) {}
}

function boot2() {
  checkBuild();
  $('#app').classList.remove('hide');
  renderNav();
  mountPet();
  registerSW();
  initEyeTracking();
  initClickSound();
  Voice.set('name', (App.user && App.user.name) || '');
  /* costumes are a VIP perk — plain users always see the plain Cimo */
  if (!isVip() && App.costum) { App.costum = ''; savePrefs(); }
  /* system voices arrive asynchronously, refresh the picker once they do */
  if (window.speechSynthesis && window.speechSynthesis.addEventListener) {
    let refreshed = false;
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      if (refreshed) return;
      refreshed = true;
      if (currentView === 'profile') render();
    });
  }
  const hash = (location.hash || '#/home').replace('#/', '');
  currentView = RENDER[hash] ? hash : 'home';
  render();
  updateCartBar();
  if (App.user) DB.touch(App.user.id).catch(() => {});
  // seed a mood for today so the recap is alive
  if (App.user) DB.addMood(App.user.id, App.mood).catch(() => {});
  if (PLAT.mobile && !PLAT.standalone) setTimeout(maybeShowBanner, 5200);
}

document.addEventListener('DOMContentLoaded', () => {
  bindGlobal();
  boot();
});

</script>
