name: Build Android APK

# Menghasilkan file APK CraveMood tanpa perlu Android Studio di komputer.
# Jalankan otomatis setiap push ke main, atau manual dari tab Actions -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Siapkan aset web
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png www/
          cp favicon.png favicon-16.png favicon-64.png gopay-logo.png www/ 2>/dev/null || true
          cp qris-cimo.png qris-logo.png www/ 2>/dev/null || true
          cp -r audio www/ 2>/dev/null || true

      - name: Pasang Capacitor
        run: |
          npm i -D @capacitor/cli@6
          npm i @capacitor/core@6 @capacitor/android@6
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: cravemood-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
